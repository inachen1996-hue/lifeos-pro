                <button onClick={() => setReviewTab('habit')} className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${reviewTab === 'habit' ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' : 'text-slate-400 hover:bg-slate-50'}`}>习惯打卡</button>
              </div>
              
              {reviewTab === 'review' && (
                <>
                  <div className="bg-white p-1.5 rounded-2xl shadow-sm flex gap-1 border border-slate-100">{['today', 'yesterday', 'weekly', 'monthly'].map(s => (<button key={s} onClick={() => setReviewScope(s)} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${reviewScope === s ? 'bg-airy-gray-card text-airy-purple-deep border border-airy-purple-soft shadow-airy-soft airy-button shadow-sm' : 'text-slate-400 hover:bg-slate-50'}`}>{s === 'today' ? '今日' : s === 'yesterday' ? '昨日' : s === 'weekly' ? '本周' : '本月'}</button>))}</div>
              <div className="text-center -mb-2"><span className="bg-airy-gray-card px-4 py-1 rounded-full text-xs font-bold text-airy-gray-dark border border-macaron-orange/30">📅 {dateRangeStr}</span></div>
              <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 min-h-[400px] relative overflow-hidden">
                {isLoading ? (<div className="absolute inset-0 flex flex-col items-center justify-center bg-white/95 z-20"><Loader2 className="w-12 h-12 text-airy-purple-deep animate-spin mb-4"/><p className="text-slate-500 font-bold text-base animate-pulse">{loading.text}</p></div>) : !data ? (<div className="flex flex-col items-center justify-center h-full p-10 text-center"><div className="w-24 h-24 bg-airy-gray-card rounded-full flex items-center justify-center mb-6"><Sparkles className="w-12 h-12 text-macaron-orange"/></div><p className="text-slate-400 mb-8 font-bold text-lg">生成一份治愈的复盘报告吧</p><button onClick={() => generateReview(reviewScope)} className="bg-airy-gray-card text-airy-purple-deep border border-airy-purple-soft shadow-airy-soft airy-button px-10 py-4 rounded-full font-bold text-lg shadow-airy-soft hover:shadow-airy-hover transition-all transform hover:-translate-y-1">开始生成</button></div>) : (<div className="p-8 animate-in"><div className="flex justify-center mb-6"><button onClick={() => generateReview(reviewScope)} className="bg-slate-100 text-slate-400 px-6 py-2 rounded-full text-xs font-bold hover:bg-slate-200 transition-colors flex items-center gap-1"><RefreshCcw className="w-3 h-3"/> 刷新数据</button></div><div className="bg-airy-gray-card p-6 rounded-3xl mb-8 border border-orange-100/50 relative"><div className="absolute top-0 left-6 -translate-y-1/2 bg-macaron-orange text-orange-800 px-3 py-1 rounded-full text-xs font-bold">SUMMARY</div><p className="text-base text-slate-600 leading-relaxed font-medium mt-2">"{data.summary}"</p></div>{data.insights && (<div className="mb-8 space-y-3"><h4 className="font-bold text-airy-gray-dark text-base flex items-center gap-2"><Lightbulb className="w-5 h-5 text-macaron-yellow"/> 洞察时刻</h4><FormattedText text={data.insights.join('\n')} /></div>)}<div className="space-y-2"><MacaronProgressBar label="工作" target={allocations.work * multiplier} actual={data.actual_allocation?.work || 0} colorBg="bg-indigo-50" colorBar="bg-macaron-blue" /><MacaronProgressBar label="学习" target={allocations.study * multiplier} actual={data.actual_allocation?.study || 0} colorBg="bg-teal-50" colorBar="bg-airy-green" /><MacaronProgressBar label="休息" target={allocations.rest * multiplier} actual={data.actual_allocation?.rest || 0} colorBg="bg-pink-50" colorBar="bg-airy-pink-light" /><MacaronProgressBar label="睡眠" target={allocations.sleep * multiplier} actual={data.actual_allocation?.sleep || 0} colorBg="bg-slate-50" colorBar="bg-macaron-purple" /><MacaronProgressBar label="生活" target={allocations.life * multiplier} actual={data.actual_allocation?.life || 0} colorBg="bg-orange-50" colorBar="bg-macaron-orange" /><MacaronProgressBar label="娱乐" target={allocations.entertainment * multiplier} actual={data.actual_allocation?.entertainment || 0} colorBg="bg-yellow-50" colorBar="bg-macaron-yellow" /><MacaronProgressBar label="健康" target={allocations.health * multiplier} actual={data.actual_allocation?.health || 0} colorBg="bg-emerald-100" colorBar="bg-emerald-200" /><MacaronProgressBar label="兴趣" target={allocations.hobby * multiplier} actual={data.actual_allocation?.hobby || 0} colorBg="bg-pink-100" colorBar="bg-airy-rose" /></div></div>)}</div>

              {reviewTab === 'progress' && <ProgressTabContent

              {reviewTab === 'habit' && (() => {
                // 习惯打卡功能
                const HABIT_COLORS = [
                  { id: 'pink', bg: 'bg-airy-pink-light', text: 'text-pink-700', border: 'border-pink-300' },
                  { id: 'blue', bg: 'bg-airy-blue', text: 'text-blue-700', border: 'border-blue-300' },
                  { id: 'green', bg: 'bg-airy-green', text: 'text-teal-700', border: 'border-teal-300' },
                  { id: 'purple', bg: 'bg-airy-purple-light', text: 'text-purple-700', border: 'border-purple-300' },
                  { id: 'orange', bg: 'bg-macaron-orange', text: 'text-orange-700', border: 'border-orange-300' },
                  { id: 'yellow', bg: 'bg-macaron-yellow', text: 'text-yellow-700', border: 'border-yellow-300' },
                ];

                // 从历史数据中统计习惯打卡记录
                const calculateHabitRecords = (habit) => {
                  const records = {};
                  if (!fullHistory) return records;
                  
                  const lines = fullHistory.split('\n');
                  lines.forEach(line => {
                    const dateMatch = line.match(/(\d{4}-\d{1,2}-\d{1,2})/);
                    if (!dateMatch) return;
                    
                    const date = dateMatch[1];
                    const normalizedDate = formatDate(new Date(date));
                    
                    // 检查是否匹配任何关键词
                    const matched = habit.eventKeywords.some(keyword => 
                      line.toLowerCase().includes(keyword.toLowerCase())
                    );
                    
                    if (matched) {
                      if (!records[normalizedDate]) {
                        records[normalizedDate] = { count: 0, events: [] };
                      }
                      records[normalizedDate].count++;
                      records[normalizedDate].events.push(line.trim());
                    }
                  });
                  
                  return records;
                };

                // 计算当前周期的完成情况
                const calculateProgress = (habit, records) => {
                  const today = new Date();
                  let startDate, endDate = today;
                  let targetCount = habit.frequency.target;
                  
                  if (habit.frequency.type === 'daily') {
                    startDate = today;
                  } else if (habit.frequency.type === 'weekly') {
                    startDate = getMonday(today);
                  } else if (habit.frequency.type === 'monthly') {
                    startDate = getStartOfMonth();
                  }
                  
                  let actualCount = 0;
                  const current = new Date(startDate);
                  while (current <= endDate) {
                    const dateStr = formatDate(current);
                    if (records[dateStr]) {
                      actualCount += records[dateStr].count;
                    }
                    current.setDate(current.getDate() + 1);
                  }
                  
                  return { actualCount, targetCount, percentage: Math.min(100, (actualCount / targetCount) * 100) };
                };

                // 计算连续打卡天数
                const calculateStreak = (records) => {
                  const today = new Date();
                  let streak = 0;
                  let current = new Date(today);
                  
                  while (true) {
                    const dateStr = formatDate(current);
                    if (records[dateStr] && records[dateStr].count > 0) {
                      streak++;
                      current.setDate(current.getDate() - 1);
                    } else {
                      break;
                    }
                  }
                  
                  return streak;
                };

                // 渲染日历
                const renderCalendar = (habit, records) => {
                  const year = habitCalendarDate.getFullYear();
                  const month = habitCalendarDate.getMonth();
                  const firstDay = new Date(year, month, 1);
                  const lastDay = new Date(year, month + 1, 0);
                  const startDay = firstDay.getDay();
                  const daysInMonth = lastDay.getDate();
                  
                  const weeks = [];
                  let week = new Array(7).fill(null);
                  let dayCount = 1;
                  
                  // 填充第一周
                  for (let i = startDay; i < 7 && dayCount <= daysInMonth; i++) {
                    week[i] = dayCount++;
                  }
                  weeks.push(week);
                  
                  // 填充剩余周
                  while (dayCount <= daysInMonth) {
                    week = new Array(7).fill(null);
                    for (let i = 0; i < 7 && dayCount <= daysInMonth; i++) {
                      week[i] = dayCount++;
                    }
                    weeks.push(week);
                  }
                  
                  const colorConfig = HABIT_COLORS.find(c => c.id === habit.color) || HABIT_COLORS[0];
                  
                  return (
                    <div className="bg-white p-4 rounded-2xl border border-slate-100">
                      <div className="flex justify-between items-center mb-4">
                        <button 
                          onClick={() => setHabitCalendarDate(new Date(year, month - 1, 1))}
                          className="p-2 hover:bg-slate-100 rounded-lg"
                        >
                          <ChevronDown className="w-5 h-5 rotate-90" />
                        </button>
                        <span className="font-bold text-slate-700">
                          {year}年{month + 1}月
                        </span>
                        <button 
                          onClick={() => setHabitCalendarDate(new Date(year, month + 1, 1))}
                          className="p-2 hover:bg-slate-100 rounded-lg"
                        >
                          <ChevronDown className="w-5 h-5 -rotate-90" />
                        </button>
                      </div>
                      
                      <div className="grid grid-cols-7 gap-1 mb-2">
                        {['日', '一', '二', '三', '四', '五', '六'].map(day => (
                          <div key={day} className="text-center text-xs font-bold text-slate-400 py-1">
                            {day}
                          </div>
                        ))}
                      </div>
                      
                      <div className="grid grid-cols-7 gap-1">
                        {weeks.map((week, weekIdx) => (
                          week.map((day, dayIdx) => {
                            if (!day) return <div key={`${weekIdx}-${dayIdx}`} className="aspect-square" />;
                            
                            const dateStr = formatDate(new Date(year, month, day));
                            const record = records[dateStr];
                            const hasRecord = record && record.count > 0;
                            
                            return (
                              <div
                                key={`${weekIdx}-${dayIdx}`}
                                className={`aspect-square flex items-center justify-center rounded-lg text-sm font-bold transition-all ${
                                  hasRecord 
                                    ? `${colorConfig.bg} ${colorConfig.text} shadow-sm` 
                                    : 'bg-slate-50 text-slate-300'
                                }`}
                                title={hasRecord ? `${record.count}次` : '未打卡'}
                              >
                                {day}
                              </div>
                            );
                          })
                        ))}

              }) => {

                // 数据转换和处理
                useEffect(() => {
                  try {
                    const { currentStart, currentEnd } = getDateRangesForScope(progressScope);
                    const logsInRange = getLogsInDateRange(fullHistory, currentStart, currentEnd);
                    
                    // 转换数据格式
                    const items = logsInRange.split('\n').filter(l => l.trim()).map((line, idx) => {
                      const dateMatch = line.match(/(\d{4}-\d{1,2}-\d{1,2})/);
                      const durationMatch = line.match(/(\d+(\.\d+)?)\s*(h|m|min|hour)/i);
                      const categoryMatch = line.match(/\[(WORK|STUDY|REST|SLEEP|LIFE|ENTERTAINMENT|HEALTH|HOBBY)\]/i);
                      
                      let duration = 0;
                      if (durationMatch) {
                        const val = parseFloat(durationMatch[1]);
                        const unit = durationMatch[3].toLowerCase();
                        duration = unit.startsWith('m') ? val / 60 : val;
                      }
                      
                      const description = line
                        .replace(/\d{4}-\d{1,2}-\d{1,2}:\s*/, '')
                        .replace(/\[(WORK|STUDY|REST|SLEEP|LIFE|ENTERTAINMENT|HEALTH|HOBBY)\]\s*/i, '')
                        .replace(/\d+(\.\d+)?\s*(h|m|min|hour)/i, '')
                        .trim();
                      
                      return {
                        id: idx.toString(),
                        timestamp: dateMatch ? new Date(dateMatch[1]).toISOString() : new Date().toISOString(),
                        category: categoryMatch ? categoryMatch[1].toLowerCase() : 'work',
                        duration: duration * 3600, // 转换为秒
                        title: description,
                        metadata: { originalFormat: true, source: 'lifeos' }
                      };
                    }).filter(item => item.duration > 0);

                    setAchievementJarData(items);
                    setIsLoading(false);
                  } catch (err) {
                    console.error('Achievement Jar data processing error:', err);
                    setError(err);
                    setIsLoading(false);
                  }
                }, [fullHistory, progressScope]);

                // 错误处理 - 安全的降级处理
                if (error) {
                  console.warn('Achievement Jar failed, falling back to original interface');
                  // 安全调用 onToggleMode
                  if (typeof onToggleMode === 'function') {
                    onToggleMode();
                    return null;
                  } else {
                    // 如果没有 onToggleMode 函数，显示错误信息
                    return (
                      <div className="p-4 bg-red-50 border border-red-200 rounded-lg">

                          className="mt-2 px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600"
                        >
                          重试
                        </button>
                      </div>
                    );

              console.log('✅ React app rendered successfully');
            } catch (error) {
              console.error('❌ Failed to render React app:', error);
              document.getElementById('root').innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #FFF9F5; padding: 20px;">
                  <div style="text-align: center; max-width: 500px;">
                    <div style="background: #fee; padding: 20px; border-radius: 20px; margin-bottom: 20px;">
                      <h2 style="color: #c00; margin: 0 0 10px 0;">渲染失败</h2>
                      <p style="color: #666; font-size: 14px;">${error.message}</p>
                    </div>
                    <button onclick="location.reload()" style="background: #5D576B; color: white; padding: 12px 24px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">
                      刷新页面
                    </button>
                  </div>
                </div>
              `;
            }
          });
        }
        
        // 启动应用
        startApp();
        
        }); // 闭合 Promise.then
    </script>
</body>
</html>
