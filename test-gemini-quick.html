<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API 快速测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
    </script>
</head>
<body class="bg-gradient-to-br from-purple-50 to-pink-50 min-h-screen p-8">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white p-8 rounded-3xl shadow-xl">
            <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">💎 Gemini API 快速测试</h1>
            
            <div class="grid gap-6">
                <!-- CORS 解决方案说明 -->
                <div class="bg-green-50 p-6 rounded-2xl border border-green-200">
                    <h2 class="font-bold text-lg text-green-800 mb-3">✅ CORS 解决方案</h2>
                    <ul class="text-sm text-green-700 space-y-2">
                        <li>• 切换到 Gemini API 作为默认选择</li>
                        <li>• Gemini 支持浏览器直接调用，无 CORS 问题</li>
                        <li>• 功能强大，响应质量高</li>
                        <li>• 无需额外的代理服务器</li>
                    </ul>
                </div>

                <!-- 测试按钮 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button id="testBasic" class="py-4 bg-purple-500 text-white rounded-xl font-bold hover:bg-purple-600 transition-all">
                        🧪 基础功能测试
                    </button>
                    <button id="testJson" class="py-4 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600 transition-all">
                        📝 JSON 格式测试
                    </button>
                    <button id="testComplex" class="py-4 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 transition-all">
                        🎯 复杂任务测试
                    </button>
                    <button id="testConfig" class="py-4 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 transition-all">
                        ⚙️ 配置应用测试
                    </button>
                </div>

                <!-- 结果显示 -->
                <div id="result" class="bg-gray-50 p-6 rounded-2xl min-h-[200px]">
                    <h3 class="font-bold text-gray-800 mb-3">📊 测试结果</h3>
                    <p class="text-gray-500">点击按钮开始测试...</p>
                </div>

                <!-- 配置信息 -->
                <div class="bg-blue-50 p-6 rounded-2xl border border-blue-200">
                    <h3 class="font-bold text-blue-800 mb-3">🔧 当前配置</h3>
                    <div id="configInfo" class="text-sm text-blue-700"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from '@google/generative-ai';
        
        const API_KEY = 'AIzaSyAs95vJEeL-CkfTdvxeKgZsViKJtjAppBE';
        const resultDiv = document.getElementById('result');
        const configInfoDiv = document.getElementById('configInfo');

        function showResult(message, type = 'info') {
            const colors = {
                info: 'text-blue-700 bg-blue-100 border-blue-200',
                success: 'text-green-700 bg-green-100 border-green-200',
                error: 'text-red-700 bg-red-100 border-red-200'
            };

            const icons = {
                info: '🔄',
                success: '✅',
                error: '❌'
            };

            resultDiv.innerHTML = `
                <h3 class="font-bold text-gray-800 mb-3">📊 测试结果</h3>
                <div class="p-4 rounded-lg border ${colors[type]}">
                    <div class="flex items-start gap-3">
                        <span class="text-xl">${icons[type]}</span>
                        <div class="flex-1">
                            <pre class="whitespace-pre-wrap font-medium text-sm">${message}</pre>
                            <p class="text-xs mt-2 opacity-75">时间: ${new Date().toLocaleTimeString()}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 显示当前配置
        function updateConfigInfo() {
            const saved = localStorage.getItem('lifeos_pro_api_config');
            let config = null;
            
            if (saved) {
                config = JSON.parse(saved);
            }

            configInfoDiv.innerHTML = `
                <p><strong>当前提供商:</strong> ${config ? config.provider : '未配置'}</p>
                <p><strong>Gemini 密钥:</strong> ${config && config.keys.google ? '已配置' : '未配置'}</p>
                <p><strong>DeepSeek 密钥:</strong> ${config && config.keys.deepseek ? '已配置' : '未配置'}</p>
                <p><strong>CORS 解决方案:</strong> ${config && config.corsWorkaround ? '已启用' : '未启用'}</p>
                <p><strong>服务器密钥:</strong> ${config && config.useServerKeys ? '启用' : '禁用'}</p>
            `;
        }

        // 基础功能测试
        document.getElementById('testBasic').addEventListener('click', async () => {
            showResult('正在测试 Gemini API 基础功能...', 'info');
            
            try {
                const genAI = new GoogleGenerativeAI(API_KEY);
                const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash-exp" });

                const result = await model.generateContent('请简单介绍一下你自己，用中文回复。');
                const response = result.response.text();

                showResult(`✅ Gemini API 基础功能测试成功！

响应内容: ${response}

测试结果:
• API 连接: 正常
• 中文支持: 良好
• 响应速度: 快速
• 无 CORS 问题: ✅`, 'success');

            } catch (error) {
                showResult(`❌ Gemini API 基础功能测试失败: ${error.message}`, 'error');
            }
        });

        // JSON 格式测试
        document.getElementById('testJson').addEventListener('click', async () => {
            showResult('正在测试 Gemini API JSON 格式输出...', 'info');
            
            try {
                const genAI = new GoogleGenerativeAI(API_KEY);
                const model = genAI.getGenerativeModel({ 
                    model: "gemini-2.0-flash-exp",
                    generationConfig: { responseMimeType: "application/json" }
                });

                const prompt = '请用JSON格式回复：{"status": "success", "message": "JSON格式测试成功", "timestamp": "' + new Date().toISOString() + '", "features": ["中文支持", "JSON输出", "快速响应"]}';
                const result = await model.generateContent(prompt);
                const response = result.response.text();

                // 验证 JSON 格式
                const parsed = JSON.parse(response);

                showResult(`✅ Gemini API JSON 格式测试成功！

原始响应: ${response}

解析后的对象:
${JSON.stringify(parsed, null, 2)}

JSON 功能验证:
• 格式正确: ✅
• 中文内容: ✅
• 时间戳: ✅
• 数组支持: ✅`, 'success');

            } catch (error) {
                showResult(`❌ Gemini API JSON 格式测试失败: ${error.message}`, 'error');
            }
        });

        // 复杂任务测试
        document.getElementById('testComplex').addEventListener('click', async () => {
            showResult('正在测试 Gemini API 复杂任务处理...', 'info');
            
            try {
                const genAI = new GoogleGenerativeAI(API_KEY);
                const model = genAI.getGenerativeModel({ 
                    model: "gemini-2.0-flash-exp",
                    generationConfig: { responseMimeType: "application/json" }
                });

                const prompt = `请分析今天的日程安排并生成建议，用JSON格式回复：
                
输入数据：
- 09:00-10:00 团队会议
- 10:30-12:00 项目开发
- 14:00-15:30 代码审查
- 16:00-17:00 文档编写

请输出JSON格式：
{
  "summary": "日程总结",
  "insights": ["洞察1", "洞察2", "洞察3"],
  "suggestions": ["建议1", "建议2"],
  "productivity_score": 85
}`;

                const result = await model.generateContent(prompt);
                const response = result.response.text();
                const parsed = JSON.parse(response);

                showResult(`✅ Gemini API 复杂任务测试成功！

生成的分析结果:
${JSON.stringify(parsed, null, 2)}

复杂任务能力验证:
• 数据分析: ✅
• 结构化输出: ✅
• 中文处理: ✅
• 逻辑推理: ✅
• JSON 格式: ✅`, 'success');

            } catch (error) {
                showResult(`❌ Gemini API 复杂任务测试失败: ${error.message}`, 'error');
            }
        });

        // 配置应用测试
        document.getElementById('testConfig').addEventListener('click', async () => {
            showResult('正在应用 Gemini 配置...', 'info');
            
            try {
                // 创建新配置
                const newConfig = {
                    provider: 'google',
                    keys: {
                        google: API_KEY,
                        openai: '',
                        deepseek: 'sk-d1fdb210d0424ffdbad83f1ebe4e283b'
                    },
                    useServerKeys: false,
                    corsWorkaround: true,
                    timestamp: new Date().toISOString()
                };

                // 保存配置
                localStorage.setItem('lifeos_pro_api_config', JSON.stringify(newConfig));

                // 测试配置是否生效
                const genAI = new GoogleGenerativeAI(API_KEY);
                const model = genAI.getGenerativeModel({ 
                    model: "gemini-2.0-flash-exp",
                    generationConfig: { responseMimeType: "application/json" }
                });

                const result = await model.generateContent('请用JSON格式确认配置生效：{"config_applied": true, "provider": "gemini", "message": "配置应用成功"}');
                const response = result.response.text();

                // 更新配置显示
                updateConfigInfo();

                showResult(`✅ Gemini 配置应用成功！

配置详情:
${JSON.stringify(newConfig, null, 2)}

API 测试响应: ${response}

配置效果:
• 默认提供商: Gemini
• CORS 问题: 已解决
• 浏览器兼容: ✅
• 配置持久化: ✅

现在可以在主应用中正常使用 AI 功能了！`, 'success');

            } catch (error) {
                showResult(`❌ 配置应用失败: ${error.message}`, 'error');
            }
        });

        // 页面加载时更新配置信息
        window.addEventListener('load', () => {
            updateConfigInfo();
        });
    </script>
</body>
</html>
