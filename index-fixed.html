<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeOS Pro - 修复版本</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React UMD -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            color: #5D576B; 
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        input, textarea, select { 
            font-size: 16px !important; 
            transition: all 0.3s ease;
        }
        
        .timer-card {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .category-button {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .macaron-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F9F7F5 100%);
            box-shadow: 0 8px 24px -4px rgba(162, 210, 255, 0.2), 
                        0 4px 12px -2px rgba(162, 210, 255, 0.15),
                        inset 0 1px 4px rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }
        
        .macaron-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -4px rgba(162, 210, 255, 0.3), 
                        0 8px 20px -2px rgba(162, 210, 255, 0.2),
                        inset 0 2px 8px rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #FFF9F5;">
            <div style="text-align: center;">
                <div style="width: 60px; height: 60px; border: 4px solid #E2C2FF; border-top-color: #5D576B; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                <p style="color: #5D576B; font-weight: bold;">加载中...</p>
            </div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>

    <script type="text/babel">
        console.log('🚀 修复版本启动...');
        
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        // 简化的应用组件
        const App = () => {
            const [selectedCategory, setSelectedCategory] = useState('uncategorized');
            const [categories] = useState([
                { id: 'work', name: '工作', color: '#4CAF50' },
                { id: 'study', name: '学习', color: '#2196F3' },
                { id: 'life', name: '生活', color: '#FF9800' }
            ]);

            return (
                <div style={{ padding: '20px', minHeight: '100vh' }}>
                    <div style={{ 
                        maxWidth: '1200px', 
                        margin: '0 auto',
                        background: 'white',
                        borderRadius: '20px',
                        padding: '30px',
                        boxShadow: '0 8px 32px rgba(0,0,0,0.1)'
                    }}>
                        <h1 style={{ 
                            textAlign: 'center', 
                            color: '#023E8A', 
                            marginBottom: '30px',
                            fontSize: '2.5rem',
                            fontWeight: 'bold'
                        }}>
                            🎉 LifeOS Pro - 修复成功！
                        </h1>
                        
                        <div style={{
                            background: '#d4edda',
                            border: '1px solid #c3e6cb',
                            color: '#155724',
                            padding: '20px',
                            borderRadius: '10px',
                            marginBottom: '30px',
                            textAlign: 'center'
                        }}>
                            <h3>✅ selectedCategory 问题已解决</h3>
                            <p>语法错误已修复，React 组件正常运行</p>
                        </div>

                        <div style={{ marginBottom: '30px' }}>
                            <h3 style={{ marginBottom: '15px', color: '#023E8A' }}>📂 分类选择测试</h3>
                            <p style={{ marginBottom: '15px' }}>
                                当前选择: <strong style={{ color: '#4CAF50' }}>
                                    {selectedCategory === 'uncategorized' ? '待分类' : 
                                     categories.find(c => c.id === selectedCategory)?.name || '未知'}
                                </strong>
                            </p>
                            
                            <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                                <button
                                    onClick={() => setSelectedCategory('uncategorized')}
                                    style={{
                                        padding: '12px 20px',
                                        borderRadius: '25px',
                                        border: '2px solid',
                                        background: selectedCategory === 'uncategorized' ? '#4CAF50' : 'transparent',
                                        color: selectedCategory === 'uncategorized' ? 'white' : '#4CAF50',
                                        borderColor: '#4CAF50',
                                        cursor: 'pointer',
                                        transition: 'all 0.3s ease'
                                    }}
                                >
                                    📋 待分类
                                </button>
                                
                                {categories.map(category => (
                                    <button
                                        key={category.id}
                                        onClick={() => setSelectedCategory(category.id)}
                                        style={{
                                            padding: '12px 20px',
                                            borderRadius: '25px',
                                            border: '2px solid',
                                            background: selectedCategory === category.id ? category.color : 'transparent',
                                            color: selectedCategory === category.id ? 'white' : category.color,
                                            borderColor: category.color,
                                            cursor: 'pointer',
                                            transition: 'all 0.3s ease'
                                        }}
                                    >
                                        📁 {category.name}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div style={{
                            background: '#f8f9fa',
                            padding: '20px',
                            borderRadius: '10px',
                            marginBottom: '30px'
                        }}>
                            <h4 style={{ marginBottom: '15px', color: '#023E8A' }}>🔍 测试结果</h4>
                            <ul style={{ listStyle: 'none', padding: 0 }}>
                                <li style={{ color: '#155724', marginBottom: '8px' }}>✅ selectedCategory 变量定义正常</li>
                                <li style={{ color: '#155724', marginBottom: '8px' }}>✅ React 组件渲染成功</li>
                                <li style={{ color: '#155724', marginBottom: '8px' }}>✅ 状态管理功能正常</li>
                                <li style={{ color: '#155724', marginBottom: '8px' }}>✅ 分类切换功能正常</li>
                                <li style={{ color: '#155724', marginBottom: '8px' }}>✅ 没有语法错误</li>
                            </ul>
                        </div>

                        <div style={{ textAlign: 'center' }}>
                            <button
                                onClick={() => window.open('index.html', '_blank')}
                                style={{
                                    background: '#007bff',
                                    color: 'white',
                                    border: 'none',
                                    padding: '15px 30px',
                                    borderRadius: '25px',
                                    fontSize: '16px',
                                    fontWeight: 'bold',
                                    cursor: 'pointer',
                                    margin: '10px',
                                    transition: 'all 0.3s ease'
                                }}
                                onMouseOver={(e) => e.target.style.background = '#0056b3'}
                                onMouseOut={(e) => e.target.style.background = '#007bff'}
                            >
                                🚀 测试完整版本
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 渲染应用
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
        
        console.log('✅ 修复版本加载完成');
    </script>
</body>
</html>
