<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>控制台错误捕获</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
        .error { color: #f00; background: #300; padding: 10px; margin: 5px 0; }
        .log { color: #0f0; padding: 5px; margin: 2px 0; }
    </style>
</head>
<body>
    <h1>实时控制台监控</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        // 捕获所有错误
        window.addEventListener('error', (e) => {
            const div = document.createElement('div');
            div.className = 'error';
            div.textContent = `ERROR: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`;
            output.appendChild(div);
        });
        
        // 捕获未处理的 Promise 错误
        window.addEventListener('unhandledrejection', (e) => {
            const div = document.createElement('div');
            div.className = 'error';
            div.textContent = `PROMISE ERROR: ${e.reason}`;
            output.appendChild(div);
        });
        
        // 重写 console.error
        const originalError = console.error;
        console.error = function(...args) {
            const div = document.createElement('div');
            div.className = 'error';
            div.textContent = 'CONSOLE ERROR: ' + args.join(' ');
            output.appendChild(div);
            originalError.apply(console, args);
        };
        
        // 重写 console.log
        const originalLog = console.log;
        console.log = function(...args) {
            const div = document.createElement('div');
            div.className = 'log';
            div.textContent = args.join(' ');
            output.appendChild(div);
            originalLog.apply(console, args);
        };
        
        // 加载主应用的脚本来测试
        setTimeout(() => {
            const iframe = document.createElement('iframe');
            iframe.src = 'index.html';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            const div = document.createElement('div');
            div.className = 'log';
            div.textContent = '已加载 index.html 到隐藏 iframe，查看上方错误...';
            output.appendChild(div);
        }, 1000);
    </script>
</body>
</html>
