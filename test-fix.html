<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复测试</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>LifeOS 修复验证</h1>
    <div id="status"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        
        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);
        }
        
        // 检查localStorage
        addStatus('✅ 页面已加载', 'success');
        
        // 检查是否有数据
        const keys = Object.keys(localStorage);
        const lifeosKeys = keys.filter(k => k.startsWith('lifeos_'));
        
        if (lifeosKeys.length > 0) {
            addStatus(`📦 发现 ${lifeosKeys.length} 个LifeOS数据项`, 'info');
            lifeosKeys.forEach(key => {
                const value = localStorage.getItem(key);
                const size = new Blob([value]).size;
                addStatus(`  - ${key}: ${(size / 1024).toFixed(2)} KB`, 'info');
            });
        } else {
            addStatus('⚠️ 未发现LifeOS数据', 'error');
        }
        
        // 提供操作按钮
        const actions = document.createElement('div');
        actions.style.marginTop = '20px';
        actions.innerHTML = `
            <button onclick="window.location.href='index.html'" style="padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                打开主页面
            </button>
            <button onclick="window.location.href='debug-minimal.html'" style="padding: 10px 20px; margin: 5px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                运行诊断
            </button>
            <button onclick="if(confirm('确定要清除所有数据吗？')) { localStorage.clear(); location.reload(); }" style="padding: 10px 20px; margin: 5px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                清除所有数据
            </button>
        `;
        document.body.appendChild(actions);
    </script>
</body>
</html>
