<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复盘页面调试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 简化的复盘页面组件
        const ReviewPageDebug = () => {
            const [reviewTab, setReviewTab] = useState('progress');
            const [progressScope, setProgressScope] = useState('today');
            const [error, setError] = useState(null);

            // 错误边界
            const ErrorBoundary = ({ children }) => {
                try {
                    return children;
                } catch (error) {
                    console.error('渲染错误:', error);
                    return (
                        <div className="p-4 bg-red-50 border border-red-200 rounded-lg">
                            <h3 className="text-red-800 font-bold">渲染错误</h3>
                            <p className="text-red-600">{error.message}</p>
                            <pre className="text-xs text-red-500 mt-2">{error.stack}</pre>
                        </div>
                    );
                }
            };

            // 简化的 AchievementJarIntegratedProgress 组件
            const AchievementJarIntegratedProgress = ({ 
                fullHistory, 
                progressScope, 
                onScopeChange, 
                categoryMap, 
                customSounds, 
                danmakus, 
                setDanmakus, 
                playSound,
                onToggleMode 
            }) => {
                return (
                    <div className="p-4 bg-blue-50 border border-blue-200 rounded-lg">
                        <h3 className="text-blue-800 font-bold">Achievement Jar 集成进度</h3>
                        <p className="text-blue-600">当前范围: {progressScope}</p>
                        <button 
                            onClick={() => onToggleMode && onToggleMode()}
                            className="mt-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                        >
                            切换模式
                        </button>
                    </div>
                );
            };

            const renderReviewPage = () => {
                try {
                    return (
                        <div className="space-y-6 p-4">
                            {/* Tab 切换 */}
                            <div className="bg-white p-1.5 rounded-2xl shadow-sm flex gap-1 border border-slate-100">
                                <button 
                                    onClick={() => setReviewTab('progress')} 
                                    className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                        reviewTab === 'progress' 
                                            ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                            : 'text-slate-400 hover:bg-slate-50'
                                    }`}
                                >
                                    当前进度
                                </button>
                                <button 
                                    onClick={() => setReviewTab('review')} 
                                    className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                        reviewTab === 'review' 
                                            ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                            : 'text-slate-400 hover:bg-slate-50'
                                    }`}
                                >
                                    复盘
                                </button>
                                <button 
                                    onClick={() => setReviewTab('habit')} 
                                    className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                        reviewTab === 'habit' 
                                            ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                            : 'text-slate-400 hover:bg-slate-50'
                                    }`}
                                >
                                    习惯打卡
                                </button>
                            </div>

                            {/* 当前进度 Tab */}
                            {reviewTab === 'progress' && (
                                <ErrorBoundary>
                                    <AchievementJarIntegratedProgress 
                                        fullHistory=""
                                        progressScope={progressScope}
                                        onScopeChange={setProgressScope}
                                        categoryMap={{}}
                                        customSounds={{}}
                                        danmakus={[]}
                                        setDanmakus={() => {}}
                                        playSound={() => {}}
                                        onToggleMode={() => console.log('切换模式')}
                                    />
                                </ErrorBoundary>
                            )}

                            {/* 复盘 Tab */}
                            {reviewTab === 'review' && (
                                <div className="p-4 bg-green-50 border border-green-200 rounded-lg">
                                    <h3 className="text-green-800 font-bold">复盘页面</h3>
                                    <p className="text-green-600">复盘功能正常</p>
                                </div>
                            )}

                            {/* 习惯打卡 Tab */}
                            {reviewTab === 'habit' && (
                                <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                                    <h3 className="text-yellow-800 font-bold">习惯打卡</h3>
                                    <p className="text-yellow-600">习惯打卡功能正常</p>
                                </div>
                            )}
                        </div>
                    );
                } catch (error) {
                    console.error('renderReviewPage 错误:', error);
                    setError(error);
                    return (
                        <div className="p-4 bg-red-50 border border-red-200 rounded-lg">
                            <h3 className="text-red-800 font-bold">页面渲染错误</h3>
                            <p className="text-red-600">{error.message}</p>
                        </div>
                    );
                }
            };

            if (error) {
                return (
                    <div className="p-4 bg-red-50 border border-red-200 rounded-lg">
                        <h3 className="text-red-800 font-bold">应用错误</h3>
                        <p className="text-red-600">{error.message}</p>
                        <button 
                            onClick={() => setError(null)}
                            className="mt-2 px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600"
                        >
                            重试
                        </button>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="container mx-auto py-8">
                        <h1 className="text-2xl font-bold mb-6">复盘页面调试</h1>
                        {renderReviewPage()}
                    </div>
                </div>
            );
        };

        // 渲染应用
        ReactDOM.render(<ReviewPageDebug />, document.getElementById('root'));
    </script>
</body>
</html>
