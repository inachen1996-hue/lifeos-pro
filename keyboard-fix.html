<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>键盘弹起问题修复测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            color: #5D576B; 
            -webkit-tap-highlight-color: transparent;
            /* 禁用文本选择和长按菜单 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        /* 输入框样式 - 防止自动缩放 */
        input, textarea, select { 
            font-size: 16px !important; 
            transition: all 0.3s ease;
            /* 防止iOS自动缩放 */
            -webkit-text-size-adjust: 100%;
        }
        
        /* 防止键盘弹起时的页面跳动 */
        .keyboard-safe {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 输入框获得焦点时的处理 */
        .input-focus-handler {
            transition: all 0.3s ease;
        }
        
        /* 模态框样式 - 防止键盘遮挡 */
        .modal-keyboard-safe {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 10vh;
            padding-bottom: 10vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="keyboard-safe p-4">
        <h1 class="text-2xl font-bold text-center mb-8">键盘弹起问题修复测试</h1>
        
        <!-- 测试按钮 -->
        <div class="space-y-4 mb-8">
            <button id="showModalBtn" class="w-full bg-blue-500 text-white p-4 rounded-xl font-bold">
                打开带输入框的模态框
            </button>
            
            <button id="testFocusBtn" class="w-full bg-green-500 text-white p-4 rounded-xl font-bold">
                测试手动焦点
            </button>
            
            <button id="hideKeyboardBtn" class="w-full bg-red-500 text-white p-4 rounded-xl font-bold">
                强制隐藏键盘
            </button>
        </div>
        
        <!-- 测试输入框 -->
        <div class="space-y-4 mb-8">
            <div>
                <label class="block text-sm font-bold mb-2">普通输入框（无自动焦点）</label>
                <input 
                    type="text" 
                    class="w-full p-4 rounded-xl border-2 border-gray-200 focus:border-blue-400 outline-none"
                    placeholder="点击输入..."
                />
            </div>
            
            <div>
                <label class="block text-sm font-bold mb-2">测试输入框（可手动焦点）</label>
                <input 
                    id="testInput"
                    type="text" 
                    class="w-full p-4 rounded-xl border-2 border-gray-200 focus:border-green-400 outline-none"
                    placeholder="通过按钮获得焦点..."
                />
            </div>
        </div>
        
        <!-- 键盘状态显示 -->
        <div class="bg-white p-4 rounded-xl shadow-lg mb-4">
            <h3 class="font-bold mb-2">键盘状态监控</h3>
            <div id="keyboardStatus" class="text-sm text-gray-600">
                等待检测...
            </div>
            <div id="viewportInfo" class="text-xs text-gray-500 mt-2">
                视口信息将在这里显示
            </div>
        </div>
        
        <!-- 修复说明 */
        <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200">
            <h3 class="font-bold text-yellow-800 mb-2">🔧 修复方案</h3>
            <ul class="text-sm text-yellow-700 space-y-1">
                <li>• 移除所有 autoFocus 属性</li>
                <li>• 添加键盘检测和处理</li>
                <li>• 提供手动隐藏键盘功能</li>
                <li>• 优化模态框位置</li>
                <li>• 防止页面跳动</li>
            </ul>
        </div>
    </div>
    
    <!-- 模态框 -->
    <div id="modal" class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm z-50 modal-keyboard-safe">
        <div class="bg-white w-full max-w-md mx-4 p-6 rounded-2xl shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">测试模态框</h2>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700">
                    ✕
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-2">分类名称</label>
                    <input 
                        id="modalInput"
                        type="text" 
                        class="w-full p-4 rounded-xl border-2 border-gray-200 focus:border-blue-400 outline-none"
                        placeholder="例如：运动、阅读"
                        maxLength="4"
                    />
                    <p class="text-xs text-gray-400 mt-1">建议 2-3 个字，最多 4 个字</p>
                </div>
                
                <div class="flex gap-3">
                    <button id="saveBtn" class="flex-1 bg-blue-500 text-white p-3 rounded-xl font-bold">
                        保存
                    </button>
                    <button id="cancelBtn" class="flex-1 bg-gray-300 text-gray-700 p-3 rounded-xl font-bold">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 键盘检测和处理
        class KeyboardManager {
            constructor() {
                this.isKeyboardVisible = false;
                this.initialViewportHeight = window.innerHeight;
                this.currentViewportHeight = window.innerHeight;
                this.keyboardHeight = 0;
                
                this.init();
            }
            
            init() {
                // 监听视口变化
                window.addEventListener('resize', () => {
                    this.handleViewportChange();
                });
                
                // 监听输入框焦点事件
                document.addEventListener('focusin', (e) => {
                    if (this.isInputElement(e.target)) {
                        this.handleInputFocus(e.target);
                    }
                });
                
                document.addEventListener('focusout', (e) => {
                    if (this.isInputElement(e.target)) {
                        this.handleInputBlur(e.target);
                    }
                });
                
                // 初始状态更新
                this.updateStatus();
            }
            
            isInputElement(element) {
                return element && (
                    element.tagName === 'INPUT' || 
                    element.tagName === 'TEXTAREA' || 
                    element.tagName === 'SELECT'
                );
            }
            
            handleViewportChange() {
                const newHeight = window.innerHeight;
                const heightDiff = this.initialViewportHeight - newHeight;
                
                // 如果高度减少超过150px，认为键盘弹起
                if (heightDiff > 150) {
                    this.isKeyboardVisible = true;
                    this.keyboardHeight = heightDiff;
                } else {
                    this.isKeyboardVisible = false;
                    this.keyboardHeight = 0;
                }
                
                this.currentViewportHeight = newHeight;
                this.updateStatus();
            }
            
            handleInputFocus(input) {
                console.log('输入框获得焦点:', input);
                
                // 延迟检测键盘状态
                setTimeout(() => {
                    this.handleViewportChange();
                }, 300);
                
                // 滚动到输入框位置（防止被键盘遮挡）
                setTimeout(() => {
                    if (this.isKeyboardVisible) {
                        input.scrollIntoView({ 
                            behavior: 'smooth', 
                            block: 'center' 
                        });
                    }
                }, 500);
            }
            
            handleInputBlur(input) {
                console.log('输入框失去焦点:', input);
                
                // 延迟检测键盘状态
                setTimeout(() => {
                    this.handleViewportChange();
                }, 300);
            }
            
            // 强制隐藏键盘
            hideKeyboard() {
                // 创建一个临时的隐藏输入框并聚焦，然后立即失焦
                const tempInput = document.createElement('input');
                tempInput.style.position = 'absolute';
                tempInput.style.left = '-9999px';
                tempInput.style.opacity = '0';
                tempInput.setAttribute('readonly', 'readonly');
                
                document.body.appendChild(tempInput);
                tempInput.focus();
                
                setTimeout(() => {
                    tempInput.blur();
                    document.body.removeChild(tempInput);
                    
                    // 强制失焦所有输入框
                    const activeElement = document.activeElement;
                    if (this.isInputElement(activeElement)) {
                        activeElement.blur();
                    }
                }, 100);
            }
            
            updateStatus() {
                const statusEl = document.getElementById('keyboardStatus');
                const viewportEl = document.getElementById('viewportInfo');
                
                if (statusEl) {
                    statusEl.innerHTML = `
                        键盘状态: ${this.isKeyboardVisible ? '显示' : '隐藏'}<br>
                        键盘高度: ${this.keyboardHeight}px
                    `;
                }
                
                if (viewportEl) {
                    viewportEl.innerHTML = `
                        初始高度: ${this.initialViewportHeight}px | 
                        当前高度: ${this.currentViewportHeight}px | 
                        高度差: ${this.initialViewportHeight - this.currentViewportHeight}px
                    `;
                }
            }
        }
        
        // 初始化键盘管理器
        const keyboardManager = new KeyboardManager();
        
        // 按钮事件处理
        document.getElementById('showModalBtn').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('hidden');
        });
        
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('modal').classList.add('hidden');
            keyboardManager.hideKeyboard();
        });
        
        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('modal').classList.add('hidden');
            keyboardManager.hideKeyboard();
        });
        
        document.getElementById('saveBtn').addEventListener('click', () => {
            const input = document.getElementById('modalInput');
            if (input.value.trim()) {
                alert(`保存成功: ${input.value}`);
                input.value = '';
                document.getElementById('modal').classList.add('hidden');
                keyboardManager.hideKeyboard();
            } else {
                alert('请输入分类名称');
            }
        });
        
        document.getElementById('testFocusBtn').addEventListener('click', () => {
            const testInput = document.getElementById('testInput');
            testInput.focus();
        });
        
        document.getElementById('hideKeyboardBtn').addEventListener('click', () => {
            keyboardManager.hideKeyboard();
        });
        
        // 点击模态框外部关闭
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('modal').classList.add('hidden');
                keyboardManager.hideKeyboard();
            }
        });
        
        // 防止页面加载时自动弹起键盘
        document.addEventListener('DOMContentLoaded', () => {
            // 确保没有输入框自动获得焦点
            const activeElement = document.activeElement;
            if (keyboardManager.isInputElement(activeElement)) {
                activeElement.blur();
            }
        });
        
        // 页面可见性变化时处理键盘
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // 页面重新可见时，隐藏键盘
                setTimeout(() => {
                    keyboardManager.hideKeyboard();
                }, 100);
            }
        });
    </script>
</body>
</html>
