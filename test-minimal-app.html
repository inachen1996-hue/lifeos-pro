<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>最小化测试</title>
</head>
<body>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
            <div style="text-align: center;">
                <div style="width: 60px; height: 60px; border: 4px solid #E2C2FF; border-top-color: #5D576B; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                <p style="color: #5D576B; font-weight: bold;">加载中...</p>
            </div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>

    <!-- React UMD -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Timer Backend Modules -->
    <script type="module">
      (async function() {
        try {
          console.log('🔄 Loading Timer Backend modules...');
          
          const { TimerStorage, CategoryStorage, EventStorage } = await import('./dist/storage.js');
          const { TimerManager } = await import('./dist/timer-manager.js');
          const { CategoryManager } = await import('./dist/category-manager.js');
          const { DEFAULT_CATEGORIES } = await import('./dist/types.js');

          window.TimerBackend = {
            TimerStorage,
            CategoryStorage,
            EventStorage,
            TimerManager,
            CategoryManager,
            DEFAULT_CATEGORIES
          };
          
          console.log('✅ Timer Backend loaded successfully');
          window.TimerBackendReady = true;
          window.dispatchEvent(new Event('timerBackendReady'));
          
        } catch (error) {
          console.error('❌ Failed to load Timer Backend:', error);
          window.TimerBackendError = error.message;
          window.TimerBackendReady = false;
          window.dispatchEvent(new Event('timerBackendReady'));
        }
      })();
    </script>

    <!-- Load dependencies -->
    <script type="module">
        (async function() {
            try {
                console.log('🔄 Loading dependencies...');
                const lucide = await import('https://esm.sh/lucide-react@0.294.0?deps=react@18.2.0');
                window.LucideIcons = lucide;
                console.log('✓ Lucide icons loaded');
                
                window.DependenciesReady = true;
                window.dispatchEvent(new Event('dependenciesReady'));
            } catch (error) {
                console.error('❌ Failed to load dependencies:', error);
                window.DependenciesError = error.message;
                window.DependenciesReady = false;
                window.dispatchEvent(new Event('dependenciesReady'));
            }
        })();
    </script>

    <script type="text/babel">
        console.log('🚀 Babel script starting...');
        
        function waitForDependencies() {
            if (window.DependenciesReady) {
                return Promise.resolve();
            }
            return new Promise(resolve => {
                console.log('⏳ Waiting for dependencies...');
                window.addEventListener('dependenciesReady', resolve, { once: true });
            });
        }
        
        function waitForTimerBackend() {
            if (window.TimerBackendReady) {
                return Promise.resolve();
            }
            return new Promise(resolve => {
                console.log('⏳ Waiting for TimerBackend...');
                window.addEventListener('timerBackendReady', resolve, { once: true });
            });
        }
        
        waitForDependencies().then(() => {
            console.log('✓ Dependencies ready');
            
            if (window.DependenciesError) {
                console.error('Dependencies error:', window.DependenciesError);
                return;
            }
            
            const { useState } = React;
            const { createRoot } = ReactDOM;
            const { CheckCircle } = window.LucideIcons;
            
            return waitForTimerBackend().then(() => {
                console.log('✓ TimerBackend ready');
                
                if (window.TimerBackendError) {
                    console.error('TimerBackend error:', window.TimerBackendError);
                    return;
                }
                
                function TestApp() {
                    const [count, setCount] = useState(0);
                    
                    return (
                        <div style={{ padding: '40px', textAlign: 'center' }}>
                            <h1 style={{ color: '#667eea' }}>✅ 应用加载成功！</h1>
                            <div style={{ margin: '20px 0' }}>
                                <CheckCircle style={{ width: '48px', height: '48px', color: '#4caf50' }} />
                            </div>
                            <div style={{ fontSize: '48px', margin: '20px' }}>{count}</div>
                            <button 
                                onClick={() => setCount(count + 1)}
                                style={{
                                    padding: '12px 24px',
                                    fontSize: '16px',
                                    background: '#667eea',
                                    color: 'white',
                                    border: 'none',
                                    borderRadius: '8px',
                                    cursor: 'pointer'
                                }}
                            >
                                点击 +1
                            </button>
                            <div style={{ marginTop: '20px', fontSize: '14px', color: '#666' }}>
                                <div>✅ React: 正常</div>
                                <div>✅ Babel: 正常</div>
                                <div>✅ TimerBackend: 正常</div>
                                <div>✅ Lucide Icons: 正常</div>
                            </div>
                        </div>
                    );
                }
                
                const root = createRoot(document.getElementById('root'));
                root.render(<TestApp />);
                console.log('✅ App rendered successfully');
            });
        }).catch(error => {
            console.error('❌ Error:', error);
            document.getElementById('root').innerHTML = `
                <div style="padding: 40px; text-align: center;">
                    <h2 style="color: #f44336;">加载失败</h2>
                    <p>${error.message}</p>
                    <button onclick="location.reload()">刷新页面</button>
                </div>
            `;
        });
    </script>
</body>
</html>
