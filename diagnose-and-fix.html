<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS Pro - 系统诊断与修复</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            border-left: 4px solid #ddd;
        }
        
        .status-success {
            background: #d4edda;
            border-left-color: #28a745;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }
        
        .status-warning {
            background: #fff3cd;
            border-left-color: #ffc107;
            color: #856404;
        }
        
        .status-info {
            background: #d1ecf1;
            border-left-color: #17a2b8;
            color: #0c5460;
        }
        
        .icon {
            margin-right: 12px;
            font-size: 18px;
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: transform 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
        }
        
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .progress {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 LifeOS Pro 系统诊断</h1>
            <p>自动检测并修复常见问题</p>
        </div>
        
        <div id="diagnostics">
            <div class="status-item status-info">
                <span class="icon">🔍</span>
                <span>正在初始化诊断系统...</span>
            </div>
        </div>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div id="actions" style="text-align: center; margin-top: 20px;">
            <button class="button" onclick="startDiagnosis()">开始诊断</button>
            <button class="button" onclick="fixIssues()" id="fixButton" disabled>自动修复</button>
            <button class="button" onclick="openApp()">打开应用</button>
        </div>
        
        <div id="log" class="log" style="display: none;">
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        let diagnosticResults = [];
        let currentStep = 0;
        let totalSteps = 6;
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const logContent = document.getElementById('logContent');
            logDiv.style.display = 'block';
            logContent.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        function updateProgress() {
            const progress = (currentStep / totalSteps) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }
        
        function addStatus(type, icon, message) {
            const diagnostics = document.getElementById('diagnostics');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status-item status-${type}`;
            statusDiv.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
            diagnostics.appendChild(statusDiv);
        }
        
        async function checkEnvironment() {
            currentStep++;
            updateProgress();
            log('检查运行环境...');
            
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;
            const port = window.location.port;
            
            if (protocol === 'file:') {
                addStatus('error', '❌', '错误：正在使用 file:// 协议，这会导致 CORS 问题');
                diagnosticResults.push({
                    issue: 'file_protocol',
                    severity: 'high',
                    message: '需要使用 HTTP 服务器'
                });
                return false;
            } else if (protocol === 'http:' && (hostname === 'localhost' || hostname === '127.0.0.1')) {
                addStatus('success', '✅', `正确：使用本地服务器 (${hostname}:${port || '80'})`);
                return true;
            } else if (protocol === 'https:') {
                addStatus('success', '✅', '正确：使用 HTTPS 协议');
                return true;
            } else {
                addStatus('warning', '⚠️', '警告：未知的运行环境');
                return true;
            }
        }
        
        async function checkModules() {
            currentStep++;
            updateProgress();
            log('检查模块文件...');
            
            const modules = [
                'dist/storage.js',
                'dist/timer-manager.js',
                'dist/category-manager.js',
                'dist/types.js'
            ];
            
            let allExists = true;
            
            for (const module of modules) {
                try {
                    const response = await fetch(module, { method: 'HEAD' });
                    if (response.ok) {
                        log(`✓ ${module} 存在`);
                    } else {
                        log(`✗ ${module} 不存在 (${response.status})`);
                        allExists = false;
                    }
                } catch (error) {
                    log(`✗ ${module} 检查失败: ${error.message}`);
                    allExists = false;
                }
            }
            
            if (allExists) {
                addStatus('success', '✅', '所有必需的模块文件都存在');
            } else {
                addStatus('error', '❌', '部分模块文件缺失');
                diagnosticResults.push({
                    issue: 'missing_modules',
                    severity: 'high',
                    message: '需要重新编译 TypeScript 文件'
                });
            }
            
            return allExists;
        }
        
        async function checkDependencies() {
            currentStep++;
            updateProgress();
            log('检查外部依赖...');
            
            const dependencies = [
                'https://cdn.tailwindcss.com',
                'https://unpkg.com/react@18.2.0/umd/react.production.min.js',
                'https://unpkg.com/@babel/standalone/babel.min.js'
            ];
            
            let allLoaded = true;
            
            for (const dep of dependencies) {
                try {
                    const response = await fetch(dep, { method: 'HEAD' });
                    if (response.ok) {
                        log(`✓ ${dep} 可访问`);
                    } else {
                        log(`✗ ${dep} 不可访问 (${response.status})`);
                        allLoaded = false;
                    }
                } catch (error) {
                    log(`✗ ${dep} 检查失败: ${error.message}`);
                    allLoaded = false;
                }
            }
            
            if (allLoaded) {
                addStatus('success', '✅', '所有外部依赖都可访问');
            } else {
                addStatus('warning', '⚠️', '部分外部依赖不可访问，可能影响功能');
                diagnosticResults.push({
                    issue: 'dependency_issues',
                    severity: 'medium',
                    message: '网络连接问题或 CDN 不可用'
                });
            }
            
            return allLoaded;
        }
        
        async function checkBrowserSupport() {
            currentStep++;
            updateProgress();
            log('检查浏览器支持...');
            
            const features = {
                'ES6 Modules': typeof import === 'function',
                'Fetch API': typeof fetch === 'function',
                'Local Storage': typeof localStorage === 'object',
                'Promise': typeof Promise === 'function',
                'Async/Await': (async function() {})().constructor === Promise
            };
            
            let allSupported = true;
            
            for (const [feature, supported] of Object.entries(features)) {
                if (supported) {
                    log(`✓ ${feature} 支持`);
                } else {
                    log(`✗ ${feature} 不支持`);
                    allSupported = false;
                }
            }
            
            if (allSupported) {
                addStatus('success', '✅', '浏览器支持所有必需功能');
            } else {
                addStatus('error', '❌', '浏览器不支持某些必需功能');
                diagnosticResults.push({
                    issue: 'browser_compatibility',
                    severity: 'high',
                    message: '请使用现代浏览器（Chrome 80+, Firefox 75+, Safari 13+）'
                });
            }
            
            return allSupported;
        }
        
        async function checkLocalStorage() {
            currentStep++;
            updateProgress();
            log('检查本地存储...');
            
            try {
                const testKey = 'lifeos_test_' + Date.now();
                localStorage.setItem(testKey, 'test');
                const value = localStorage.getItem(testKey);
                localStorage.removeItem(testKey);
                
                if (value === 'test') {
                    addStatus('success', '✅', 'Local Storage 工作正常');
                    
                    // 检查现有数据
                    const existingData = Object.keys(localStorage).filter(key => 
                        key.startsWith('lifeos_') || key.startsWith('timer_') || key.startsWith('category_')
                    );
                    
                    if (existingData.length > 0) {
                        log(`发现 ${existingData.length} 个现有数据项`);
                        addStatus('info', 'ℹ️', `发现 ${existingData.length} 个现有数据项`);
                    }
                    
                    return true;
                } else {
                    throw new Error('读写测试失败');
                }
            } catch (error) {
                addStatus('error', '❌', `Local Storage 不可用: ${error.message}`);
                diagnosticResults.push({
                    issue: 'storage_issues',
                    severity: 'high',
                    message: 'Local Storage 不可用，数据无法保存'
                });
                return false;
            }
        }
        
        async function performFinalCheck() {
            currentStep++;
            updateProgress();
            log('执行最终检查...');
            
            // 模拟加载主应用的关键组件
            try {
                // 检查 React 是否可用
                if (typeof React === 'undefined') {
                    const script = document.createElement('script');
                    script.src = 'https://unpkg.com/react@18.2.0/umd/react.production.min.js';
                    document.head.appendChild(script);
                    await new Promise(resolve => script.onload = resolve);
                }
                
                if (typeof React !== 'undefined') {
                    addStatus('success', '✅', 'React 加载成功');
                    log('React 版本: ' + React.version);
                } else {
                    throw new Error('React 加载失败');
                }
                
                addStatus('success', '🎉', '系统诊断完成，所有检查通过！');
                return true;
            } catch (error) {
                addStatus('error', '❌', `最终检查失败: ${error.message}`);
                diagnosticResults.push({
                    issue: 'final_check_failed',
                    severity: 'high',
                    message: error.message
                });
                return false;
            }
        }
        
        async function startDiagnosis() {
            document.getElementById('diagnostics').innerHTML = '';
            diagnosticResults = [];
            currentStep = 0;
            
            log('开始系统诊断...');
            
            const checks = [
                checkEnvironment,
                checkModules,
                checkDependencies,
                checkBrowserSupport,
                checkLocalStorage,
                performFinalCheck
            ];
            
            let allPassed = true;
            
            for (const check of checks) {
                const result = await check();
                if (!result) allPassed = false;
                await new Promise(resolve => setTimeout(resolve, 500)); // 延迟以显示进度
            }
            
            if (diagnosticResults.length === 0) {
                addStatus('success', '🎉', '恭喜！系统运行完美，没有发现任何问题');
                document.getElementById('fixButton').disabled = true;
            } else {
                addStatus('warning', '⚠️', `发现 ${diagnosticResults.length} 个问题需要修复`);
                document.getElementById('fixButton').disabled = false;
            }
            
            log('诊断完成');
        }
        
        function fixIssues() {
            log('开始自动修复...');
            
            const fixes = [];
            
            diagnosticResults.forEach(result => {
                switch (result.issue) {
                    case 'file_protocol':
                        fixes.push('请使用命令启动本地服务器: python3 -m http.server 8000');
                        fixes.push('然后访问: http://localhost:8000');
                        break;
                    case 'missing_modules':
                        fixes.push('请运行命令重新编译: npm run build');
                        fixes.push('或者: npx tsc');
                        break;
                    case 'dependency_issues':
                        fixes.push('检查网络连接');
                        fixes.push('尝试刷新页面');
                        break;
                    case 'browser_compatibility':
                        fixes.push('请更新到现代浏览器');
                        fixes.push('推荐: Chrome 80+, Firefox 75+, Safari 13+');
                        break;
                    case 'storage_issues':
                        fixes.push('检查浏览器隐私设置');
                        fixes.push('确保允许本地存储');
                        break;
                }
            });
            
            if (fixes.length > 0) {
                addStatus('info', '🔧', '修复建议:');
                fixes.forEach(fix => {
                    log('建议: ' + fix);
                });
            }
            
            // 尝试自动修复一些问题
            if (window.location.protocol === 'file:') {
                alert('请使用以下命令启动本地服务器:\n\npython3 -m http.server 8000\n\n然后访问: http://localhost:8000');
            }
        }
        
        function openApp() {
            if (diagnosticResults.length === 0) {
                window.location.href = 'index.html';
            } else {
                if (confirm('检测到一些问题，确定要继续打开应用吗？')) {
                    window.location.href = 'index.html';
                }
            }
        }
        
        // 页面加载完成后自动开始诊断
        window.addEventListener('load', () => {
            setTimeout(startDiagnosis, 1000);
        });
    </script>
</body>
</html>
