<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek API 调试工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">DeepSeek API 调试工具</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">1. 输入 API Key</h2>
            <input 
                type="password" 
                id="apiKey" 
                placeholder="输入你的 DeepSeek API Key (sk-...)"
                class="w-full p-3 border border-gray-300 rounded-lg mb-4 font-mono"
            />
            <button 
                onclick="validateKey()" 
                class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700"
            >
                验证 Key 格式
            </button>
            <div id="keyValidation" class="mt-4"></div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">2. 测试基础连接</h2>
            <button 
                onclick="testBasicConnection()" 
                class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700"
            >
                测试基础连接
            </button>
            <div id="basicTest" class="mt-4"></div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">3. 测试不同的请求配置</h2>
            <div class="space-y-4">
                <button 
                    onclick="testWithoutJsonMode()" 
                    class="bg-purple-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-purple-700 mr-2"
                >
                    测试（不使用 JSON 模式）
                </button>
                <button 
                    onclick="testWithJsonMode()" 
                    class="bg-purple-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-purple-700"
                >
                    测试（使用 JSON 模式）
                </button>
            </div>
            <div id="configTest" class="mt-4"></div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">4. 测试完整的 JSON 响应</h2>
            <button 
                onclick="testFullJsonResponse()" 
                class="bg-orange-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-orange-700"
            >
                测试完整 JSON 响应
            </button>
            <div id="fullTest" class="mt-4"></div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold mb-4">5. 查看详细日志</h2>
            <div id="detailedLog" class="bg-gray-100 p-4 rounded-lg font-mono text-sm overflow-auto max-h-96"></div>
        </div>
    </div>

    <script>
        let logs = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
            logs.push(logEntry);
            
            const logDiv = document.getElementById('detailedLog');
            logDiv.innerHTML = logs.join('\n');
            logDiv.scrollTop = logDiv.scrollHeight;
            
            console.log(logEntry);
        }

        function showResult(elementId, content, isError = false) {
            const element = document.getElementById(elementId);
            element.innerHTML = `
                <div class="p-4 rounded-lg ${isError ? 'bg-red-50 border border-red-200' : 'bg-green-50 border border-green-200'}">
                    <pre class="whitespace-pre-wrap text-sm">${content}</pre>
                </div>
            `;
        }

        function validateKey() {
            const apiKey = document.getElementById('apiKey').value.trim();
            log('开始验证 API Key 格式');
            
            if (!apiKey) {
                showResult('keyValidation', '❌ 请输入 API Key', true);
                log('API Key 为空', 'error');
                return false;
            }

            if (!apiKey.startsWith('sk-')) {
                showResult('keyValidation', '❌ API Key 格式错误：应该以 "sk-" 开头', true);
                log('API Key 格式错误：不以 sk- 开头', 'error');
                return false;
            }

            if (apiKey.length < 20) {
                showResult('keyValidation', '❌ API Key 格式错误：长度太短', true);
                log('API Key 格式错误：长度太短', 'error');
                return false;
            }

            showResult('keyValidation', `✅ API Key 格式正确\n长度: ${apiKey.length}\n前缀: ${apiKey.substring(0, 10)}...`);
            log('API Key 格式验证通过');
            return true;
        }

        async function testBasicConnection() {
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!validateKey()) return;

            log('开始测试基础连接');
            showResult('basicTest', '⏳ 正在测试连接...');

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ 
                            role: 'user', 
                            content: '你好，请回复"测试成功"' 
                        }]
                    })
                });

                log(`响应状态: ${response.status} ${response.statusText}`);
                log(`响应头: ${JSON.stringify(Object.fromEntries(response.headers.entries()), null, 2)}`);

                const data = await response.json();
                log(`响应数据: ${JSON.stringify(data, null, 2)}`);

                if (!response.ok) {
                    showResult('basicTest', `❌ 连接失败\n状态码: ${response.status}\n错误信息: ${JSON.stringify(data, null, 2)}`, true);
                    log(`连接失败: ${JSON.stringify(data)}`, 'error');
                    return;
                }

                showResult('basicTest', `✅ 连接成功！\n\n响应内容:\n${data.choices[0].message.content}\n\n完整响应:\n${JSON.stringify(data, null, 2)}`);
                log('基础连接测试成功');

            } catch (error) {
                showResult('basicTest', `❌ 请求失败\n错误: ${error.message}\n\n可能的原因:\n1. 网络连接问题\n2. API Key 无效\n3. CORS 限制`, true);
                log(`请求失败: ${error.message}`, 'error');
            }
        }

        async function testWithoutJsonMode() {
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!validateKey()) return;

            log('开始测试（不使用 JSON 模式）');
            showResult('configTest', '⏳ 正在测试...');

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ 
                            role: 'user', 
                            content: '请用JSON格式回复：{"status": "success", "message": "测试成功"}' 
                        }],
                        temperature: 0.7
                    })
                });

                log(`响应状态: ${response.status}`);
                const data = await response.json();
                log(`响应数据: ${JSON.stringify(data, null, 2)}`);

                if (!response.ok) {
                    showResult('configTest', `❌ 测试失败（不使用 JSON 模式）\n${JSON.stringify(data, null, 2)}`, true);
                    return;
                }

                showResult('configTest', `✅ 测试成功（不使用 JSON 模式）\n\n响应:\n${data.choices[0].message.content}`);
                log('不使用 JSON 模式测试成功');

            } catch (error) {
                showResult('configTest', `❌ 请求失败\n${error.message}`, true);
                log(`请求失败: ${error.message}`, 'error');
            }
        }

        async function testWithJsonMode() {
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!validateKey()) return;

            log('开始测试（使用 JSON 模式）');
            showResult('configTest', '⏳ 正在测试...');

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ 
                            role: 'user', 
                            content: '请用JSON格式回复：{"status": "success", "message": "测试成功"}' 
                        }],
                        response_format: { type: 'json_object' },
                        temperature: 0.7
                    })
                });

                log(`响应状态: ${response.status}`);
                const data = await response.json();
                log(`响应数据: ${JSON.stringify(data, null, 2)}`);

                if (!response.ok) {
                    showResult('configTest', `❌ 测试失败（使用 JSON 模式）\n${JSON.stringify(data, null, 2)}`, true);
                    log('使用 JSON 模式测试失败', 'error');
                    return;
                }

                showResult('configTest', `✅ 测试成功（使用 JSON 模式）\n\n响应:\n${data.choices[0].message.content}`);
                log('使用 JSON 模式测试成功');

            } catch (error) {
                showResult('configTest', `❌ 请求失败\n${error.message}`, true);
                log(`请求失败: ${error.message}`, 'error');
            }
        }

        async function testFullJsonResponse() {
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!validateKey()) return;

            log('开始测试完整 JSON 响应');
            showResult('fullTest', '⏳ 正在测试...');

            const prompt = `请分析以下数据并返回JSON格式的结果：
数据：工作8小时，学习2小时，休息2小时
要求：返回格式 {"summary": "总结", "insights": ["洞察1", "洞察2"]}`;

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{ 
                            role: 'user', 
                            content: prompt
                        }],
                        response_format: { type: 'json_object' },
                        temperature: 0.7
                    })
                });

                log(`响应状态: ${response.status}`);
                const data = await response.json();
                log(`响应数据: ${JSON.stringify(data, null, 2)}`);

                if (!response.ok) {
                    showResult('fullTest', `❌ 测试失败\n${JSON.stringify(data, null, 2)}`, true);
                    return;
                }

                const content = data.choices[0].message.content;
                let parsedContent;
                try {
                    parsedContent = JSON.parse(content);
                    showResult('fullTest', `✅ 测试成功！\n\n原始响应:\n${content}\n\n解析后:\n${JSON.stringify(parsedContent, null, 2)}`);
                    log('完整 JSON 响应测试成功');
                } catch (e) {
                    showResult('fullTest', `⚠️ 响应成功但 JSON 解析失败\n\n原始响应:\n${content}\n\n解析错误:\n${e.message}`, true);
                    log(`JSON 解析失败: ${e.message}`, 'error');
                }

            } catch (error) {
                showResult('fullTest', `❌ 请求失败\n${error.message}`, true);
                log(`请求失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时的初始化
        log('DeepSeek API 调试工具已加载');
        log('请输入你的 API Key 开始测试');
    </script>
</body>
</html>
