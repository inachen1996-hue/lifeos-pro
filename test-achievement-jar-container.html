<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievement Jar Container Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            min-height: 100vh;
        }
        
        /* Airy Macaron Colors */
        .bg-macaron-blue { background-color: #BDE0FE; }
        .bg-macaron-pink { background-color: #F5C2D6; }
        .bg-macaron-green { background-color: #D9EFE8; }
        .bg-macaron-purple { background-color: #C8A2E0; }
        .bg-macaron-orange { background-color: #FFE9D6; }
        .bg-macaron-yellow { background-color: #FFF8E1; }
        .bg-emerald-200 { background-color: #A7F3D0; }
        .bg-macaron-rose { background-color: #FFE5E5; }
        
        /* Animation classes */
        .animate-in {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        const { createRoot } = ReactDOM;

        // Achievement Jar Container Component (simplified for testing)
        const AchievementJarContainer = ({ 
          categoryStats, 
          totalTime, 
          timeRange, 
          onBallClick,
          isEmpty = false,
          isLoading = false 
        }) => {
          // Calculate jar dimensions based on screen size
          const jarDimensions = useMemo(() => {
            const isMobile = window.innerWidth < 768;
            return {
              width: isMobile ? '85%' : '60%',
              height: isMobile ? '300px' : '400px',
              maxWidth: isMobile ? '320px' : '480px'
            };
          }, []);

          // Use empty state data when no progress exists
          const displayStats = useMemo(() => {
            if (isEmpty || categoryStats.length === 0) {
              return [
                {
                  categoryId: 'sample-work',
                  name: '开始工作',
                  totalMinutes: 0,
                  color: 'bg-macaron-blue',
                  icon: '💻',
                  ballCount: 0,
                  priority: 'high',
                  percentage: 0
                },
                {
                  categoryId: 'sample-study',
                  name: '开始学习',
                  totalMinutes: 0,
                  color: 'bg-macaron-pink',
                  icon: '📚',
                  ballCount: 0,
                  priority: 'high',
                  percentage: 0
                }
              ];
            }
            return categoryStats;
          }, [categoryStats, isEmpty]);

          return (
            <div className="achievement-jar-container flex flex-col items-center justify-center p-6">
              {/* Jar Container */}
              <div 
                className="achievement-jar relative"
                style={{
                  width: jarDimensions.width,
                  height: jarDimensions.height,
                  maxWidth: jarDimensions.maxWidth
                }}
              >
                {/* Frosted Glass Jar */}
                <div className="jar-glass absolute inset-0 rounded-t-[60px] rounded-b-[40px] overflow-hidden">
                  {/* Glass Effect Background */}
                  <div 
                    className="absolute inset-0 bg-gradient-to-br from-white/30 via-white/20 to-white/10"
                    style={{
                      backdropFilter: 'blur(20px)',
                      WebkitBackdropFilter: 'blur(20px)',
                      border: '2px solid rgba(255, 255, 255, 0.3)',
                      boxShadow: `
                        0 8px 32px rgba(162, 210, 255, 0.15),
                        inset 0 2px 16px rgba(255, 255, 255, 0.4),
                        inset 0 -2px 16px rgba(162, 210, 255, 0.1)
                      `
                    }}
                  />
                  
                  {/* Jar Rim */}
                  <div 
                    className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1"
                    style={{
                      width: '90%',
                      height: '12px',
                      background: 'linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(162, 210, 255, 0.3) 100%)',
                      borderRadius: '50px',
                      boxShadow: '0 2px 8px rgba(162, 210, 255, 0.2)'
                    }}
                  />
                  
                  {/* Jar Opening */}
                  <div 
                    className="absolute top-0 left-1/2 transform -translate-x-1/2"
                    style={{
                      width: '85%',
                      height: '8px',
                      background: 'linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, transparent 100%)',
                      borderRadius: '50px'
                    }}
                  />
                </div>

                {/* Content Area */}
                <div className="jar-content absolute inset-4 top-8 bottom-4 rounded-t-[50px] rounded-b-[30px] overflow-hidden">
                  {isEmpty || isLoading ? (
                    <EmptyJarState isLoading={isLoading} timeRange={timeRange} />
                  ) : (
                    <JarContent categoryStats={displayStats} onBallClick={onBallClick} />
                  )}
                </div>

                {/* Jar Highlight Effects */}
                <div className="jar-highlights absolute inset-0 pointer-events-none">
                  {/* Left highlight */}
                  <div 
                    className="absolute left-4 top-12 w-8 h-24 rounded-full opacity-40"
                    style={{
                      background: 'linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, transparent 70%)',
                      filter: 'blur(8px)'
                    }}
                  />
                  
                  {/* Right subtle shadow */}
                  <div 
                    className="absolute right-6 top-16 w-6 h-32 rounded-full opacity-20"
                    style={{
                      background: 'linear-gradient(225deg, rgba(162, 210, 255, 0.4) 0%, transparent 70%)',
                      filter: 'blur(6px)'
                    }}
                  />
                </div>
              </div>

              {/* Jar Label */}
              <div className="jar-label mt-4 text-center">
                <div className="text-sm font-bold text-slate-600 mb-1">
                  {isEmpty ? '开始你的进度之旅' : '成就收集罐'}
                </div>
                <div className="text-xs text-slate-400">
                  {isEmpty 
                    ? '完成任务后，彩色小球会出现在这里' 
                    : `${totalTime.toFixed(1)}小时 · ${timeRange === 'today' ? '今日' : timeRange === 'weekly' ? '本周' : '本月'}`
                  }
                </div>
              </div>
            </div>
          );
        };

        // Empty State Component
        const EmptyJarState = ({ isLoading, timeRange }) => {
          if (isLoading) {
            return (
              <div className="flex flex-col items-center justify-center h-full">
                <div className="animate-spin w-8 h-8 border-2 border-slate-300 border-t-blue-400 rounded-full mb-4" />
                <div className="text-sm text-slate-500 font-medium">加载进度数据...</div>
              </div>
            );
          }

          return (
            <div className="flex flex-col items-center justify-center h-full p-6 text-center">
              {/* Floating sample balls animation */}
              <div className="relative mb-6">
                <div 
                  className="w-12 h-12 rounded-full animate-bounce"
                  style={{
                    background: 'linear-gradient(135deg, #BDE0FE 0%, #A2D2FF 100%)',
                    boxShadow: '0 4px 12px rgba(162, 210, 255, 0.3)',
                    animationDelay: '0s',
                    animationDuration: '2s'
                  }}
                />
                <div 
                  className="absolute -right-4 -top-2 w-8 h-8 rounded-full animate-bounce"
                  style={{
                    background: 'linear-gradient(135deg, #F5C2D6 0%, #E8A5C0 100%)',
                    boxShadow: '0 4px 12px rgba(245, 194, 214, 0.3)',
                    animationDelay: '0.5s',
                    animationDuration: '2.5s'
                  }}
                />
                <div 
                  className="absolute -left-3 top-4 w-6 h-6 rounded-full animate-bounce"
                  style={{
                    background: 'linear-gradient(135deg, #D9EFE8 0%, #A7F3D0 100%)',
                    boxShadow: '0 4px 12px rgba(167, 243, 208, 0.3)',
                    animationDelay: '1s',
                    animationDuration: '2.2s'
                  }}
                />
              </div>

              <div className="text-slate-400 text-sm font-medium mb-2">
                {timeRange === 'today' ? '今日' : timeRange === 'weekly' ? '本周' : '本月'}暂无进度数据
              </div>
              <div className="text-xs text-slate-300 leading-relaxed">
                开始计时或记录活动<br />
                彩色小球会在这里堆积
              </div>
            </div>
          );
        };

        // Jar Content Component
        const JarContent = ({ categoryStats, onBallClick }) => {
          const getCategoryPrimaryColor = (color) => {
            const colorMap = {
              'bg-macaron-blue': '#BDE0FE',
              'bg-macaron-green': '#D9EFE8',
              'bg-macaron-pink': '#F5C2D6',
              'bg-macaron-purple': '#C8A2E0',
              'bg-macaron-orange': '#FFE9D6',
              'bg-macaron-yellow': '#FFF8E1',
              'bg-emerald-200': '#A7F3D0',
              'bg-macaron-rose': '#FFE5E5'
            };
            return colorMap[color] || '#BDE0FE';
          };

          const getCategoryLightColor = (color) => {
            const colorMap = {
              'bg-macaron-blue': '#E7F5FF',
              'bg-macaron-green': '#F0F9F5',
              'bg-macaron-pink': '#FDF5F8',
              'bg-macaron-purple': '#F3EBFA',
              'bg-macaron-orange': '#FFF5ED',
              'bg-macaron-yellow': '#FFFEF7',
              'bg-emerald-200': '#ECFDF5',
              'bg-macaron-rose': '#FFF5F5'
            };
            return colorMap[color] || '#E7F5FF';
          };

          const getCategoryShadowColor = (color) => {
            const colorMap = {
              'bg-macaron-blue': 'rgba(162, 210, 255, 0.3)',
              'bg-macaron-green': 'rgba(167, 243, 208, 0.3)',
              'bg-macaron-pink': 'rgba(245, 194, 214, 0.3)',
              'bg-macaron-purple': 'rgba(200, 162, 224, 0.3)',
              'bg-macaron-orange': 'rgba(255, 183, 107, 0.3)',
              'bg-macaron-yellow': 'rgba(255, 235, 153, 0.3)',
              'bg-emerald-200': 'rgba(110, 231, 183, 0.3)',
              'bg-macaron-rose': 'rgba(252, 165, 165, 0.3)'
            };
            return colorMap[color] || 'rgba(162, 210, 255, 0.3)';
          };

          return (
            <div className="relative w-full h-full">
              <div className="flex flex-wrap items-end justify-center h-full p-4 gap-2">
                {categoryStats.map((stat, index) => (
                  <div
                    key={stat.categoryId}
                    className="flex flex-col items-center cursor-pointer transform hover:scale-105 transition-transform duration-200"
                    onClick={() => onBallClick?.(stat.categoryId)}
                    style={{ animationDelay: `${index * 0.1}s` }}
                  >
                    {/* Temporary ball representation */}
                    <div 
                      className="w-12 h-12 rounded-full animate-in"
                      style={{
                        background: `linear-gradient(135deg, ${getCategoryPrimaryColor(stat.color)} 0%, ${getCategoryLightColor(stat.color)} 100%)`,
                        boxShadow: `0 4px 12px ${getCategoryShadowColor(stat.color)}`
                      }}
                    />
                    <div className="text-xs text-slate-500 mt-1 font-medium">
                      {stat.icon} {(stat.totalMinutes / 60).toFixed(1)}h
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        };

        // Test App Component
        const TestApp = () => {
          const [currentTest, setCurrentTest] = useState('empty');
          
          const sampleData = [
            {
              categoryId: 'work',
              name: '工作',
              totalMinutes: 240,
              color: 'bg-macaron-blue',
              icon: '💻',
              ballCount: 4,
              priority: 'high',
              percentage: 50
            },
            {
              categoryId: 'study',
              name: '学习',
              totalMinutes: 120,
              color: 'bg-macaron-pink',
              icon: '📚',
              ballCount: 2,
              priority: 'high',
              percentage: 25
            },
            {
              categoryId: 'rest',
              name: '休息',
              totalMinutes: 60,
              color: 'bg-macaron-green',
              icon: '🛋️',
              ballCount: 1,
              priority: 'normal',
              percentage: 12.5
            },
            {
              categoryId: 'health',
              name: '健康',
              totalMinutes: 60,
              color: 'bg-emerald-200',
              icon: '💪',
              ballCount: 1,
              priority: 'normal',
              percentage: 12.5
            }
          ];

          const handleBallClick = (categoryId) => {
            alert(`点击了分类: ${categoryId}`);
          };

          return (
            <div className="min-h-screen p-8">
              <div className="max-w-4xl mx-auto">
                <h1 className="text-3xl font-bold text-center mb-8 text-slate-700">
                  Achievement Jar Container 测试
                </h1>
                
                {/* Test Controls */}
                <div className="flex justify-center gap-4 mb-8">
                  <button
                    onClick={() => setCurrentTest('empty')}
                    className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                      currentTest === 'empty' 
                        ? 'bg-blue-500 text-white' 
                        : 'bg-white text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    空状态
                  </button>
                  <button
                    onClick={() => setCurrentTest('loading')}
                    className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                      currentTest === 'loading' 
                        ? 'bg-blue-500 text-white' 
                        : 'bg-white text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    加载状态
                  </button>
                  <button
                    onClick={() => setCurrentTest('filled')}
                    className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                      currentTest === 'filled' 
                        ? 'bg-blue-500 text-white' 
                        : 'bg-white text-slate-600 hover:bg-slate-50'
                    }`}
                  >
                    有数据状态
                  </button>
                </div>

                {/* Test Cases */}
                <div className="bg-white rounded-2xl shadow-lg p-8 mb-8">
                  {currentTest === 'empty' && (
                    <AchievementJarContainer
                      categoryStats={[]}
                      totalTime={0}
                      timeRange="today"
                      isEmpty={true}
                      onBallClick={handleBallClick}
                    />
                  )}
                  
                  {currentTest === 'loading' && (
                    <AchievementJarContainer
                      categoryStats={[]}
                      totalTime={0}
                      timeRange="today"
                      isLoading={true}
                      onBallClick={handleBallClick}
                    />
                  )}
                  
                  {currentTest === 'filled' && (
                    <AchievementJarContainer
                      categoryStats={sampleData}
                      totalTime={8}
                      timeRange="today"
                      onBallClick={handleBallClick}
                    />
                  )}
                </div>

                {/* Feature Description */}
                <div className="bg-slate-50 rounded-xl p-6">
                  <h2 className="text-xl font-bold mb-4 text-slate-700">✨ 功能特性</h2>
                  <div className="grid md:grid-cols-2 gap-4 text-sm text-slate-600">
                    <div>
                      <h3 className="font-semibold mb-2">🏺 磨砂玻璃效果</h3>
                      <p>使用backdrop-filter实现真实的磨砂玻璃质感，带有渐变背景和光影效果</p>
                    </div>
                    <div>
                      <h3 className="font-semibold mb-2">📱 响应式设计</h3>
                      <p>移动端85%宽度，桌面端60%宽度，自适应不同屏幕尺寸</p>
                    </div>
                    <div>
                      <h3 className="font-semibold mb-2">🎨 空气感马卡龙配色</h3>
                      <p>低饱和度、高明度的治愈系配色方案，营造温馨氛围</p>
                    </div>
                    <div>
                      <h3 className="font-semibold mb-2">⚡ 交互反馈</h3>
                      <p>悬停缩放效果、点击回调、加载状态等丰富的用户交互</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        // Render the app
        const root = createRoot(document.getElementById('root'));
        root.render(<TestApp />);
    </script>
</body>
</html>
