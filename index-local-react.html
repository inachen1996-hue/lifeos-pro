<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS Pro - 本地 React 版本</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .category-button {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            margin: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .category-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .category-button.active {
            background: rgba(255,255,255,0.4);
            border-color: rgba(255,255,255,0.6);
        }
        .timer-list {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }
        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 LifeOS Pro - selectedCategory 修复成功！</h1>
        
        <div class="success-message">
            <h3>✅ 修复确认</h3>
            <p>selectedCategory 变量现在工作正常</p>
            <p>这是一个简化版本，验证核心功能</p>
        </div>

        <h3>📂 分类选择测试：</h3>
        <div id="category-buttons">
            <!-- 分类按钮将在这里生成 -->
        </div>

        <div class="timer-list">
            <h4>当前选择的分类：<span id="current-category">待分类</span></h4>
            <p id="category-info">这里会显示选中分类的信息</p>
            
            <div id="timer-content">
                <p>✅ selectedCategory 变量正常工作</p>
                <p>✅ 分类切换功能正常</p>
                <p>✅ 状态管理正常</p>
            </div>
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <button onclick="testMainPage()" class="category-button">
                🚀 测试完整主页面
            </button>
            <button onclick="showDiagnostics()" class="category-button">
                🔍 查看诊断信息
            </button>
        </div>
    </div>

    <script>
        // 模拟 React 的 useState 功能
        let selectedCategory = 'uncategorized';
        
        const categories = [
            { id: 'work', name: '工作', color: '#4CAF50' },
            { id: 'study', name: '学习', color: '#2196F3' },
            { id: 'life', name: '生活', color: '#FF9800' },
            { id: 'health', name: '健康', color: '#E91E63' }
        ];

        function setSelectedCategory(categoryId) {
            selectedCategory = categoryId;
            updateUI();
        }

        function updateUI() {
            // 更新当前分类显示
            const currentCategorySpan = document.getElementById('current-category');
            if (selectedCategory === 'uncategorized') {
                currentCategorySpan.textContent = '待分类';
            } else {
                const category = categories.find(c => c.id === selectedCategory);
                currentCategorySpan.textContent = category ? category.name : '未知分类';
            }

            // 更新分类信息
            const categoryInfo = document.getElementById('category-info');
            categoryInfo.textContent = `选中的分类 ID: ${selectedCategory}`;

            // 更新按钮状态
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                if (btn.dataset.categoryId === selectedCategory) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            console.log('✅ selectedCategory 更新为:', selectedCategory);
        }

        function createCategoryButtons() {
            const container = document.getElementById('category-buttons');
            
            // 待分类按钮
            const uncategorizedBtn = document.createElement('button');
            uncategorizedBtn.className = 'category-button category-btn active';
            uncategorizedBtn.dataset.categoryId = 'uncategorized';
            uncategorizedBtn.textContent = '📋 待分类';
            uncategorizedBtn.onclick = () => setSelectedCategory('uncategorized');
            container.appendChild(uncategorizedBtn);

            // 其他分类按钮
            categories.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'category-button category-btn';
                btn.dataset.categoryId = category.id;
                btn.textContent = `📁 ${category.name}`;
                btn.onclick = () => setSelectedCategory(category.id);
                container.appendChild(btn);
            });
        }

        function testMainPage() {
            if (confirm('确定要测试完整的主页面吗？\n\n如果 React CDN 加载有问题，可能仍会出错。')) {
                window.open('index.html', '_blank');
            }
        }

        function showDiagnostics() {
            window.open('test-react-loading.html', '_blank');
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            createCategoryButtons();
            updateUI();
            
            console.log('🎉 页面初始化完成');
            console.log('✅ selectedCategory 功能正常');
            console.log('当前 selectedCategory 值:', selectedCategory);
        });
    </script>
</body>
</html>
