<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计时器铃声修复测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin: 16px 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .test-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .test-btn:hover {
            transform: translateY(-2px);
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .upload-section {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 16px 0;
        }
        .upload-section.dragover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        input[type="file"] {
            margin: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔧 计时器铃声修复测试</h1>
        <p>测试倒计时和番茄钟的铃声是否能正常播放自定义音效</p>
    </div>

    <div class="card">
        <h3>📤 1. 上传自定义音效</h3>
        <div class="upload-section" id="uploadArea">
            <p>拖拽音频文件到这里，或点击下方按钮选择文件</p>
            <input type="file" id="audioFile" accept="audio/*">
            <button class="test-btn" onclick="document.getElementById('audioFile').click()">选择音频文件</button>
        </div>
        <div id="uploadStatus"></div>
    </div>

    <div class="card">
        <h3>🔍 2. 检查音效数据</h3>
        <button class="test-btn" onclick="checkCustomSounds()">检查自定义音效</button>
        <button class="test-btn" onclick="clearCustomSounds()">清空音效数据</button>
        <div id="soundStatus"></div>
    </div>

    <div class="card">
        <h3>🎵 3. 测试音效播放</h3>
        <button class="test-btn" onclick="testAlarmService()">测试 AlarmService</button>
        <button class="test-btn" onclick="testCustomSound()">测试自定义音效</button>
        <button class="test-btn" onclick="testWebAudioFallback()">测试默认音效</button>
        <div id="playStatus"></div>
    </div>

    <div class="card">
        <h3>⏰ 4. 模拟计时器场景</h3>
        <p>这些按钮模拟计时器到时的情况：</p>
        <button class="test-btn" onclick="simulateCountdownEnd()">模拟倒计时结束</button>
        <button class="test-btn" onclick="simulatePomodoroEnd()">模拟番茄钟结束</button>
        <div id="timerStatus"></div>
    </div>

    <script>
        // 模拟 alarmService（简化版本）
        class TestAlarmService {
            constructor() {
                this.customSounds = { cheer: null, clap: null, drum: null };
                this.isPlaying = false;
                this.loadCustomSounds();
            }

            loadCustomSounds() {
                try {
                    const stored = localStorage.getItem('lifeos_pro_custom_sounds');
                    if (stored) {
                        const sounds = JSON.parse(stored);
                        this.customSounds = {
                            cheer: sounds.cheer || null,
                            clap: sounds.clap || null,
                            drum: sounds.drum || null,
                        };
                        console.log('✅ 自定义音效已加载');
                    }
                } catch (error) {
                    console.warn('Failed to load custom sounds:', error);
                }
            }

            reloadCustomSounds() {
                this.loadCustomSounds();
            }

            playAlarm(soundType = 'cheer') {
                if (this.isPlaying) {
                    console.log('⚠️ 音效正在播放中');
                    return;
                }

                this.isPlaying = true;
                console.log(`🎵 播放音效: ${soundType}`);

                try {
                    const customSound = this.customSounds[soundType];
                    if (customSound) {
                        this.playCustomSound(customSound, soundType);
                    } else {
                        this.playWebAudioAlarm();
                    }
                } catch (error) {
                    console.warn('音效播放失败:', error);
                    this.isPlaying = false;
                }
            }

            playCustomSound(dataUrl, soundType) {
                console.log(`🔊 播放自定义${soundType}音效`);
                const audio = new Audio(dataUrl);
                audio.volume = 0.5;
                
                audio.onended = () => {
                    this.isPlaying = false;
                    console.log('✅ 自定义音效播放完成');
                };
                
                audio.onerror = (error) => {
                    console.error('自定义音效播放失败:', error);
                    this.isPlaying = false;
                    this.playWebAudioAlarm();
                };
                
                audio.play().catch((error) => {
                    console.error('音频播放失败:', error);
                    this.isPlaying = false;
                    this.playWebAudioAlarm();
                });
            }

            playWebAudioAlarm() {
                console.log('🔊 播放默认Web Audio音效');
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = ctx.createOscillator();
                    const gainNode = ctx.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);

                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';

                    const now = ctx.currentTime;
                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                    oscillator.start(now);
                    oscillator.stop(now + 0.5);

                    oscillator.onended = () => {
                        this.isPlaying = false;
                        ctx.close();
                        console.log('✅ 默认音效播放完成');
                    };
                } catch (error) {
                    console.error('Web Audio播放失败:', error);
                    this.isPlaying = false;
                }
            }

            stopAlarm() {
                this.isPlaying = false;
                console.log('🛑 停止音效');
            }
        }

        // 创建测试实例
        const testAlarmService = new TestAlarmService();

        // 文件上传处理
        document.getElementById('audioFile').addEventListener('change', handleFileUpload);

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('audio/')) {
                showStatus('uploadStatus', '❌ 请选择音频文件', 'error');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                showStatus('uploadStatus', '❌ 文件大小不能超过5MB', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dataUrl = e.target.result;
                    
                    // 保存为喝彩音效（计时器使用的类型）
                    const customSounds = {
                        cheer: dataUrl,
                        clap: null,
                        drum: null
                    };
                    
                    localStorage.setItem('lifeos_pro_custom_sounds', JSON.stringify(customSounds));
                    testAlarmService.reloadCustomSounds();
                    
                    showStatus('uploadStatus', `✅ 音效上传成功！文件: ${file.name}`, 'success');
                } catch (error) {
                    showStatus('uploadStatus', '❌ 音效保存失败: ' + error.message, 'error');
                }
            };
            
            reader.onerror = function() {
                showStatus('uploadStatus', '❌ 文件读取失败', 'error');
            };
            
            reader.readAsDataURL(file);
        }

        function checkCustomSounds() {
            try {
                const stored = localStorage.getItem('lifeos_pro_custom_sounds');
                if (stored) {
                    const sounds = JSON.parse(stored);
                    let info = '✅ 找到自定义音效数据：\n\n';
                    info += `喝彩音效: ${sounds.cheer ? '已设置' : '未设置'}\n`;
                    info += `鼓掌音效: ${sounds.clap ? '已设置' : '未设置'}\n`;
                    info += `打鼓音效: ${sounds.drum ? '已设置' : '未设置'}\n`;
                    showStatus('soundStatus', info, 'success');
                } else {
                    showStatus('soundStatus', '❌ 未找到自定义音效数据', 'error');
                }
            } catch (error) {
                showStatus('soundStatus', '❌ 读取音效数据失败: ' + error.message, 'error');
            }
        }

        function clearCustomSounds() {
            if (confirm('确定要清空自定义音效数据吗？')) {
                localStorage.removeItem('lifeos_pro_custom_sounds');
                testAlarmService.reloadCustomSounds();
                showStatus('soundStatus', '✅ 已清空自定义音效数据', 'info');
            }
        }

        function testAlarmService() {
            showStatus('playStatus', '🎵 测试 AlarmService 播放...', 'info');
            testAlarmService.playAlarm('cheer');
        }

        function testCustomSound() {
            const stored = localStorage.getItem('lifeos_pro_custom_sounds');
            if (!stored) {
                showStatus('playStatus', '❌ 请先上传自定义音效', 'error');
                return;
            }

            try {
                const sounds = JSON.parse(stored);
                if (sounds.cheer) {
                    showStatus('playStatus', '🔊 播放自定义喝彩音效...', 'info');
                    const audio = new Audio(sounds.cheer);
                    audio.volume = 0.5;
                    audio.play().then(() => {
                        showStatus('playStatus', '✅ 自定义音效播放成功', 'success');
                    }).catch(err => {
                        showStatus('playStatus', '❌ 播放失败: ' + err.message, 'error');
                    });
                } else {
                    showStatus('playStatus', '❌ 未找到喝彩音效数据', 'error');
                }
            } catch (error) {
                showStatus('playStatus', '❌ 解析音效数据失败: ' + error.message, 'error');
            }
        }

        function testWebAudioFallback() {
            showStatus('playStatus', '🔊 测试默认Web Audio音效...', 'info');
            testAlarmService.playWebAudioAlarm();
        }

        function simulateCountdownEnd() {
            showStatus('timerStatus', '⏰ 模拟倒计时结束 - 播放铃声', 'info');
            testAlarmService.reloadCustomSounds();
            testAlarmService.playAlarm('cheer');
        }

        function simulatePomodoroEnd() {
            showStatus('timerStatus', '🍅 模拟番茄钟结束 - 播放铃声', 'info');
            testAlarmService.reloadCustomSounds();
            testAlarmService.playAlarm('cheer');
        }

        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message.replace(/\n/g, '<br>')}</div>`;
        }

        // 页面加载时检查音效状态
        window.addEventListener('load', () => {
            checkCustomSounds();
        });
    </script>
</body>
</html>
