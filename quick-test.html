<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 28px;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
        .warning { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px 10px 10px 0;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .emoji {
            font-size: 24px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1><span class="emoji">🔧</span>LifeOS 快速测试</h1>
        <div id="status"></div>
        <div id="actions" style="margin-top: 20px;"></div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const actionsDiv = document.getElementById('actions');
        
        function addStatus(message, type = 'info', emoji = '📋') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `<span class="emoji">${emoji}</span>${message}`;
            statusDiv.appendChild(div);
        }
        
        function runTests() {
            statusDiv.innerHTML = '';
            
            // 测试 1: 基本环境
            addStatus('浏览器环境正常', 'success', '✅');
            
            // 测试 2: localStorage
            try {
                localStorage.setItem('test_key', 'test_value');
                const value = localStorage.getItem('test_key');
                localStorage.removeItem('test_key');
                if (value === 'test_value') {
                    addStatus('localStorage 可用', 'success', '✅');
                } else {
                    addStatus('localStorage 读写异常', 'error', '❌');
                }
            } catch (e) {
                addStatus('localStorage 不可用: ' + e.message, 'error', '❌');
            }
            
            // 测试 3: 检查 LifeOS 数据
            const lifeosKeys = Object.keys(localStorage).filter(k => k.startsWith('lifeos_'));
            if (lifeosKeys.length > 0) {
                addStatus(`发现 ${lifeosKeys.length} 个 LifeOS 数据项`, 'info', '📦');
                
                // 显示数据大小
                let totalSize = 0;
                lifeosKeys.forEach(key => {
                    const value = localStorage.getItem(key);
                    const size = new Blob([value]).size;
                    totalSize += size;
                });
                addStatus(`总数据大小: ${(totalSize / 1024).toFixed(2)} KB`, 'info', '💾');
            } else {
                addStatus('未发现 LifeOS 数据（这是正常的，如果是首次使用）', 'warning', '⚠️');
            }
            
            // 测试 4: 检查服务器
            fetch('index.html', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        addStatus('服务器连接正常', 'success', '✅');
                    } else {
                        addStatus('服务器响应异常: ' + response.status, 'warning', '⚠️');
                    }
                })
                .catch(error => {
                    addStatus('无法连接到服务器: ' + error.message, 'error', '❌');
                });
            
            // 测试 5: 检查关键文件
            const files = ['dist/storage.js', 'dist/timer-manager.js', 'dist/types.js'];
            let checkedFiles = 0;
            
            files.forEach(file => {
                fetch(file, { method: 'HEAD' })
                    .then(response => {
                        checkedFiles++;
                        if (response.ok) {
                            if (checkedFiles === files.length) {
                                addStatus('所有关键模块文件存在', 'success', '✅');
                            }
                        } else {
                            addStatus(`文件缺失: ${file}`, 'error', '❌');
                        }
                    })
                    .catch(error => {
                        addStatus(`无法检查文件 ${file}: ${error.message}`, 'error', '❌');
                    });
            });
        }
        
        // 添加操作按钮
        actionsDiv.innerHTML = `
            <a href="index.html" class="btn btn-primary">🚀 打开主应用</a>
            <button onclick="runTests()" class="btn btn-success">🔄 重新测试</button>
            <button onclick="if(confirm('确定要清除所有 LifeOS 数据吗？\\n\\n这将删除：\\n- 所有计时器\\n- 所有日记\\n- 所有历史记录\\n- API 配置\\n\\n此操作不可恢复！')) { localStorage.clear(); location.reload(); }" class="btn btn-danger">🗑️ 清除数据</button>
        `;
        
        // 自动运行测试
        runTests();
    </script>
</body>
</html>
