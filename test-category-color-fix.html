<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类颜色修复测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            color: #5D576B; 
        }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
            <div style="text-align: center;">
                <div style="width: 60px; height: 60px; border: 4px solid #E2C2FF; border-top-color: #5D576B; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                <p style="color: #5D576B; font-weight: bold;">加载中...</p>
            </div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>

    <script type="text/babel">
        const { useState } = React;
        const { createRoot } = ReactDOM;

        // 修复后的 GlassIcon 组件
        const GlassIcon = ({ icon, categoryId, size = 'medium', categories = [] }) => {
          const getCategoryGlowColor = (catId) => {
            const category = categories.find(cat => cat.id === catId);
            if (!category) {
              // 如果没有找到分类，根据 categoryId 提供默认颜色
              const defaultColorMap = {
                'work': 'rgba(189, 224, 254, 0.4)',      // 蓝色
                'study': 'rgba(217, 239, 232, 0.4)',     // 绿色
                'rest': 'rgba(245, 194, 214, 0.4)',      // 粉色
                'sleep': 'rgba(200, 162, 224, 0.4)',     // 紫色
                'life': 'rgba(255, 233, 214, 0.4)',      // 橙色
                'entertainment': 'rgba(255, 248, 225, 0.4)', // 黄色
                'health': 'rgba(167, 243, 208, 0.4)',    // 翠绿色
                'hobby': 'rgba(255, 229, 229, 0.4)'      // 玫瑰色
              };
              return defaultColorMap[catId] || 'rgba(189, 224, 254, 0.4)';
            }
            
            const colorMap = {
              'bg-macaron-blue': 'rgba(189, 224, 254, 0.4)',
              'bg-macaron-green': 'rgba(217, 239, 232, 0.4)',
              'bg-macaron-pink': 'rgba(245, 194, 214, 0.4)',
              'bg-macaron-purple': 'rgba(200, 162, 224, 0.4)',
              'bg-macaron-orange': 'rgba(255, 233, 214, 0.4)',
              'bg-macaron-yellow': 'rgba(255, 248, 225, 0.4)',
              'bg-emerald-200': 'rgba(167, 243, 208, 0.4)',
              'bg-macaron-rose': 'rgba(255, 229, 229, 0.4)'
            };
            
            return colorMap[category.color] || 'rgba(189, 224, 254, 0.4)';
          };

          const sizeConfig = {
            small: { container: 'w-8 h-8', text: 'text-sm', shadow: '0 2px 8px -1px' },
            medium: { container: 'w-12 h-12', text: 'text-lg', shadow: '0 4px 12px -2px' },
            large: { container: 'w-16 h-16', text: 'text-2xl', shadow: '0 6px 16px -3px' }
          };

          const config = sizeConfig[size];
          const glowColor = getCategoryGlowColor(categoryId);

          const containerStyle = {
            background: 'rgba(255, 255, 255, 0.85)',
            backdropFilter: 'blur(12px)',
            border: '1px solid rgba(255, 255, 255, 0.9)',
            boxShadow: `${config.shadow} ${glowColor}, inset 0 1px 4px rgba(255, 255, 255, 0.8)`,
            transition: 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)'
          };

          return (
            <div
              className={`
                ${config.container}
                rounded-full
                flex items-center justify-center
                relative
                overflow-hidden
              `}
              style={containerStyle}
            >
              <span 
                className={`${config.text} relative z-10 drop-shadow-sm`}
                style={{ 
                  filter: 'drop-shadow(0 1px 2px rgba(255, 255, 255, 0.8))',
                  textShadow: '0 1px 2px rgba(0, 0, 0, 0.1)'
                }}
              >
                {icon}
              </span>
              
              <div 
                className="absolute inset-0 rounded-full bg-gradient-to-br from-white/40 to-transparent pointer-events-none"
                style={{ opacity: 0.6 }}
              />
            </div>
          );
        };

        // 测试应用
        const TestApp = () => {
          const categories = [
            { id: 'work', name: '工作', color: 'bg-macaron-blue' },
            { id: 'study', name: '学习', color: 'bg-macaron-green' },
            { id: 'rest', name: '休息', color: 'bg-macaron-pink' },
            { id: 'sleep', name: '睡眠', color: 'bg-macaron-purple' },
            { id: 'life', name: '生活', color: 'bg-macaron-orange' },
            { id: 'entertainment', name: '娱乐', color: 'bg-macaron-yellow' },
            { id: 'health', name: '健康', color: 'bg-emerald-200' },
            { id: 'hobby', name: '兴趣', color: 'bg-macaron-rose' }
          ];

          return (
            <div className="min-h-screen p-8">
              <div className="max-w-4xl mx-auto">
                <h1 className="text-3xl font-black text-[#023E8A] mb-8 text-center">
                  🎨 分类颜色修复测试
                </h1>

                {/* 有分类数据的测试 */}
                <div className="bg-white/90 p-6 rounded-[24px] shadow-lg mb-8"
                     style={{
                       boxShadow: '0 8px 24px -4px rgba(162, 210, 255, 0.2), inset 0 2px 8px rgba(255, 255, 255, 0.8)',
                       border: '2px solid rgba(255, 255, 255, 0.9)'
                     }}>
                  
                  <h2 className="text-lg font-black text-[#023E8A] mb-4">✅ 有分类数据（正常情况）</h2>
                  
                  <div className="grid grid-cols-4 gap-6">
                    {categories.map(category => (
                      <div key={category.id} className="text-center">
                        <div className="mb-2">
                          <GlassIcon
                            icon="💻"
                            categoryId={category.id}
                            size="medium"
                            categories={categories}
                          />
                        </div>
                        <div className="text-xs font-bold text-gray-700">{category.name}</div>
                        <div className="text-xs text-gray-500">{category.color}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 无分类数据的测试（回退机制） */}
                <div className="bg-white/90 p-6 rounded-[24px] shadow-lg mb-8"
                     style={{
                       boxShadow: '0 8px 24px -4px rgba(162, 210, 255, 0.2), inset 0 2px 8px rgba(255, 255, 255, 0.8)',
                       border: '2px solid rgba(255, 255, 255, 0.9)'
                     }}>
                  
                  <h2 className="text-lg font-black text-[#023E8A] mb-4">🔧 无分类数据（回退机制）</h2>
                  <p className="text-sm text-gray-600 mb-4">
                    模拟 categories 为空数组的情况，测试默认颜色映射
                  </p>
                  
                  <div className="grid grid-cols-4 gap-6">
                    {categories.map(category => (
                      <div key={category.id} className="text-center">
                        <div className="mb-2">
                          <GlassIcon
                            icon="💻"
                            categoryId={category.id}
                            size="medium"
                            categories={[]} // 空数组，测试回退机制
                          />
                        </div>
                        <div className="text-xs font-bold text-gray-700">{category.name}</div>
                        <div className="text-xs text-gray-500">默认颜色</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 对比展示 */}
                <div className="bg-white/90 p-6 rounded-[24px] shadow-lg"
                     style={{
                       boxShadow: '0 8px 24px -4px rgba(162, 210, 255, 0.2), inset 0 2px 8px rgba(255, 255, 255, 0.8)',
                       border: '2px solid rgba(255, 255, 255, 0.9)'
                     }}>
                  
                  <h2 className="text-lg font-black text-[#023E8A] mb-4">🔍 修复说明</h2>
                  
                  <div className="space-y-4 text-sm">
                    <div className="p-4 bg-green-50 rounded-lg">
                      <h3 className="font-bold text-green-700 mb-2">✅ 修复内容</h3>
                      <ul className="space-y-1 text-green-600">
                        <li>• 添加了基于 categoryId 的默认颜色映射</li>
                        <li>• 当 categories 数组为空或找不到分类时，使用默认颜色</li>
                        <li>• 确保每个分类都有对应的光效颜色</li>
                      </ul>
                    </div>
                    
                    <div className="p-4 bg-blue-50 rounded-lg">
                      <h3 className="font-bold text-blue-700 mb-2">🎨 颜色映射</h3>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div><strong>工作:</strong> 蓝色光晕</div>
                        <div><strong>学习:</strong> 绿色光晕</div>
                        <div><strong>休息:</strong> 粉色光晕</div>
                        <div><strong>睡眠:</strong> 紫色光晕</div>
                        <div><strong>生活:</strong> 橙色光晕</div>
                        <div><strong>娱乐:</strong> 黄色光晕</div>
                        <div><strong>健康:</strong> 翠绿色光晕</div>
                        <div><strong>兴趣:</strong> 玫瑰色光晕</div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mt-6 text-center">
                  <button 
                    onClick={() => window.location.href = 'index.html'}
                    className="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded-xl font-bold hover:from-blue-600 hover:to-purple-600 transition-all shadow-lg hover:shadow-xl"
                  >
                    返回主应用测试
                  </button>
                </div>
              </div>
            </div>
          );
        };

        // 渲染应用
        const root = createRoot(document.getElementById('root'));
        root.render(<TestApp />);
    </script>
</body>
</html>
