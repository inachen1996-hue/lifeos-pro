<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计时器数据调试工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            color: #5D576B; 
        }
        .debug-panel {
            background: rgba(0,0,0,0.9);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">🔍 计时器数据调试工具</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- 调试控制面板 -->
            <div class="bg-white rounded-3xl p-6 shadow-lg">
                <h2 class="text-2xl font-semibold mb-4 text-center text-blue-600">调试控制</h2>
                
                <div class="space-y-4">
                    <button id="check-localstorage" class="w-full px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                        🔍 检查 localStorage 计时器数据
                    </button>
                    <button id="check-active-session" class="w-full px-4 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600">
                        ⏱️ 检查 activeTimerSession 参数
                    </button>
                    <button id="check-date-range" class="w-full px-4 py-3 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600">
                        📅 检查日期范围过滤
                    </button>
                    <button id="simulate-timer-data" class="w-full px-4 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600">
                        🎭 模拟今日计时器数据
                    </button>
                    <button id="test-data-processing" class="w-full px-4 py-3 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600">
                        ⚙️ 测试数据处理逻辑
                    </button>
                    <button id="clear-all-data" class="w-full px-4 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600">
                        🗑️ 清空所有计时器数据
                    </button>
                </div>
            </div>
            
            <!-- 调试输出面板 -->
            <div class="bg-white rounded-3xl p-6 shadow-lg">
                <h2 class="text-2xl font-semibold mb-4 text-center text-green-600">调试输出</h2>
                <div id="debug-output" class="debug-panel">
                    等待调试操作...
                </div>
            </div>
        </div>

        <!-- 数据状态面板 -->
        <div class="mt-8 bg-gradient-to-r from-blue-50 to-purple-50 rounded-3xl p-6 border border-blue-200">
            <h3 class="text-xl font-bold text-gray-800 mb-4">📊 数据状态总览</h3>
            <div id="data-status" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-lg">
                    <h4 class="font-bold text-gray-700 mb-2">localStorage 数据</h4>
                    <div id="localStorage-status" class="text-sm text-gray-600">未检查</div>
                </div>
                <div class="bg-white p-4 rounded-lg">
                    <h4 class="font-bold text-gray-700 mb-2">activeTimerSession</h4>
                    <div id="activeSession-status" class="text-sm text-gray-600">未检查</div>
                </div>
                <div class="bg-white p-4 rounded-lg">
                    <h4 class="font-bold text-gray-700 mb-2">日期范围</h4>
                    <div id="dateRange-status" class="text-sm text-gray-600">未检查</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 调试日志函数
        function debugLog(message, type = 'info') {
            const output = document.getElementById('debug-output');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff4444' : type === 'warn' ? '#ffaa00' : '#00ff00';
            
            output.innerHTML += `<div style="color: ${color}; margin-bottom: 4px;">
                [${timestamp}] ${message}
            </div>`;
            output.scrollTop = output.scrollHeight;
        }

        // 获取今日日期范围
        function getTodayRange() {
            const today = new Date();
            const startOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const endOfDay = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
            
            return {
                start: startOfDay,
                end: endOfDay,
                startISO: startOfDay.toISOString(),
                endISO: endOfDay.toISOString()
            };
        }

        // 检查 localStorage 计时器数据
        function checkLocalStorageData() {
            debugLog('🔍 开始检查 localStorage 计时器数据...', 'info');
            
            try {
                // 检查所有可能的计时器相关键
                const timerKeys = [
                    'activeTimerSession',
                    'lifeos_timer_sessions',
                    'lifeos_pro_timer',
                    'completedSessions',
                    'timerHistory'
                ];
                
                let foundData = false;
                
                timerKeys.forEach(key => {
                    const data = localStorage.getItem(key);
                    if (data) {
                        foundData = true;
                        debugLog(`✅ 找到键: ${key}`, 'info');
                        
                        try {
                            const parsed = JSON.parse(data);
                            debugLog(`📄 ${key} 内容:`, 'info');
                            debugLog(JSON.stringify(parsed, null, 2), 'info');
                            
                            // 特别检查 completedSessions
                            if (parsed.completedSessions && Array.isArray(parsed.completedSessions)) {
                                debugLog(`🎯 ${key} 包含 ${parsed.completedSessions.length} 个完成会话`, 'info');
                                
                                const today = getTodayRange();
                                const todaySessions = parsed.completedSessions.filter(session => {
                                    const sessionDate = new Date(session.startTime);
                                    return sessionDate >= today.start && sessionDate < today.end;
                                });
                                
                                debugLog(`📅 今日会话数量: ${todaySessions.length}`, todaySessions.length > 0 ? 'info' : 'warn');
                                
                                if (todaySessions.length > 0) {
                                    debugLog('📋 今日会话详情:', 'info');
                                    todaySessions.forEach((session, idx) => {
                                        debugLog(`  ${idx + 1}. ${session.title || '未命名'} - ${session.duration || 0}秒 - ${session.category || '无分类'}`, 'info');
                                    });
                                }
                            }
                        } catch (e) {
                            debugLog(`❌ 解析 ${key} 数据失败: ${e.message}`, 'error');
                        }
                    } else {
                        debugLog(`❌ 未找到键: ${key}`, 'warn');
                    }
                });
                
                if (!foundData) {
                    debugLog('⚠️ 没有找到任何计时器相关数据', 'warn');
                }
                
                // 更新状态显示
                document.getElementById('localStorage-status').innerHTML = foundData 
                    ? '<span class="text-green-600">✅ 找到数据</span>' 
                    : '<span class="text-red-600">❌ 无数据</span>';
                    
            } catch (error) {
                debugLog(`❌ 检查 localStorage 时出错: ${error.message}`, 'error');
            }
        }

        // 检查 activeTimerSession 参数
        function checkActiveSessionParam() {
            debugLog('🔍 检查 activeTimerSession 参数传递...', 'info');
            
            // 模拟主应用中的参数获取逻辑
            try {
                // 检查全局变量
                if (typeof window.activeTimerSession !== 'undefined') {
                    debugLog('✅ 找到全局 activeTimerSession', 'info');
                    debugLog(JSON.stringify(window.activeTimerSession, null, 2), 'info');
                } else {
                    debugLog('❌ 未找到全局 activeTimerSession', 'warn');
                }
                
                // 检查是否有其他方式获取当前会话
                const storedSession = localStorage.getItem('activeTimerSession');
                if (storedSession) {
                    const session = JSON.parse(storedSession);
                    debugLog('📦 从 localStorage 获取的会话:', 'info');
                    debugLog(JSON.stringify(session, null, 2), 'info');
                    
                    if (session.completedSessions) {
                        debugLog(`🎯 包含 ${session.completedSessions.length} 个完成会话`, 'info');
                    }
                } else {
                    debugLog('❌ localStorage 中没有 activeTimerSession', 'warn');
                }
                
                // 更新状态显示
                document.getElementById('activeSession-status').innerHTML = storedSession 
                    ? '<span class="text-green-600">✅ 有数据</span>' 
                    : '<span class="text-red-600">❌ 无数据</span>';
                    
            } catch (error) {
                debugLog(`❌ 检查 activeTimerSession 时出错: ${error.message}`, 'error');
            }
        }

        // 检查日期范围过滤
        function checkDateRangeFiltering() {
            debugLog('🔍 检查日期范围过滤逻辑...', 'info');
            
            const today = getTodayRange();
            debugLog(`📅 今日范围: ${today.startISO} 到 ${today.endISO}`, 'info');
            
            // 模拟一些测试数据
            const testSessions = [
                {
                    startTime: new Date().toISOString(), // 现在
                    title: '当前时间会话',
                    duration: 1500
                },
                {
                    startTime: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString(), // 2小时前
                    title: '2小时前会话',
                    duration: 1800
                },
                {
                    startTime: new Date(Date.now() - 25 * 60 * 60 * 1000).toISOString(), // 昨天
                    title: '昨天会话',
                    duration: 2700
                }
            ];
            
            debugLog('🧪 测试会话数据:', 'info');
            testSessions.forEach((session, idx) => {
                const sessionDate = new Date(session.startTime);
                const isInRange = sessionDate >= today.start && sessionDate < today.end;
                
                debugLog(`  ${idx + 1}. ${session.title}`, 'info');
                debugLog(`     时间: ${session.startTime}`, 'info');
                debugLog(`     在今日范围内: ${isInRange ? '✅ 是' : '❌ 否'}`, isInRange ? 'info' : 'warn');
            });
            
            const todayCount = testSessions.filter(session => {
                const sessionDate = new Date(session.startTime);
                return sessionDate >= today.start && sessionDate < today.end;
            }).length;
            
            debugLog(`📊 今日范围内的会话数量: ${todayCount}`, 'info');
            
            // 更新状态显示
            document.getElementById('dateRange-status').innerHTML = 
                `<span class="text-blue-600">📅 ${today.start.toLocaleDateString()}</span>`;
        }

        // 模拟今日计时器数据
        function simulateTodayTimerData() {
            debugLog('🎭 模拟今日计时器数据...', 'info');
            
            const now = new Date();
            const mockSession = {
                completedSessions: [
                    {
                        startTime: new Date(now.getTime() - 30 * 60 * 1000).toISOString(), // 30分钟前
                        category: 'work',
                        duration: 1500, // 25分钟
                        title: '模拟工作任务'
                    },
                    {
                        startTime: new Date(now.getTime() - 90 * 60 * 1000).toISOString(), // 90分钟前
                        category: 'study',
                        duration: 1800, // 30分钟
                        title: '模拟学习任务'
                    }
                ]
            };
            
            localStorage.setItem('activeTimerSession', JSON.stringify(mockSession));
            debugLog('✅ 已创建模拟数据', 'info');
            debugLog(JSON.stringify(mockSession, null, 2), 'info');
            
            // 重新检查数据
            setTimeout(() => {
                checkLocalStorageData();
            }, 500);
        }

        // 测试数据处理逻辑
        function testDataProcessing() {
            debugLog('⚙️ 测试数据处理逻辑...', 'info');
            
            try {
                const storedSession = localStorage.getItem('activeTimerSession');
                if (!storedSession) {
                    debugLog('❌ 没有找到计时器数据进行测试', 'error');
                    return;
                }
                
                const session = JSON.parse(storedSession);
                const today = getTodayRange();
                
                debugLog('🔄 开始处理计时器数据...', 'info');
                
                if (session.completedSessions && Array.isArray(session.completedSessions)) {
                    const timerItems = [];
                    
                    session.completedSessions.forEach((completedSession, idx) => {
                        const sessionDate = new Date(completedSession.startTime);
                        debugLog(`📋 处理会话 ${idx + 1}: ${completedSession.title}`, 'info');
                        debugLog(`   时间: ${completedSession.startTime}`, 'info');
                        debugLog(`   会话日期: ${sessionDate.toLocaleString()}`, 'info');
                        debugLog(`   今日开始: ${today.start.toLocaleString()}`, 'info');
                        debugLog(`   今日结束: ${today.end.toLocaleString()}`, 'info');
                        
                        const isInRange = sessionDate >= today.start && sessionDate < today.end;
                        debugLog(`   在范围内: ${isInRange}`, isInRange ? 'info' : 'warn');
                        
                        if (isInRange) {
                            const item = {
                                id: `timer_active_${idx}`,
                                timestamp: completedSession.startTime,
                                category: completedSession.category || 'work',
                                duration: completedSession.duration || 1500,
                                title: completedSession.title || '计时器任务',
                                metadata: { source: 'timer', type: 'active_session' }
                            };
                            
                            timerItems.push(item);
                            debugLog(`✅ 添加到结果: ${item.title}`, 'info');
                        } else {
                            debugLog(`❌ 跳过（不在今日范围）: ${completedSession.title}`, 'warn');
                        }
                    });
                    
                    debugLog(`📊 处理结果: 找到 ${timerItems.length} 个今日计时器项目`, 'info');
                    
                    if (timerItems.length > 0) {
                        debugLog('🎯 今日计时器项目详情:', 'info');
                        timerItems.forEach((item, idx) => {
                            debugLog(`  ${idx + 1}. ${item.title} - ${item.duration}秒 - ${item.category}`, 'info');
                        });
                    }
                } else {
                    debugLog('❌ completedSessions 不存在或不是数组', 'error');
                }
                
            } catch (error) {
                debugLog(`❌ 数据处理测试失败: ${error.message}`, 'error');
            }
        }

        // 清空所有计时器数据
        function clearAllTimerData() {
            debugLog('🗑️ 清空所有计时器数据...', 'info');
            
            const timerKeys = [
                'activeTimerSession',
                'lifeos_timer_sessions',
                'lifeos_pro_timer',
                'completedSessions',
                'timerHistory'
            ];
            
            timerKeys.forEach(key => {
                if (localStorage.getItem(key)) {
                    localStorage.removeItem(key);
                    debugLog(`✅ 已删除: ${key}`, 'info');
                }
            });
            
            debugLog('🧹 清理完成', 'info');
            
            // 更新状态显示
            document.getElementById('localStorage-status').innerHTML = '<span class="text-gray-500">已清空</span>';
            document.getElementById('activeSession-status').innerHTML = '<span class="text-gray-500">已清空</span>';
        }

        // 绑定按钮事件
        document.getElementById('check-localstorage').onclick = checkLocalStorageData;
        document.getElementById('check-active-session').onclick = checkActiveSessionParam;
        document.getElementById('check-date-range').onclick = checkDateRangeFiltering;
        document.getElementById('simulate-timer-data').onclick = simulateTodayTimerData;
        document.getElementById('test-data-processing').onclick = testDataProcessing;
        document.getElementById('clear-all-data').onclick = clearAllTimerData;

        // 页面加载时自动检查
        window.onload = function() {
            debugLog('🚀 计时器数据调试工具已加载', 'info');
            debugLog('💡 点击按钮开始调试计时器数据问题', 'info');
        };
    </script>
</body>
</html>
