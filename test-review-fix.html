<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复盘页面修复测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TestApp = () => {
            const [testResults, setTestResults] = useState([]);

            const addTestResult = (name, success, message) => {
                setTestResults(prev => [...prev, { name, success, message, time: new Date().toLocaleTimeString() }]);
            };

            // 测试 1: 基本组件渲染
            const testBasicRender = () => {
                try {
                    const TestComponent = () => <div>测试组件</div>;
                    ReactDOM.render(<TestComponent />, document.createElement('div'));
                    addTestResult('基本组件渲染', true, '组件渲染成功');
                } catch (error) {
                    addTestResult('基本组件渲染', false, error.message);
                }
            };

            // 测试 2: 安全函数调用
            const testSafeFunctionCall = () => {
                try {
                    const safeCall = (fn, ...args) => {
                        if (typeof fn === 'function') {
                            return fn(...args);
                        }
                        return null;
                    };

                    // 测试正常函数调用
                    const result1 = safeCall(() => 'success');
                    if (result1 !== 'success') throw new Error('正常函数调用失败');

                    // 测试 undefined 函数调用
                    const result2 = safeCall(undefined);
                    if (result2 !== null) throw new Error('undefined 函数调用处理失败');

                    // 测试 null 函数调用
                    const result3 = safeCall(null);
                    if (result3 !== null) throw new Error('null 函数调用处理失败');

                    addTestResult('安全函数调用', true, '所有测试通过');
                } catch (error) {
                    addTestResult('安全函数调用', false, error.message);
                }
            };

            // 测试 3: 条件渲染
            const testConditionalRender = () => {
                try {
                    const ConditionalComponent = ({ onToggleMode }) => {
                        return (
                            <div>
                                {typeof onToggleMode === 'function' && (
                                    <button onClick={onToggleMode}>切换</button>
                                )}
                                {typeof onToggleMode !== 'function' && (
                                    <span>无切换功能</span>
                                )}
                            </div>
                        );
                    };

                    // 测试有函数的情况
                    const div1 = document.createElement('div');
                    ReactDOM.render(<ConditionalComponent onToggleMode={() => {}} />, div1);
                    if (!div1.querySelector('button')) throw new Error('有函数时按钮未渲染');

                    // 测试无函数的情况
                    const div2 = document.createElement('div');
                    ReactDOM.render(<ConditionalComponent onToggleMode={null} />, div2);
                    if (!div2.querySelector('span')) throw new Error('无函数时提示未渲染');

                    addTestResult('条件渲染', true, '条件渲染正常工作');
                } catch (error) {
                    addTestResult('条件渲染', false, error.message);
                }
            };

            // 运行所有测试
            useEffect(() => {
                setTimeout(() => {
                    testBasicRender();
                    testSafeFunctionCall();
                    testConditionalRender();
                }, 100);
            }, []);

            return (
                <div className="min-h-screen bg-gray-50 p-8">
                    <div className="max-w-4xl mx-auto">
                        <h1 className="text-3xl font-bold mb-8 text-center">复盘页面修复测试</h1>
                        
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <h2 className="text-xl font-semibold mb-4">测试结果</h2>
                            
                            {testResults.length === 0 && (
                                <div className="text-center py-8">
                                    <div className="animate-spin w-8 h-8 border-4 border-blue-200 border-t-blue-500 rounded-full mx-auto mb-4"></div>
                                    <p className="text-gray-600">正在运行测试...</p>
                                </div>
                            )}

                            <div className="space-y-3">
                                {testResults.map((result, index) => (
                                    <div 
                                        key={index}
                                        className={`p-4 rounded-lg border ${
                                            result.success 
                                                ? 'bg-green-50 border-green-200' 
                                                : 'bg-red-50 border-red-200'
                                        }`}
                                    >
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-6 h-6 rounded-full flex items-center justify-center text-white text-sm font-bold ${
                                                    result.success ? 'bg-green-500' : 'bg-red-500'
                                                }`}>
                                                    {result.success ? '✓' : '✗'}
                                                </div>
                                                <span className="font-medium">{result.name}</span>
                                            </div>
                                            <span className="text-sm text-gray-500">{result.time}</span>
                                        </div>
                                        <p className={`mt-2 text-sm ${
                                            result.success ? 'text-green-700' : 'text-red-700'
                                        }`}>
                                            {result.message}
                                        </p>
                                    </div>
                                ))}
                            </div>

                            {testResults.length > 0 && (
                                <div className="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                    <h3 className="font-semibold text-blue-800 mb-2">测试总结</h3>
                                    <p className="text-blue-700">
                                        总计: {testResults.length} 个测试，
                                        成功: {testResults.filter(r => r.success).length} 个，
                                        失败: {testResults.filter(r => !r.success).length} 个
                                    </p>
                                    {testResults.every(r => r.success) && (
                                        <p className="text-green-700 font-medium mt-2">
                                            🎉 所有测试通过！复盘页面修复成功。
                                        </p>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="mt-8 text-center">
                            <a 
                                href="/index.html" 
                                className="inline-block px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                            >
                                返回主应用测试
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<TestApp />, document.getElementById('root'));
    </script>
</body>
</html>
