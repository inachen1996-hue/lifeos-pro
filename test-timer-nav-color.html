<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计时器导航栏颜色测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            color: #5D576B; 
        }
    </style>
</head>
<body class="min-h-screen p-8">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-8 text-center">计时器导航栏颜色测试</h1>
        
        <div class="bg-white rounded-2xl p-6 shadow-lg mb-8">
            <h2 class="text-lg font-bold mb-4">测试说明</h2>
            <p class="text-sm text-gray-600 mb-4">
                这个测试验证底部导航栏的计时器图标背景颜色是否能根据选中的分类颜色动态变化：
            </p>
            <ul class="text-sm text-gray-600 space-y-2">
                <li>• 选择"工作"分类时，计时器图标背景变为粉色</li>
                <li>• 选择"运动"分类时，计时器图标背景变为蓝色</li>
                <li>• 选择其他分类时，颜色按顺序循环</li>
                <li>• 选择"待分类"时，显示灰色</li>
            </ul>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-lg mb-8">
            <h2 class="text-lg font-bold mb-4">分类选择模拟</h2>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="selectCategory('work')" class="category-btn p-3 rounded-xl bg-gradient-to-br from-pink-100 to-pink-200 text-pink-900 font-bold">
                    💼 工作
                </button>
                <button onclick="selectCategory('sport')" class="category-btn p-3 rounded-xl bg-gradient-to-br from-blue-100 to-blue-200 text-blue-900 font-bold">
                    🏃 运动
                </button>
                <button onclick="selectCategory('study')" class="category-btn p-3 rounded-xl bg-gradient-to-br from-green-100 to-green-200 text-green-900 font-bold">
                    📚 学习
                </button>
                <button onclick="selectCategory('uncategorized')" class="category-btn p-3 rounded-xl bg-gradient-to-br from-gray-100 to-gray-200 text-gray-900 font-bold">
                    📦 待分类
                </button>
            </div>
            
            <div class="text-center">
                <p class="text-sm text-gray-600 mb-2">当前选中分类：</p>
                <p id="currentCategory" class="font-bold text-lg">工作</p>
            </div>
        </div>

        <!-- 模拟底部导航栏 -->
        <div class="fixed bottom-5 left-4 right-4 max-w-md mx-auto">
            <div class="bg-white/95 backdrop-blur-xl rounded-[36px] h-[72px] shadow-2xl flex justify-between items-center px-6 border border-white/50">
                <!-- 计时器按钮 - 动态颜色 -->
                <div class="flex-1 py-2 flex flex-col items-center gap-1">
                    <div id="timerNavIcon" class="p-3 rounded-2xl transition-all bg-gradient-to-br from-pink-100 to-pink-200 shadow-lg shadow-pink-200/50">
                        <svg class="w-6 h-6 text-pink-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12,6 12,12 16,14"></polyline>
                        </svg>
                    </div>
                    <span id="timerNavText" class="text-xs font-bold text-pink-600">计时器</span>
                </div>
                
                <!-- 其他导航按钮 -->
                <div class="flex-1 py-2 flex flex-col items-center gap-1">
                    <div class="p-3 rounded-2xl bg-transparent">
                        <svg class="w-6 h-6 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </div>
                    <span class="text-xs font-bold text-slate-300">日记</span>
                </div>
                
                <div class="flex-1 py-2 flex flex-col items-center gap-1">
                    <div class="p-3 rounded-2xl bg-transparent">
                        <svg class="w-6 h-6 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                            <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                        </svg>
                    </div>
                    <span class="text-xs font-bold text-slate-300">复盘</span>
                </div>
                
                <div class="flex-1 py-2 flex flex-col items-center gap-1">
                    <div class="p-3 rounded-2xl bg-transparent">
                        <svg class="w-6 h-6 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <span class="text-xs font-bold text-slate-300">计划</span>
                </div>
                
                <div class="flex-1 py-2 flex flex-col items-center gap-1">
                    <div class="p-3 rounded-2xl bg-transparent">
                        <svg class="w-6 h-6 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </div>
                    <span class="text-xs font-bold text-slate-300">设置</span>
                </div>
            </div>
        </div>

        <div class="h-24"></div> <!-- 底部间距 -->
    </div>

    <script>
        // 分类颜色映射
        const categoryColors = {
            'work': {
                bg: 'bg-gradient-to-br from-pink-100 to-pink-200',
                text: 'text-pink-600',
                shadow: 'shadow-lg shadow-pink-200/50',
                name: '工作'
            },
            'sport': {
                bg: 'bg-gradient-to-br from-blue-100 to-blue-200',
                text: 'text-blue-600',
                shadow: 'shadow-lg shadow-blue-200/50',
                name: '运动'
            },
            'study': {
                bg: 'bg-gradient-to-br from-green-100 to-green-200',
                text: 'text-green-600',
                shadow: 'shadow-lg shadow-green-200/50',
                name: '学习'
            },
            'uncategorized': {
                bg: 'bg-gradient-to-br from-gray-100 to-gray-200',
                text: 'text-gray-600',
                shadow: 'shadow-lg shadow-gray-200/50',
                name: '待分类'
            }
        };

        function selectCategory(categoryId) {
            const color = categoryColors[categoryId];
            const timerIcon = document.getElementById('timerNavIcon');
            const timerText = document.getElementById('timerNavText');
            const currentCategory = document.getElementById('currentCategory');
            
            // 清除所有颜色类
            timerIcon.className = 'p-3 rounded-2xl transition-all';
            timerText.className = 'text-xs font-bold';
            
            // 添加新的颜色类
            timerIcon.className += ` ${color.bg} ${color.shadow}`;
            timerText.className += ` ${color.text}`;
            
            // 更新图标颜色
            const svg = timerIcon.querySelector('svg');
            svg.className = `w-6 h-6 ${color.text}`;
            
            // 更新当前分类显示
            currentCategory.textContent = color.name;
            
            console.log(`✅ 切换到分类: ${color.name}`);
            console.log(`🎨 应用颜色: ${color.bg} ${color.text}`);
        }

        // 初始化
        selectCategory('work');
    </script>
</body>
</html>
