<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计划生成Loading集成测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        airy: {
                            blue: { DEFAULT: '#BDE0FE', light: '#E7F5FF', soft: '#D0EBFF', deep: '#023E8A' },
                            gray: { bg: '#FDFCFB', card: '#FFFFFF', border: '#F0EBE8', text: '#8B8490', dark: '#5D576B' }
                        }
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            color: #5D576B; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Mock Lucide icons
        const ArrowRight = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        );
        
        const Loader2 = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 12a9 9 0 11-6.219-8.56"/>
            </svg>
        );

        const Coffee = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/>
            </svg>
        );

        const UtensilsCrossed = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2M7 2v20M21 15V2v0a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3z"/>
            </svg>
        );

        const Utensils = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2M7 2v20M21 15V2v0a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3z"/>
            </svg>
        );

        const Bath = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M2 12h20M5 12V7a1 1 0 011-1h1M18 12V7a1 1 0 00-1-1h-1M2 12v5a2 2 0 002 2h16a2 2 0 002-2v-5"/>
            </svg>
        );

        const Sparkles = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M9.937 15.5A2 2 0 008.5 14.063l-6.135-1.582a.5.5 0 010-.962L8.5 9.936A2 2 0 009.937 8.5l1.582-6.135a.5.5 0 01.962 0L14.063 8.5A2 2 0 0015.5 9.937l6.135 1.582a.5.5 0 010 .962L15.5 14.063a2 2 0 00-1.437 1.437l-1.582 6.135a.5.5 0 01-.962 0L9.937 15.5z"/>
            </svg>
        );

        const UserCheck = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 7a4 4 0 100 8 4 4 0 000-8zM16 11l2 2 4-4"/>
            </svg>
        );

        const PlanLoadingTest = () => {
            const [loading, setLoading] = useState({ state: false, text: '', progress: 0, taskType: '' });
            const [bioState, setBioState] = useState({
                hadBreakfast: false,
                hadLunch: false,
                hadDinner: false,
                washedMorning: false,
                washedEvening: false
            });
            const [planInput, setPlanInput] = useState('');

            const toggleBio = (key) => {
                setBioState(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const generatePlan = async () => {
                setLoading({ state: true, text: '正在编织美好的一天...', progress: 10, taskType: 'plan' });
                
                // 模拟进度更新
                let progress = 10;
                const timer = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress > 95) progress = 95;
                    
                    let text = '正在编织美好的一天...';
                    if (progress > 30) text = '正在分析您的生理状态...';
                    if (progress > 60) text = '结合番茄钟设置优化...';
                    if (progress > 80) text = '生成个性化安排...';
                    
                    setLoading(prev => ({ ...prev, progress: Math.round(progress), text }));
                }, 200);

                // 模拟API调用
                setTimeout(() => {
                    clearInterval(timer);
                    setLoading({ state: false, text: '', progress: 0, taskType: '' });
                    alert('计划生成完成！（这是测试）');
                }, 5000);
            };

            const btnClass = (active, color) => 
                `p-5 rounded-2xl border-2 transition-all flex flex-col items-center justify-center gap-2 ${
                    active ? `${color} border-transparent shadow-lg transform scale-105` : 
                    'bg-white border-slate-100 text-slate-300 hover:border-slate-200'
                }`;

            return (
                <div className="min-h-screen p-4">
                    <div className="max-w-md mx-auto">
                        <h1 className="text-2xl font-bold text-center mb-6 text-slate-700">
                            计划生成Loading集成测试
                        </h1>
                        
                        <div className="space-y-6">
                            {/* 生理打卡 */}
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <div className="flex flex-col mb-4">
                                    <h3 className="font-bold text-xl mb-2 text-slate-700 flex items-center gap-2">
                                        <UserCheck className="w-6 h-6 text-green-500"/> 生理打卡
                                    </h3>
                                    <p className="text-xs text-slate-400 font-medium mt-1 ml-8">
                                        ✨ 点亮已经做完的事情，未完成的会自动加入计划哦
                                    </p>
                                </div>
                                <div className="grid grid-cols-3 gap-3 mb-3">
                                    <button 
                                        onClick={() => toggleBio('hadBreakfast')} 
                                        className={btnClass(bioState.hadBreakfast, 'bg-orange-200 text-orange-900')}
                                    >
                                        <Coffee className="w-6 h-6"/> 
                                        <span className="text-sm font-bold">早餐</span>
                                    </button>
                                    <button 
                                        onClick={() => toggleBio('hadLunch')} 
                                        className={btnClass(bioState.hadLunch, 'bg-orange-200 text-orange-900')}
                                    >
                                        <UtensilsCrossed className="w-6 h-6"/> 
                                        <span className="text-sm font-bold">午餐</span>
                                    </button>
                                    <button 
                                        onClick={() => toggleBio('hadDinner')} 
                                        className={btnClass(bioState.hadDinner, 'bg-orange-200 text-orange-900')}
                                    >
                                        <Utensils className="w-6 h-6"/> 
                                        <span className="text-sm font-bold">晚餐</span>
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <button 
                                        onClick={() => toggleBio('washedMorning')} 
                                        className={btnClass(bioState.washedMorning, 'bg-blue-100 text-blue-900')}
                                    >
                                        <Bath className="w-6 h-6"/> 
                                        <span className="text-sm font-bold">晨间洗漱</span>
                                    </button>
                                    <button 
                                        onClick={() => toggleBio('washedEvening')} 
                                        className={btnClass(bioState.washedEvening, 'bg-blue-100 text-blue-900')}
                                    >
                                        <Sparkles className="w-6 h-6"/> 
                                        <span className="text-sm font-bold">晚间洗漱</span>
                                    </button>
                                </div>
                            </div>

                            {/* 特别事项输入 */}
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-700">今日特别事项</h3>
                                <textarea
                                    value={planInput}
                                    onChange={(e) => setPlanInput(e.target.value)}
                                    className="w-full h-28 bg-white border-2 border-slate-100 rounded-2xl p-4 text-base text-slate-700 placeholder:text-slate-300 outline-none focus:border-blue-400" 
                                    placeholder="今日特别事项 (例如: 晚上8点有约)..."
                                />
                            </div>

                            {/* 生成计划按钮和Loading状态 */}
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <button 
                                    onClick={generatePlan} 
                                    disabled={loading.state && loading.taskType === 'plan'}
                                    className={`w-full py-5 rounded-2xl font-bold text-lg flex justify-center items-center gap-2 transition-all shadow-lg ${
                                        loading.state && loading.taskType === 'plan' 
                                            ? 'bg-slate-300 text-slate-500 cursor-not-allowed' 
                                            : 'bg-gradient-to-r from-yellow-400 to-amber-500 text-white hover:shadow-xl hover:shadow-yellow-200/50'
                                    }`}
                                >
                                    {loading.state && loading.taskType === 'plan' ? (
                                        <>
                                            <Loader2 className="w-6 h-6 animate-spin"/>
                                            {loading.text}
                                            <span className="ml-2 font-black">{loading.progress}%</span>
                                        </>
                                    ) : (
                                        <>
                                            生成今日计划 <ArrowRight className="w-6 h-6"/>
                                        </>
                                    )}
                                </button>
                                
                                {/* 生成过程中的详细进度显示 */}
                                {loading.state && loading.taskType === 'plan' && (
                                    <div className="mt-4 p-4 bg-gradient-to-r from-yellow-50 to-amber-50 rounded-2xl border border-yellow-200">
                                        <div className="flex items-center gap-3 mb-3">
                                            <div className="w-8 h-8 rounded-full border-3 border-yellow-300 border-t-amber-500 animate-spin flex items-center justify-center">
                                                <span className="text-xs font-bold text-amber-600">{loading.progress}%</span>
                                            </div>
                                            <div className="flex-1">
                                                <p className="text-amber-800 font-bold text-sm animate-pulse">{loading.text}</p>
                                                <div className="w-full bg-yellow-200 rounded-full h-2 mt-2">
                                                    <div 
                                                        className="bg-gradient-to-r from-yellow-400 to-amber-500 h-2 rounded-full transition-all duration-300"
                                                        style={{ width: `${loading.progress}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-xs text-amber-700 space-y-1">
                                            <div className="flex items-center gap-2">
                                                <div className="w-2 h-2 bg-amber-400 rounded-full animate-pulse"></div>
                                                <span>正在分析您的生理状态和能量水平...</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="w-2 h-2 bg-amber-400 rounded-full animate-pulse"></div>
                                                <span>结合番茄钟设置优化时间分配...</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <div className="w-2 h-2 bg-amber-400 rounded-full animate-pulse"></div>
                                                <span>生成个性化的一天安排...</span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 测试说明 */}
                            <div className="bg-blue-50 p-4 rounded-2xl border border-blue-200">
                                <h4 className="font-bold text-blue-800 mb-2">测试说明</h4>
                                <ul className="text-sm text-blue-700 space-y-1">
                                    <li>• 点击"生成今日计划"按钮开始测试</li>
                                    <li>• Loading状态会显示在页面中，而不是全屏覆盖</li>
                                    <li>• 按钮会显示进度和状态文字</li>
                                    <li>• 下方会显示详细的进度条和步骤说明</li>
                                    <li>• 整个过程大约5秒钟</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<PlanLoadingTest />);
    </script>
</body>
</html>
