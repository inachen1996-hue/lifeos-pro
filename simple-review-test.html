<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单复盘测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const SimpleReviewTest = () => {
            const [reviewTab, setReviewTab] = useState('progress');
            const [error, setError] = useState(null);

            // 错误边界
            const ErrorBoundary = ({ children }) => {
                try {
                    return children;
                } catch (error) {
                    console.error('渲染错误:', error);
                    setError(error);
                    return (
                        <div className="p-4 bg-red-50 border border-red-200 rounded-lg">
                            <h3 className="text-red-800 font-bold">渲染错误</h3>
                            <p className="text-red-600">{error.message}</p>
                        </div>
                    );
                }
            };

            if (error) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="p-8 bg-red-50 border border-red-200 rounded-lg max-w-md">
                            <h2 className="text-red-800 font-bold text-xl mb-4">页面错误</h2>
                            <p className="text-red-600 mb-4">{error.message}</p>
                            <button 
                                onClick={() => setError(null)}
                                className="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600"
                            >
                                重试
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <ErrorBoundary>
                    <div className="min-h-screen bg-gray-50 p-8">
                        <div className="max-w-4xl mx-auto">
                            <h1 className="text-3xl font-bold mb-8 text-center">简单复盘测试</h1>
                            
                            {/* Tab 切换 */}
                            <div className="bg-white p-1.5 rounded-2xl shadow-sm flex gap-1 border border-slate-100 mb-6">
                                <button 
                                    onClick={() => setReviewTab('progress')} 
                                    className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                        reviewTab === 'progress' 
                                            ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                            : 'text-slate-400 hover:bg-slate-50'
                                    }`}
                                >
                                    当前进度
                                </button>
                                <button 
                                    onClick={() => setReviewTab('review')} 
                                    className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                        reviewTab === 'review' 
                                            ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                            : 'text-slate-400 hover:bg-slate-50'
                                    }`}
                                >
                                    复盘
                                </button>
                                <button 
                                    onClick={() => setReviewTab('habit')} 
                                    className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                        reviewTab === 'habit' 
                                            ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                            : 'text-slate-400 hover:bg-slate-50'
                                    }`}
                                >
                                    习惯打卡
                                </button>
                            </div>

                            {/* 内容区域 */}
                            <div className="bg-white rounded-lg shadow-sm p-6">
                                {reviewTab === 'progress' && (
                                    <div>
                                        <h2 className="text-xl font-bold mb-4">当前进度</h2>
                                        <div className="p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                            <p className="text-blue-700">当前进度页面正常工作</p>
                                            <p className="text-sm text-blue-600 mt-2">这里应该显示 Achievement Jar 或原始进度界面</p>
                                        </div>
                                    </div>
                                )}

                                {reviewTab === 'review' && (
                                    <div>
                                        <h2 className="text-xl font-bold mb-4">复盘</h2>
                                        <div className="p-4 bg-green-50 border border-green-200 rounded-lg">
                                            <p className="text-green-700">复盘页面正常工作</p>
                                            <p className="text-sm text-green-600 mt-2">这里应该显示复盘报告和分析</p>
                                        </div>
                                    </div>
                                )}

                                {reviewTab === 'habit' && (
                                    <div>
                                        <h2 className="text-xl font-bold mb-4">习惯打卡</h2>
                                        <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                                            <p className="text-yellow-700">习惯打卡页面正常工作</p>
                                            <p className="text-sm text-yellow-600 mt-2">这里应该显示习惯打卡功能</p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="mt-8 text-center">
                                <div className="inline-flex gap-4">
                                    <a 
                                        href="/index.html" 
                                        className="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                                    >
                                        测试主应用
                                    </a>
                                    <a 
                                        href="/fix-review-page.html" 
                                        className="px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors"
                                    >
                                        测试修复版本
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </ErrorBoundary>
            );
        };

        ReactDOM.render(<SimpleReviewTest />, document.getElementById('root'));
    </script>
</body>
</html>
