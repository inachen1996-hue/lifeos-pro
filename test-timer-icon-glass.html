<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计时器图标选择功能测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            color: #5D576B; 
        }
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        input, textarea, select { 
            font-size: 16px !important; 
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
            <div style="text-align: center;">
                <div style="width: 60px; height: 60px; border: 4px solid #E2C2FF; border-top-color: #5D576B; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                <p style="color: #5D576B; font-weight: bold;">加载中...</p>
            </div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;

        // 模拟分类数据
        const mockCategories = [
            { id: 'work', name: '工作', color: 'bg-macaron-blue' },
            { id: 'study', name: '学习', color: 'bg-macaron-green' },
            { id: 'health', name: '健康', color: 'bg-macaron-pink' },
            { id: 'life', name: '生活', color: 'bg-macaron-purple' },
            { id: 'entertainment', name: '娱乐', color: 'bg-macaron-orange' }
        ];

        // GlassIcon 组件
        const GlassIcon = ({ icon, categoryId, size = 'medium', isSelected = false, onClick, className = '' }) => {
          const getCategoryGlowColor = (catId) => {
            const category = mockCategories.find(cat => cat.id === catId);
            if (!category) return 'rgba(189, 224, 254, 0.4)';
            
            const colorMap = {
              'bg-macaron-blue': 'rgba(189, 224, 254, 0.4)',
              'bg-macaron-green': 'rgba(217, 239, 232, 0.4)',
              'bg-macaron-pink': 'rgba(245, 194, 214, 0.4)',
              'bg-macaron-purple': 'rgba(200, 162, 224, 0.4)',
              'bg-macaron-orange': 'rgba(255, 233, 214, 0.4)',
              'bg-macaron-yellow': 'rgba(255, 248, 225, 0.4)',
              'bg-emerald-200': 'rgba(167, 243, 208, 0.4)',
              'bg-macaron-rose': 'rgba(255, 229, 229, 0.4)'
            };
            
            return colorMap[category.color] || 'rgba(189, 224, 254, 0.4)';
          };

          const getCategoryThemeColor = (catId) => {
            const category = mockCategories.find(cat => cat.id === catId);
            if (!category) return '#BDE0FE';
            
            const colorMap = {
              'bg-macaron-blue': '#BDE0FE',
              'bg-macaron-green': '#D9EFE8',
              'bg-macaron-pink': '#F5C2D6',
              'bg-macaron-purple': '#C8A2E0',
              'bg-macaron-orange': '#FFE9D6',
              'bg-macaron-yellow': '#FFF8E1',
              'bg-emerald-200': '#A7F3D0',
              'bg-macaron-rose': '#FFE5E5'
            };
            
            return colorMap[category.color] || '#BDE0FE';
          };

          const sizeConfig = {
            small: { container: 'w-8 h-8', text: 'text-sm', shadow: '0 2px 8px -1px' },
            medium: { container: 'w-12 h-12', text: 'text-lg', shadow: '0 4px 12px -2px' },
            large: { container: 'w-16 h-16', text: 'text-2xl', shadow: '0 6px 16px -3px' }
          };

          const config = sizeConfig[size];
          const glowColor = getCategoryGlowColor(categoryId);
          const themeColor = getCategoryThemeColor(categoryId);

          const containerStyle = {
            background: 'rgba(255, 255, 255, 0.85)',
            backdropFilter: 'blur(12px)',
            border: '1px solid rgba(255, 255, 255, 0.9)',
            boxShadow: `${config.shadow} ${glowColor}, inset 0 1px 4px rgba(255, 255, 255, 0.8)`,
            transition: 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)',
            ...(isSelected && {
              boxShadow: `${config.shadow} ${glowColor}, 0 0 0 2px ${themeColor}, inset 0 2px 8px rgba(255, 255, 255, 0.9)`,
              transform: 'scale(1.05)'
            })
          };

          return (
            <div
              className={`
                ${config.container}
                rounded-full
                flex items-center justify-center
                cursor-pointer
                select-none
                relative
                overflow-hidden
                hover:scale-110
                active:scale-95
                ${className}
              `}
              style={containerStyle}
              onClick={onClick}
              role={onClick ? 'button' : undefined}
              tabIndex={onClick ? 0 : undefined}
            >
              <span 
                className={`${config.text} relative z-10 drop-shadow-sm`}
                style={{ 
                  filter: 'drop-shadow(0 1px 2px rgba(255, 255, 255, 0.8))',
                  textShadow: '0 1px 2px rgba(0, 0, 0, 0.1)'
                }}
              >
                {icon}
              </span>
              
              <div 
                className="absolute inset-0 rounded-full bg-gradient-to-br from-white/40 to-transparent pointer-events-none"
                style={{ opacity: isSelected ? 0.8 : 0.6 }}
              />
              
              <div 
                className="absolute inset-0 rounded-full opacity-0 hover:opacity-30 transition-opacity duration-300 pointer-events-none"
                style={{ 
                  background: `radial-gradient(circle, ${glowColor} 0%, transparent 70%)`,
                  filter: 'blur(4px)'
                }}
              />
            </div>
          );
        };

        // IconSelector 组件
        const IconSelector = ({ selectedIcon, categoryId, onIconChange, disabled = false }) => {
          const [isOpen, setIsOpen] = useState(false);
          
          const availableIcons = [
            '💻', '📖', '👟', '🍽️', '🎮', '😴', '🚗', '🎭', '📷', '🧘',
            '📊', '📝', '🏃‍♂️', '👨‍🍳', '🎬', '🛏️', '✈️', '🎸', '📱', '🧠',
            '📈', '✍️', '🚴‍♂️', '🥘', '🎵', '💤', '🚕', '🎹', '📺', '💪',
            '📉', '🖊️', '🏊‍♂️', '🍳', '🎤', '🕯️', '🚙', '🎤', '🎲', '🏋️‍♂️',
            '📋', '📞', '🧘‍♂️', '🥗', '📺', '🛀', '🚌', '🃏', '🎪', '⚽',
            '📧', '💼', '🧘‍♀️', '🍕', '📱', '🧖‍♀️', '🚎', '🎭', '📷', '🏀'
          ];

          const toggleSelector = () => {
            if (disabled) return;
            setIsOpen(!isOpen);
          };

          const handleIconSelect = (icon) => {
            onIconChange(icon);
            setIsOpen(false);
          };

          return (
            <div className="relative">
              <div className="mb-3">
                <label className="text-sm font-black text-[#023E8A] mb-3 block drop-shadow-sm">
                  图标
                </label>
                
                <div 
                  className={`
                    flex items-center justify-center
                    w-full p-4 rounded-[20px] 
                    bg-white/90 
                    cursor-pointer
                    transition-all duration-300
                    ${disabled ? 'opacity-50 cursor-not-allowed' : 'hover:bg-white/95'}
                    ${isOpen ? 'ring-4 ring-[#A2D2FF]/50' : ''}
                  `}
                  style={{
                    boxShadow: '0 4px 12px -2px rgba(162, 210, 255, 0.2), inset 0 1px 4px rgba(255, 255, 255, 0.8)',
                    border: '2px solid rgba(255, 255, 255, 0.9)'
                  }}
                  onClick={toggleSelector}
                  role="button"
                  tabIndex={disabled ? -1 : 0}
                >
                  <GlassIcon
                    icon={selectedIcon}
                    categoryId={categoryId}
                    size="large"
                    className="pointer-events-none"
                  />
                </div>
                
                <div className="mt-2 text-xs text-gray-500 text-center">
                  {disabled ? '已禁用' : '点击选择图标'}
                </div>
              </div>

              {isOpen && !disabled && (
                <div className="absolute top-full left-0 right-0 z-50 mt-2">
                  <div 
                    className="bg-white/95 backdrop-blur-lg rounded-[24px] shadow-2xl border border-white/90 overflow-hidden"
                    style={{
                      boxShadow: '0 12px 32px -4px rgba(162, 210, 255, 0.3), inset 0 2px 8px rgba(255, 255, 255, 0.8)'
                    }}
                  >
                    <div className="p-4 border-b border-gray-100/50">
                      <div className="flex justify-between items-center">
                        <h4 className="font-black text-[#023E8A] text-lg">选择图标</h4>
                        <button
                          onClick={() => setIsOpen(false)}
                          className="p-2 rounded-full bg-gray-100/50 hover:bg-gray-200/50 transition-colors"
                        >
                          ✕
                        </button>
                      </div>
                    </div>

                    <div 
                      className="grid grid-cols-6 gap-3 p-4 max-h-60 overflow-y-auto"
                      style={{ scrollbarWidth: 'thin' }}
                    >
                      {availableIcons.map((icon, index) => (
                        <div key={`${icon}-${index}`} className="flex justify-center">
                          <GlassIcon
                            icon={icon}
                            categoryId={categoryId}
                            size="medium"
                            isSelected={selectedIcon === icon}
                            onClick={() => handleIconSelect(icon)}
                            className="transition-all duration-200"
                          />
                        </div>
                      ))}
                    </div>

                    <div className="p-3 border-t border-gray-100/50 text-center">
                      <div className="text-xs text-gray-500">
                        点击选择图标
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {isOpen && (
                <div 
                  className="fixed inset-0 z-40 bg-black/10 backdrop-blur-sm"
                  onClick={() => setIsOpen(false)}
                />
              )}
            </div>
          );
        };

        // 主测试组件
        const TestApp = () => {
          const [selectedIcon, setSelectedIcon] = useState('💻');
          const [categoryId, setCategoryId] = useState('work');
          const [name, setName] = useState('');
          const [iconSource, setIconSource] = useState('default');
          const [userHasManuallySelected, setUserHasManuallySelected] = useState(false);

          // 智能匹配关键词映射
          const keywordMappings = {
            '看书': '📖', '阅读': '📖', '读书': '📖', '学习': '📖', '书': '📖',
            '写作': '✍️', '写字': '✍️', '笔记': '✍️',
            '考试': '📝', '测试': '📝',
            '代码': '💻', '编程': '💻', '开发': '💻', '写代码': '💻',
            '会议': '👥', '开会': '👥',
            '设计': '🎭',
            '跑步': '👟', '运动': '👟', '健身': '👟', '锻炼': '👟',
            '瑜伽': '🧘',
            '游泳': '🏊‍♂️',
            '做饭': '👨‍🍳', '烹饪': '👨‍🍳', '料理': '👨‍🍳',
            '吃饭': '🍽️', '用餐': '🍽️',
            '游戏': '🎮', '玩游戏': '🎮',
            '电影': '🎬', '看电影': '🎬',
            '音乐': '🎵', '听音乐': '🎵',
            '睡觉': '😴', '休息': '😴', '小憩': '😴',
            '冥想': '🧘‍♀️', '放松': '🧘‍♀️',
            '开车': '🚗', '驾驶': '🚗',
            '旅行': '✈️', '旅游': '✈️',
            '画画': '🎭', '绘画': '🎭',
            '摄影': '📷'
          };

          // 智能匹配函数
          const smartMatchIcon = (input) => {
            if (!input || userHasManuallySelected) return null;
            
            const normalizedInput = input.toLowerCase().trim();
            
            for (const [keyword, icon] of Object.entries(keywordMappings)) {
              if (normalizedInput.includes(keyword.toLowerCase())) {
                return icon;
              }
            }
            
            return null;
          };

          // 处理名称输入变化
          const handleNameChange = (newName) => {
            setName(newName);
            
            if (!userHasManuallySelected) {
              const matchedIcon = smartMatchIcon(newName);
              if (matchedIcon && matchedIcon !== selectedIcon) {
                setSelectedIcon(matchedIcon);
                setIconSource('smart');
              }
            }
          };

          // 处理图标手动选择
          const handleIconChange = (icon) => {
            setSelectedIcon(icon);
            setIconSource('manual');
            setUserHasManuallySelected(true);
          };

          return (
            <div className="min-h-screen p-8">
              <div className="max-w-2xl mx-auto">
                <h1 className="text-3xl font-black text-[#023E8A] mb-8 text-center">
                  计时器图标选择功能测试
                </h1>

                <div className="bg-white/90 p-8 rounded-[32px] shadow-2xl mb-8"
                     style={{
                       boxShadow: '0 12px 32px -4px rgba(162, 210, 255, 0.3), inset 0 2px 8px rgba(255, 255, 255, 0.8)',
                       border: '2px solid rgba(255, 255, 255, 0.9)'
                     }}>
                  
                  <h2 className="text-xl font-black text-[#023E8A] mb-6">创建计时器</h2>

                  {/* 名称输入 */}
                  <div className="mb-6">
                    <label className="text-sm font-black text-[#023E8A] mb-3 block">
                      名称
                      {iconSource === 'smart' && (
                        <span className="ml-2 text-xs text-green-600">(智能匹配)</span>
                      )}
                      {iconSource === 'manual' && (
                        <span className="ml-2 text-xs text-blue-600">(手动选择)</span>
                      )}
                    </label>
                    <input
                      type="text"
                      value={name}
                      onChange={(e) => handleNameChange(e.target.value)}
                      className="w-full bg-white/90 p-4 rounded-[20px] outline-none focus:ring-4 ring-[#A2D2FF]/50 font-medium text-[#023E8A] transition-all duration-300"
                      style={{
                        boxShadow: '0 4px 12px -2px rgba(162, 210, 255, 0.2), inset 0 1px 4px rgba(255, 255, 255, 0.8)',
                        border: '2px solid rgba(255, 255, 255, 0.9)'
                      }}
                      placeholder="试试输入：看书、跑步、代码、做饭..."
                    />
                  </div>

                  {/* 分类选择 */}
                  <div className="mb-6">
                    <label className="text-sm font-black text-[#023E8A] mb-3 block">分类</label>
                    <select
                      value={categoryId}
                      onChange={(e) => setCategoryId(e.target.value)}
                      className="w-full bg-white/90 p-4 rounded-[20px] outline-none focus:ring-4 ring-[#A2D2FF]/50 font-bold text-[#023E8A] transition-all duration-300"
                      style={{
                        boxShadow: '0 4px 12px -2px rgba(162, 210, 255, 0.2), inset 0 1px 4px rgba(255, 255, 255, 0.8)',
                        border: '2px solid rgba(255, 255, 255, 0.9)'
                      }}
                    >
                      {mockCategories.map(cat => (
                        <option key={cat.id} value={cat.id}>{cat.name}</option>
                      ))}
                    </select>
                  </div>

                  {/* 图标选择器 */}
                  <IconSelector
                    selectedIcon={selectedIcon}
                    categoryId={categoryId}
                    onIconChange={handleIconChange}
                  />
                </div>

                {/* 预览区域 */}
                <div className="bg-white/90 p-6 rounded-[24px] shadow-lg"
                     style={{
                       boxShadow: '0 8px 24px -4px rgba(162, 210, 255, 0.2), inset 0 2px 8px rgba(255, 255, 255, 0.8)',
                       border: '2px solid rgba(255, 255, 255, 0.9)'
                     }}>
                  <h3 className="text-lg font-black text-[#023E8A] mb-4">预览效果</h3>
                  
                  <div className="flex items-center gap-4 p-4 bg-gradient-to-r from-white/50 to-gray-50/50 rounded-[16px]">
                    <GlassIcon
                      icon={selectedIcon}
                      categoryId={categoryId}
                      size="large"
                    />
                    <div>
                      <div className="font-black text-[#023E8A] text-lg">{name || '计时器名称'}</div>
                      <div className="text-sm text-gray-500">
                        分类: {mockCategories.find(c => c.id === categoryId)?.name}
                      </div>
                      <div className="text-xs text-gray-400">
                        图标来源: {iconSource === 'smart' ? '智能匹配' : iconSource === 'manual' ? '手动选择' : '默认'}
                      </div>
                    </div>
                  </div>
                </div>

                {/* 说明 */}
                <div className="mt-8 text-center text-sm text-gray-600">
                  <p className="mb-2">🎯 <strong>智能匹配测试</strong>：在名称框中输入关键词（如"看书"、"跑步"、"代码"）</p>
                  <p className="mb-2">🎨 <strong>玻璃效果测试</strong>：切换不同分类查看光效颜色变化</p>
                  <p>✋ <strong>手动选择测试</strong>：点击图标选择器手动选择图标</p>
                </div>
              </div>
            </div>
          );
        };

        // 渲染应用
        const root = createRoot(document.getElementById('root'));
        root.render(<TestApp />);
    </script>
</body>
</html>
