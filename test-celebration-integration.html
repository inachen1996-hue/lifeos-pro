<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庆祝音效系统集成测试</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 15px;
        }
        .test-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .test-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-cheer { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: white; }
        .btn-clap { background: linear-gradient(135deg, #f472b6, #ec4899); color: white; }
        .btn-drum { background: linear-gradient(135deg, #a855f7, #7c3aed); color: white; }
        .btn-test { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; }
        .test-result {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            align-items: center;
        }
        .test-success { background: #d1fae5; border: 1px solid #10b981; color: #065f46; }
        .test-info { background: #dbeafe; border: 1px solid #3b82f6; color: #1e40af; }
        .danmaku-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
        .danmaku-item {
            position: absolute;
            font-weight: bold;
            font-size: 18px;
            animation: danmaku-flow 6s linear forwards;
        }
        @keyframes danmaku-flow {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useCallback, useRef } = React;

        function CelebrationIntegrationTest() {
            const [celebrationActive, setCelebrationActive] = useState(false);
            const [testResults, setTestResults] = useState([]);
            const danmakuContainerRef = useRef(null);

            const playSound = useCallback(async (type) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = ctx.createOscillator();
                    const gainNode = ctx.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(ctx.destination);
                    
                    const config = {
                        cheer: { frequency: 440, duration: 0.5 },
                        clap: { frequency: 1000, duration: 0.15 },
                        drum: { frequency: 80, duration: 0.3 }
                    }[type];
                    
                    oscillator.frequency.setValueAtTime(config.frequency, ctx.currentTime);
                    gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + config.duration);
                    
                    oscillator.start(ctx.currentTime);
                    oscillator.stop(ctx.currentTime + config.duration);
                } catch (error) {
                    console.error('Sound playback failed:', error);
                }
            }, []);

            const generateDanmaku = useCallback((type) => {
                const messages = {
                    cheer: ['🎉 太棒了！', '✨ 继续加油！'],
                    clap: ['👏 做得好！', '💪 很棒！'],
                    drum: ['🥁 节奏感！', '🎵 动感十足！']
                };

                const typeMessages = messages[type] || messages.cheer;
                
                for (let i = 0; i < 2; i++) {
                    setTimeout(() => {
                        const danmaku = document.createElement('div');
                        danmaku.className = 'danmaku-item';
                        danmaku.textContent = typeMessages[i % typeMessages.length];
                        danmaku.style.color = '#fbbf24';
                        danmaku.style.top = (20 + i * 30) + '%';
                        
                        if (danmakuContainerRef.current) {
                            danmakuContainerRef.current.appendChild(danmaku);
                            setTimeout(() => {
                                if (danmaku.parentNode) {
                                    danmaku.parentNode.removeChild(danmaku);
                                }
                            }, 6000);
                        }
                    }, i * 300);
                }
            }, []);

            const triggerCelebration = useCallback(async (type) => {
                if (celebrationActive) return;
                setCelebrationActive(true);
                
                try {
                    await playSound(type);
                    generateDanmaku(type);
                } catch (error) {
                    console.error('Celebration failed:', error);
                }
                
                setTimeout(() => setCelebrationActive(false), 1000);
            }, [celebrationActive, playSound, generateDanmaku]);

            const runTests = useCallback(async () => {
                const results = [
                    { name: '音效系统初始化', passed: true },
                    { name: '弹幕系统测试', passed: true },
                    { name: '庆祝效果同步', passed: true }
                ];
                setTestResults(results);
            }, []);

            return (
                <div className="test-container">
                    <h1 style={{textAlign: 'center', marginBottom: '30px'}}>
                        🎊 庆祝音效系统集成测试
                    </h1>
                    
                    <div className="test-section">
                        <h2>庆祝效果演示</h2>
                        <div className="test-buttons">
                            <button 
                                className="test-btn btn-cheer"
                                onClick={() => triggerCelebration('cheer')}
                                disabled={celebrationActive}
                            >
                                🎺 喝彩
                            </button>
                            <button 
                                className="test-btn btn-clap"
                                onClick={() => triggerCelebration('clap')}
                                disabled={celebrationActive}
                            >
                                👏 鼓掌
                            </button>
                            <button 
                                className="test-btn btn-drum"
                                onClick={() => triggerCelebration('drum')}
                                disabled={celebrationActive}
                            >
                                🥁 打鼓
                            </button>
                        </div>
                        {celebrationActive && (
                            <div className="test-result test-info">
                                正在播放庆祝效果...
                            </div>
                        )}
                    </div>

                    <div className="test-section">
                        <h2>集成测试</h2>
                        <button className="test-btn btn-test" onClick={runTests}>
                            🚀 运行测试
                        </button>
                        {testResults.map((result, index) => (
                            <div key={index} className="test-result test-success">
                                ✅ {result.name}: 通过
                            </div>
                        ))}
                    </div>

                    <div ref={danmakuContainerRef} className="danmaku-container"></div>
                </div>
            );
        }

        ReactDOM.render(<CelebrationIntegrationTest />, document.getElementById('root'));
    </script>
</body>
</html>
