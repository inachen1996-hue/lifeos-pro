<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 简单测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f0f2f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .input-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        .success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            color: #0c5460;
        }
        .step {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-left: 4px solid #007bff;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 DeepSeek API 简单测试</h1>
        <p>这个页面会直接测试DeepSeek API连接</p>
        
        <div class="input-group">
            <label for="apiKey">DeepSeek API Key:</label>
            <input 
                type="password" 
                id="apiKey" 
                placeholder="输入你的 DeepSeek API Key (sk-...)"
                value=""
            />
        </div>
        
        <button onclick="testDeepSeek()" id="testBtn">🚀 开始测试</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testDeepSeek() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const resultDiv = document.getElementById('result');
            const testBtn = document.getElementById('testBtn');
            
            // 验证输入
            if (!apiKey) {
                showResult('error', '❌ 请输入 API Key');
                return;
            }
            
            if (!apiKey.startsWith('sk-')) {
                showResult('error', '❌ API Key 格式错误\n正确格式应该以 "sk-" 开头');
                return;
            }
            
            // 开始测试
            testBtn.disabled = true;
            testBtn.textContent = '⏳ 测试中...';
            
            showResult('info', '🔍 开始测试 DeepSeek API...\n\n步骤1: 检查代理服务器连接\n步骤2: 发送测试请求\n步骤3: 验证响应');
            
            try {
                // 测试代理服务器连接
                console.log('🔗 测试代理服务器连接...');
                
                const testData = {
                    apiKey: apiKey,
                    model: 'deepseek-chat',
                    messages: [
                        { 
                            role: 'system', 
                            content: 'You are a helpful assistant. Please respond in Chinese.' 
                        },
                        { 
                            role: 'user', 
                            content: '请简单回复"测试成功"，不要说其他内容。' 
                        }
                    ]
                };
                
                console.log('📤 发送请求到代理服务器:', testData);
                
                const response = await fetch('http://localhost:3000', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                
                console.log('📥 收到响应:', response.status, response.statusText);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('❌ API 错误:', errorData);
                    
                    let errorMsg = `❌ DeepSeek API 测试失败\n\n`;
                    errorMsg += `状态码: ${response.status} ${response.statusText}\n\n`;
                    
                    if (errorData.error) {
                        if (typeof errorData.error === 'string') {
                            errorMsg += `错误信息: ${errorData.error}\n\n`;
                        } else if (errorData.error.message) {
                            errorMsg += `错误信息: ${errorData.error.message}\n\n`;
                        }
                    }
                    
                    if (response.status === 401) {
                        errorMsg += `💡 解决方案：\n`;
                        errorMsg += `1. 检查 API Key 是否正确\n`;
                        errorMsg += `2. 访问 https://platform.deepseek.com/api_keys 确认状态\n`;
                        errorMsg += `3. 确认账户已充值（至少1元）\n`;
                        errorMsg += `4. 检查 API Key 是否有效期内`;
                    } else if (response.status === 429) {
                        errorMsg += `💡 解决方案：\n请求过于频繁，等待几分钟后重试`;
                    } else if (response.status === 500) {
                        errorMsg += `💡 解决方案：\n服务器内部错误，请稍后重试`;
                    }
                    
                    showResult('error', errorMsg);
                    return;
                }
                
                const data = await response.json();
                console.log('✅ 解析响应数据:', data);
                
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    showResult('error', '❌ DeepSeek API 返回数据格式异常\n\n响应数据:\n' + JSON.stringify(data, null, 2));
                    return;
                }
                
                // 测试成功
                let successMsg = `🎉 DeepSeek API 测试成功！\n\n`;
                successMsg += `✅ 代理服务器连接正常\n`;
                successMsg += `✅ API Key 验证通过\n`;
                successMsg += `✅ AI 响应正常\n\n`;
                successMsg += `📨 AI 回复: ${data.choices[0].message.content}\n\n`;
                successMsg += `📊 使用统计:\n`;
                successMsg += `   模型: ${data.model || 'deepseek-chat'}\n`;
                successMsg += `   输入 tokens: ${data.usage?.prompt_tokens || 'N/A'}\n`;
                successMsg += `   输出 tokens: ${data.usage?.completion_tokens || 'N/A'}\n`;
                successMsg += `   总计 tokens: ${data.usage?.total_tokens || 'N/A'}\n\n`;
                successMsg += `🎯 现在可以在主应用中正常使用 DeepSeek AI 了！`;
                
                showResult('success', successMsg);
                
            } catch (error) {
                console.error('💥 请求异常:', error);
                
                let errorMsg = `❌ 连接失败\n\n`;
                errorMsg += `错误类型: ${error.name}\n`;
                errorMsg += `错误信息: ${error.message}\n\n`;
                errorMsg += `💡 可能的原因：\n`;
                errorMsg += `1. DeepSeek代理服务器未启动（端口 3000）\n`;
                errorMsg += `2. 网络连接问题\n`;
                errorMsg += `3. 防火墙阻止连接\n`;
                errorMsg += `4. 浏览器安全策略限制\n\n`;
                errorMsg += `🔧 解决方案：\n`;
                errorMsg += `1. 运行: ./check-deepseek-status.sh\n`;
                errorMsg += `2. 重启服务: ./start-deepseek-daemon.sh\n`;
                errorMsg += `3. 检查浏览器控制台错误信息`;
                
                showResult('error', errorMsg);
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '🚀 开始测试';
            }
        }
        
        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = type;
            resultDiv.textContent = message;
        }
        
        // 页面加载时的检查
        window.addEventListener('load', function() {
            console.log('🔍 页面加载完成，检查环境...');
            console.log('📍 当前页面:', window.location.href);
            console.log('🌐 代理服务器地址: http://localhost:3000');
            
            // 显示环境信息
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'info';
            resultDiv.textContent = `📋 环境检查:\n✅ 页面加载完成\n✅ JavaScript 运行正常\n🔗 代理服务器: http://localhost:3000\n\n请输入 DeepSeek API Key 开始测试`;
        });
    </script>
</body>
</html>
