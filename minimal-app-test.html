<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最小化应用测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 最小化的 ProgressTabContent 组件
        const ProgressTabContent = ({ 
            fullHistory = '', 
            progressScope = 'today', 
            setProgressScope = () => {}, 
            customSounds = {}, 
            danmakus = [], 
            setDanmakus = () => {}, 
            playSound = () => {}, 
            CATEGORIES = [] 
        }) => {
            const [enableAchievementJar, setEnableAchievementJar] = useState(false);

            const toggleAchievementJar = (enabled) => {
                setEnableAchievementJar(enabled);
            };

            return (
                <div className="p-4 bg-blue-50 border border-blue-200 rounded-lg">
                    <h3 className="text-blue-800 font-bold">ProgressTabContent 测试</h3>
                    <p className="text-blue-600">当前范围: {progressScope}</p>
                    <button 
                        onClick={() => toggleAchievementJar(!enableAchievementJar)}
                        className="mt-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                    >
                        切换模式: {enableAchievementJar ? 'Achievement Jar' : '原始界面'}
                    </button>
                </div>
            );
        };

        // 最小化的复盘页面
        const MinimalReviewPage = () => {
            const [reviewTab, setReviewTab] = useState('progress');
            const [progressScope, setProgressScope] = useState('today');

            return (
                <div className="space-y-6 p-4">
                    {/* Tab 切换 */}
                    <div className="bg-white p-1.5 rounded-2xl shadow-sm flex gap-1 border border-slate-100">
                        <button 
                            onClick={() => setReviewTab('progress')} 
                            className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                reviewTab === 'progress' 
                                    ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                    : 'text-slate-400 hover:bg-slate-50'
                            }`}
                        >
                            当前进度
                        </button>
                        <button 
                            onClick={() => setReviewTab('review')} 
                            className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                reviewTab === 'review' 
                                    ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                    : 'text-slate-400 hover:bg-slate-50'
                            }`}
                        >
                            复盘
                        </button>
                        <button 
                            onClick={() => setReviewTab('habit')} 
                            className={`flex-1 py-3 rounded-xl text-xs font-bold transition-all ${
                                reviewTab === 'habit' 
                                    ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-200' 
                                    : 'text-slate-400 hover:bg-slate-50'
                            }`}
                        >
                            习惯打卡
                        </button>
                    </div>

                    {/* 内容区域 */}
                    {reviewTab === 'progress' && (
                        <ProgressTabContent 
                            fullHistory=""
                            progressScope={progressScope}
                            setProgressScope={setProgressScope}
                            customSounds={{}}
                            danmakus={[]}
                            setDanmakus={() => {}}
                            playSound={() => {}}
                            CATEGORIES={[]}
                        />
                    )}

                    {reviewTab === 'review' && (
                        <div className="p-4 bg-green-50 border border-green-200 rounded-lg">
                            <h3 className="text-green-800 font-bold">复盘页面</h3>
                            <p className="text-green-600">复盘功能正常</p>
                        </div>
                    )}

                    {reviewTab === 'habit' && (
                        <div className="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                            <h3 className="text-yellow-800 font-bold">习惯打卡</h3>
                            <p className="text-yellow-600">习惯打卡功能正常</p>
                        </div>
                    )}
                </div>
            );
        };

        // 主应用
        const MinimalApp = () => {
            const [status, setStatus] = useState('loading');

            React.useEffect(() => {
                // 模拟加载过程
                setTimeout(() => {
                    setStatus('ready');
                }, 1000);
            }, []);

            if (status === 'loading') {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="w-16 h-16 border-4 border-blue-200 border-t-blue-500 rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-gray-600">最小化应用加载中...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="container mx-auto py-8">
                        <h1 className="text-3xl font-bold mb-8 text-center">最小化应用测试</h1>
                        <div className="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                            <h2 className="text-green-800 font-bold">✅ 应用加载成功</h2>
                            <p className="text-green-600">ProgressTabContent 组件工作正常</p>
                        </div>
                        <MinimalReviewPage />
                    </div>
                </div>
            );
        };

        // 渲染应用
        ReactDOM.render(<MinimalApp />, document.getElementById('root'));
    </script>
</body>
</html>
