<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS 修复测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success { background: rgba(76, 175, 80, 0.3); border-left: 4px solid #4CAF50; }
        .error { background: rgba(244, 67, 54, 0.3); border-left: 4px solid #f44336; }
        .warning { background: rgba(255, 193, 7, 0.3); border-left: 4px solid #FFC107; }
        .info { background: rgba(33, 150, 243, 0.3); border-left: 4px solid #2196F3; }
        .test-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .code-block {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            overflow-x: auto;
            margin: 10px 0;
        }
        #log {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 CORS 问题修复测试</h1>
        
        <div class="status info">
            <strong>当前协议:</strong> <span id="protocol"></span><br>
            <strong>当前地址:</strong> <span id="currentUrl"></span>
        </div>

        <div id="corsStatus" class="status warning">
            <strong>⏳ 正在检测 CORS 状态...</strong>
        </div>

        <h2>🧪 测试步骤</h2>
        
        <div class="test-button" onclick="testModuleLoading()">测试模块加载</div>
        <div class="test-button" onclick="testMainApp()">打开主应用</div>
        <div class="test-button" onclick="clearLog()">清空日志</div>
        
        <h2>📋 实时日志</h2>
        <div id="log"></div>

        <h2>💡 解决方案</h2>
        
        <div class="status warning">
            <strong>如果看到 CORS 错误:</strong>
            <ol>
                <li>确保通过 <code>http://localhost:8000</code> 访问</li>
                <li>不要直接双击 HTML 文件（会使用 file:// 协议）</li>
                <li>确保本地服务器正在运行</li>
            </ol>
        </div>

        <div class="code-block">
# 启动本地服务器
./start-local-server.sh

# 或手动启动
python3 -m http.server 8000

# 然后访问
http://localhost:8000
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            logElement.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(`${prefix} ${message}`);
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
        }

        function updateStatus() {
            const protocol = window.location.protocol;
            const url = window.location.href;
            
            document.getElementById('protocol').textContent = protocol;
            document.getElementById('currentUrl').textContent = url;
            
            const corsStatus = document.getElementById('corsStatus');
            
            if (protocol === 'file:') {
                corsStatus.className = 'status error';
                corsStatus.innerHTML = '<strong>❌ CORS 问题:</strong> 正在使用 file:// 协议，模块无法加载';
                log('检测到 file:// 协议，这会导致 CORS 问题', 'error');
            } else if (protocol === 'http:' || protocol === 'https:') {
                corsStatus.className = 'status success';
                corsStatus.innerHTML = '<strong>✅ CORS 正常:</strong> 正在使用 HTTP 协议，模块可以正常加载';
                log('检测到 HTTP 协议，CORS 应该正常工作', 'success');
            } else {
                corsStatus.className = 'status warning';
                corsStatus.innerHTML = '<strong>⚠️ 未知协议:</strong> ' + protocol;
                log('检测到未知协议: ' + protocol, 'warning');
            }
        }

        async function testModuleLoading() {
            log('开始测试模块加载...');
            
            try {
                // 测试加载一个简单的模块
                const response = await fetch('./dist/storage.js');
                if (response.ok) {
                    log('✅ 模块文件可以访问', 'success');
                    
                    // 尝试动态导入
                    try {
                        const module = await import('./dist/storage.js');
                        log('✅ 模块导入成功', 'success');
                        log('模块导出: ' + Object.keys(module).join(', '));
                    } catch (importError) {
                        log('❌ 模块导入失败: ' + importError.message, 'error');
                    }
                } else {
                    log('❌ 模块文件无法访问: ' + response.status, 'error');
                }
            } catch (fetchError) {
                log('❌ 网络请求失败: ' + fetchError.message, 'error');
            }
        }

        function testMainApp() {
            log('正在打开主应用...');
            const url = window.location.origin + '/index.html';
            window.open(url, '_blank');
            log('主应用已在新窗口打开: ' + url);
        }

        // 页面加载时自动检测
        window.addEventListener('load', () => {
            updateStatus();
            log('页面加载完成，开始检测环境');
            
            // 自动测试模块加载
            setTimeout(() => {
                testModuleLoading();
            }, 1000);
        });

        // 监听错误
        window.addEventListener('error', (event) => {
            log('页面错误: ' + event.message, 'error');
        });

        window.addEventListener('unhandledrejection', (event) => {
            log('未处理的 Promise 错误: ' + event.reason, 'error');
        });
    </script>
</body>
</html>
