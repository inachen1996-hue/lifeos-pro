<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单 React 测试</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
        .result { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔍 React 快速检测</h1>
    
    <div id="results">
        <div class="result info">正在检测...</div>
    </div>

    <div style="margin-top: 20px;">
        <button onclick="testLocalVersion()">测试本地版本</button>
        <button onclick="location.reload()">重新检测</button>
    </div>

    <!-- 尝试加载 React -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <script>
        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            resultsDiv.appendChild(div);
        }

        function testLocalVersion() {
            window.open('index-local-react.html', '_blank');
        }

        // 立即检测（不等待）
        setTimeout(() => {
            const results = document.getElementById('results');
            results.innerHTML = '';

            // 检查 React
            if (typeof React !== 'undefined') {
                addResult('✅ React 库已加载', 'success');
            } else {
                addResult('❌ React 库未加载 - CDN 访问问题', 'error');
            }

            // 检查 ReactDOM
            if (typeof ReactDOM !== 'undefined') {
                addResult('✅ ReactDOM 库已加载', 'success');
            } else {
                addResult('❌ ReactDOM 库未加载', 'error');
            }

            // 网络测试
            addResult('🌐 正在测试网络连接...', 'info');
            
            fetch('https://unpkg.com/react@18.2.0/package.json')
                .then(response => {
                    if (response.ok) {
                        addResult('✅ CDN 网络连接正常', 'success');
                        addResult('💡 建议：刷新页面或清除浏览器缓存', 'info');
                    } else {
                        addResult('⚠️ CDN 响应异常', 'error');
                    }
                })
                .catch(error => {
                    addResult('❌ 无法访问 unpkg.com CDN', 'error');
                    addResult('💡 解决方案：使用本地版本或切换网络', 'info');
                });

            // 总结
            if (typeof React === 'undefined') {
                addResult('<strong>🎯 结论：React 加载失败，建议使用本地版本测试</strong>', 'error');
            } else {
                addResult('<strong>🎉 结论：React 环境正常</strong>', 'success');
            }
        }, 500);
    </script>
</body>
</html>
