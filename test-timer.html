<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4">Timer Backend Test</h1>
        <div id="status" class="mb-4 p-4 bg-blue-50 rounded">
            <p class="text-sm text-gray-600">Loading...</p>
        </div>
        <div id="categories" class="space-y-2"></div>
    </div>

    <script type="module">
        // 测试后端模块导入
        import { CategoryStorage } from './dist/storage.js';
        import { DEFAULT_CATEGORIES } from './dist/types.js';

        const statusEl = document.getElementById('status');
        const categoriesEl = document.getElementById('categories');

        try {
            // 加载分类
            const categories = CategoryStorage.loadCategories();
            
            statusEl.innerHTML = `
                <p class="text-green-600 font-bold">✅ Backend loaded successfully!</p>
                <p class="text-sm text-gray-600 mt-2">Found ${categories.length} categories</p>
            `;

            // 显示分类
            categories.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'p-3 bg-gray-50 rounded flex items-center gap-3';
                div.innerHTML = `
                    <div class="w-10 h-10 ${cat.color} rounded-lg flex items-center justify-center">
                        <span class="text-2xl">${cat.icon === 'Briefcase' ? '💼' : '📚'}</span>
                    </div>
                    <div>
                        <div class="font-bold">${cat.name}</div>
                        <div class="text-xs text-gray-500">${cat.id}</div>
                    </div>
                `;
                categoriesEl.appendChild(div);
            });

        } catch (error) {
            statusEl.innerHTML = `
                <p class="text-red-600 font-bold">❌ Error loading backend</p>
                <p class="text-sm text-gray-600 mt-2">${error.message}</p>
            `;
            console.error('Backend load error:', error);
        }
    </script>
</body>
</html>
