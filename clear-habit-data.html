<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>清除习惯数据</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .success { color: green; }
        .error { color: red; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>习惯打卡数据管理</h1>
    
    <div>
        <h2>当前数据</h2>
        <div id="current-data"></div>
    </div>
    
    <div>
        <h2>操作</h2>
        <button onclick="viewData()">查看数据</button>
        <button onclick="clearData()" style="background: #ff4444; color: white;">清除习惯数据</button>
        <button onclick="initData()" style="background: #44ff44;">初始化测试数据</button>
    </div>
    
    <div id="result"></div>
    
    <script>
        function viewData() {
            const habits = localStorage.getItem('lifeos_pro_habits');
            const result = document.getElementById('result');
            
            if (!habits) {
                result.innerHTML = '<p class="error">没有习惯数据</p>';
                return;
            }
            
            try {
                const parsed = JSON.parse(habits);
                result.innerHTML = '<p class="success">✅ 数据格式正确</p><pre>' + JSON.stringify(parsed, null, 2) + '</pre>';
            } catch (e) {
                result.innerHTML = '<p class="error">❌ 数据格式错误: ' + e.message + '</p><pre>' + habits + '</pre>';
            }
        }
        
        function clearData() {
            if (confirm('确定要清除所有习惯数据吗？')) {
                localStorage.removeItem('lifeos_pro_habits');
                document.getElementById('result').innerHTML = '<p class="success">✅ 习惯数据已清除</p>';
                viewData();
            }
        }
        
        function initData() {
            const testHabits = [
                {
                    id: Date.now().toString(),
                    name: '测试习惯',
                    eventKeywords: ['测试', 'test'],
                    frequency: {
                        type: 'daily',
                        target: 1
                    },
                    color: 'pink',
                    createdAt: new Date().toISOString()
                }
            ];
            
            localStorage.setItem('lifeos_pro_habits', JSON.stringify(testHabits));
            document.getElementById('result').innerHTML = '<p class="success">✅ 测试数据已初始化</p>';
            viewData();
        }
        
        // 页面加载时显示当前数据
        window.onload = viewData;
    </script>
</body>
</html>
