<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 一键连接测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-center">API 一键连接测试</h1>
        
        <div class="space-y-4">
            <button id="testDeepSeek" class="w-full py-3 bg-blue-500 text-white rounded-lg font-bold hover:bg-blue-600 transition-all">
                测试 DeepSeek API
            </button>
            
            <button id="testGemini" class="w-full py-3 bg-green-500 text-white rounded-lg font-bold hover:bg-green-600 transition-all">
                测试 Gemini API
            </button>
            
            <div id="result" class="mt-6 p-4 bg-gray-50 rounded-lg min-h-[100px]">
                <p class="text-gray-500">点击按钮测试 API 连接...</p>
            </div>
        </div>
    </div>

    <script>
        // 预设的 API 密钥
        const API_KEYS = {
            deepseek: 'sk-d1fdb210d0424ffdbad83f1ebe4e283b',
            gemini: 'AIzaSyAs95vJEeL-CkfTdvxeKgZsViKJtjAppBE'
        };

        const resultDiv = document.getElementById('result');

        function showResult(message, isSuccess = true) {
            resultDiv.innerHTML = `
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full ${isSuccess ? 'bg-green-500' : 'bg-red-500'}"></div>
                    <span class="${isSuccess ? 'text-green-700' : 'text-red-700'} font-medium">${message}</span>
                </div>
            `;
        }

        // 测试 DeepSeek API
        document.getElementById('testDeepSeek').addEventListener('click', async () => {
            showResult('正在测试 DeepSeek API...', true);
            
            try {
                const response = await fetch('/api/deepseek', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        apiKey: API_KEYS.deepseek,
                        messages: [
                            {
                                role: 'user',
                                content: '请用JSON格式回复：{"status": "success", "message": "DeepSeek连接成功", "timestamp": "' + new Date().toISOString() + '"}'
                            }
                        ],
                        model: 'deepseek-chat'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('DeepSeek 响应:', data);
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    showResult(`✅ DeepSeek API 连接成功！响应: ${data.choices[0].message.content}`, true);
                } else {
                    showResult('❌ DeepSeek API 响应格式异常', false);
                }
                
            } catch (error) {
                console.error('DeepSeek 测试失败:', error);
                showResult(`❌ DeepSeek API 连接失败: ${error.message}`, false);
            }
        });

        // 测试 Gemini API
        document.getElementById('testGemini').addEventListener('click', async () => {
            showResult('正在测试 Gemini API...', true);
            
            try {
                // 动态加载 Google AI SDK
                if (!window.GoogleGenerativeAI) {
                    const script = document.createElement('script');
                    script.src = 'https://esm.run/@google/generative-ai';
                    script.type = 'module';
                    document.head.appendChild(script);
                    
                    // 等待加载
                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = reject;
                        setTimeout(reject, 5000); // 5秒超时
                    });
                }

                // 使用 fetch 直接调用 Gemini API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${API_KEYS.gemini}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: '请用JSON格式回复：{"status": "success", "message": "Gemini连接成功", "timestamp": "' + new Date().toISOString() + '"}'
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Gemini 响应:', data);
                
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    const content = data.candidates[0].content.parts[0].text;
                    showResult(`✅ Gemini API 连接成功！响应: ${content}`, true);
                } else {
                    showResult('❌ Gemini API 响应格式异常', false);
                }
                
            } catch (error) {
                console.error('Gemini 测试失败:', error);
                showResult(`❌ Gemini API 连接失败: ${error.message}`, false);
            }
        });
    </script>
</body>
</html>
