<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 日期范围修复测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #FDFCFB 0%, #F9F7F5 100%); 
            color: #5D576B; 
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">📅 日期范围修复测试</h1>
        
        <div class="bg-white rounded-3xl p-6 shadow-lg mb-8">
            <h2 class="text-2xl font-semibold mb-4 text-center text-blue-600">修复说明</h2>
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
                <h3 class="font-bold text-blue-800 mb-2">问题:</h3>
                <p class="text-blue-700 text-sm">
                    原来的日期范围逻辑有问题：<br>
                    - 'today' 范围的 currentStart 和 currentEnd 都是今天 00:00:00<br>
                    - 过滤条件 d >= s && d <= e 只匹配完全相同的时间点<br>
                    - 导致今天的数据无法被正确过滤
                </p>
            </div>
            
            <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                <h3 class="font-bold text-green-800 mb-2">修复:</h3>
                <p class="text-green-700 text-sm">
                    - 'today' 范围：currentStart = 今天 00:00:00, currentEnd = 明天 00:00:00<br>
                    - 过滤条件改为 d >= s && d < e (不包含结束日期)<br>
                    - 这样可以正确包含整个今天的数据
                </p>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-lg mb-8">
            <h2 class="text-2xl font-semibent mb-4 text-center text-green-600">测试结果</h2>
            
            <button id="test-date-ranges" class="w-full px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 mb-4">
                🧪 测试日期范围逻辑
            </button>

            <div id="test-results" class="space-y-4">
                <!-- 测试结果将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        // 复制修复后的函数
        const normalizeDate = (d) => { 
            const newDate = new Date(d); 
            newDate.setHours(0, 0, 0, 0); 
            return newDate; 
        };
        
        const getMonday = (d) => { 
            const date = normalizeDate(d); 
            const day = date.getDay(); 
            const diff = date.getDate() - day + (day === 0 ? -6 : 1); 
            return new Date(date.setDate(diff)); 
        };
        
        const getStartOfMonth = () => { 
            const d = new Date(); 
            d.setHours(0,0,0,0); 
            d.setDate(1); 
            return d; 
        };
        
        // 修复后的日期范围函数
        const getDateRangesForScope = (scope) => {
            const today = normalizeDate(new Date());
            let currentStart, currentEnd;
            let prevStart, prevEnd;
            if (scope === 'today') {
                currentStart = today; 
                currentEnd = new Date(today); 
                currentEnd.setDate(currentEnd.getDate() + 1); // 明天 00:00:00
                prevStart = new Date(today); 
                prevStart.setDate(prevStart.getDate() - 1); 
                prevEnd = today; // 今天 00:00:00
            } else if (scope === 'yesterday') {
                currentStart = new Date(today); currentStart.setDate(currentStart.getDate() - 1); 
                currentEnd = today; // 今天 00:00:00
                prevStart = new Date(currentStart); prevStart.setDate(prevStart.getDate() - 1); 
                prevEnd = currentStart;
            } else if (scope === 'weekly') {
                currentStart = getMonday(today); 
                currentEnd = new Date(currentStart); 
                currentEnd.setDate(currentEnd.getDate() + 7); // 下周一 00:00:00
                prevStart = new Date(currentStart); prevStart.setDate(prevStart.getDate() - 7); 
                prevEnd = currentStart;
            } else if (scope === 'monthly') {
                currentStart = getStartOfMonth(); 
                currentEnd = new Date(currentStart); 
                currentEnd.setMonth(currentEnd.getMonth() + 1); // 下月1号 00:00:00
                prevStart = new Date(currentStart); prevStart.setMonth(prevStart.getMonth() - 1); 
                prevEnd = currentStart;
            }
            return { currentStart, currentEnd, prevStart, prevEnd };
        };
        
        // 修复后的日志过滤函数
        const getLogsInDateRange = (fullHistory, startDate, endDate) => {
            if (!fullHistory) return "";
            const lines = fullHistory.split('\n');
            const filteredLines = [];
            const dateRegex = /(\d{4}-\d{1,2}-\d{1,2})/;
            const s = normalizeDate(startDate).getTime();
            const e = normalizeDate(endDate).getTime();
            for (let line of lines) {
                const match = line.match(dateRegex);
                if (match) {
                    const d = normalizeDate(match[1]).getTime();
                    if (d >= s && d < e) filteredLines.push(line); // 修复：使用 < 而不是 <=
                }
            }
            return filteredLines.join('\n');
        };
        
        function testDateRanges() {
            const resultsContainer = document.getElementById('test-results');
            resultsContainer.innerHTML = '';
            
            // 测试不同的范围
            const scopes = ['today', 'yesterday', 'weekly', 'monthly'];
            
            scopes.forEach(scope => {
                const ranges = getDateRangesForScope(scope);
                
                const div = document.createElement('div');
                div.className = 'bg-gray-50 border border-gray-200 rounded-lg p-4';
                div.innerHTML = `
                    <h3 class="font-bold text-gray-800 mb-2">${scope.toUpperCase()} 范围</h3>
                    <div class="text-sm text-gray-600 space-y-1">
                        <div><strong>当前开始:</strong> ${ranges.currentStart.toLocaleString()}</div>
                        <div><strong>当前结束:</strong> ${ranges.currentEnd.toLocaleString()}</div>
                        <div><strong>时间跨度:</strong> ${(ranges.currentEnd - ranges.currentStart) / (1000 * 60 * 60 * 24)} 天</div>
                    </div>
                `;
                resultsContainer.appendChild(div);
            });
            
            // 测试今日数据过滤
            const testDiv = document.createElement('div');
            testDiv.className = 'bg-green-50 border border-green-200 rounded-lg p-4 mt-4';
            
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
            const yesterdayStr = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate() - 1}`;
            const tomorrowStr = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate() + 1}`;
            
            const testHistory = `
[WORK] ${yesterdayStr}: 昨天的工作 2h | 09:00-11:00
[WORK] ${todayStr}: 今天的工作 3h | 09:00-12:00
[STUDY] ${todayStr}: 今天的学习 1h | 14:00-15:00
[WORK] ${tomorrowStr}: 明天的工作 2h | 09:00-11:00
            `.trim();
            
            const { currentStart, currentEnd } = getDateRangesForScope('today');
            const todayLogs = getLogsInDateRange(testHistory, currentStart, currentEnd);
            const todayLines = todayLogs.split('\n').filter(l => l.trim());
            
            testDiv.innerHTML = `
                <h3 class="font-bold text-green-800 mb-2">今日数据过滤测试</h3>
                <div class="text-sm text-green-700 space-y-2">
                    <div><strong>测试数据:</strong> 4 条记录 (昨天1条, 今天2条, 明天1条)</div>
                    <div><strong>过滤结果:</strong> ${todayLines.length} 条今日记录</div>
                    <div><strong>过滤内容:</strong></div>
                    <div class="bg-white rounded p-2 text-xs">
                        ${todayLines.map(line => `<div>${line}</div>`).join('')}
                    </div>
                    <div class="font-bold ${todayLines.length === 2 ? 'text-green-600' : 'text-red-600'}">
                        ${todayLines.length === 2 ? '✅ 过滤正确！' : '❌ 过滤错误！'}
                    </div>
                </div>
            `;
            resultsContainer.appendChild(testDiv);
        }
        
        // 绑定事件
        document.getElementById('test-date-ranges').onclick = testDateRanges;
        
        // 页面加载时自动测试
        window.onload = testDateRanges;
    </script>
</body>
</html>
