<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复验证测试</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; background: #007bff; color: white; }
        .log { background: #f8f9fa; padding: 10px; border-radius: 4px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 DeepSeek JSON 解析修复验证</h1>
        
        <div class="test-section">
            <h3>🧪 测试 parseJSONSafely 函数</h3>
            <button onclick="testParseJSONSafely()">测试 JSON 解析</button>
            <button onclick="clearLogs()">清空日志</button>
        </div>

        <div class="test-section">
            <h3>📝 测试日志</h3>
            <div id="logs" class="log"></div>
        </div>
    </div>

    <script>
        let logContainer = document.getElementById('logs');

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}\n`;
            logContainer.textContent += logEntry;
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(message);
        }

        function clearLogs() {
            logContainer.textContent = '';
        }

        // 复制主应用中改进后的 parseJSONSafely 函数
        const parseJSONSafely = (text) => {
          try { 
            return JSON.parse(text); 
          } catch (e) { 
            try { 
              // 移除 markdown 代码块标记
              let cleanText = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
              return JSON.parse(cleanText); 
            } catch (e2) { 
              try {
                // 尝试提取 JSON 部分
                const jsonMatch = text.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                  return JSON.parse(jsonMatch[0]);
                }
                throw new Error("无法找到有效的 JSON 内容");
              } catch (e3) {
                console.error('JSON 解析失败:', { originalText: text, error: e3.message });
                throw new Error(`无法解析 AI 返回的数据: ${e3.message}`); 
              }
            }
          }
        };

        function testParseJSONSafely() {
            log('🧪 开始测试 parseJSONSafely 函数...');

            // 测试用例1: 标准 JSON
            const test1 = '{"greeting": "Hello World"}';
            try {
                const result1 = parseJSONSafely(test1);
                log('✅ 测试1 (标准JSON) 通过: ' + JSON.stringify(result1));
            } catch (e) {
                log('❌ 测试1 (标准JSON) 失败: ' + e.message);
            }

            // 测试用例2: 带 markdown 代码块的 JSON
            const test2 = '```json\n{"greeting": "Hello World"}\n```';
            try {
                const result2 = parseJSONSafely(test2);
                log('✅ 测试2 (markdown代码块) 通过: ' + JSON.stringify(result2));
            } catch (e) {
                log('❌ 测试2 (markdown代码块) 失败: ' + e.message);
            }

            // 测试用例3: 复杂的计划生成响应 (模拟DeepSeek实际返回)
            const test3 = `\`\`\`json
{
    "theme_title": "高效工作日：专注与平衡",
    "advice": "根据您的高能量和好心情状态，建议利用上午高效时段处理复杂工作。",
    "blocks": [
        {
            "time": "09:00 - 09:25",
            "category": "work",
            "title": "番茄工作1：优先级任务启动",
            "desc": "处理今日最重要的工作任务"
        }
    ]
}
\`\`\``;
            try {
                const result3 = parseJSONSafely(test3);
                log('✅ 测试3 (复杂计划响应) 通过: ' + JSON.stringify(result3, null, 2));
            } catch (e) {
                log('❌ 测试3 (复杂计划响应) 失败: ' + e.message);
            }

            // 测试用例4: 复盘生成响应
            const test4 = `\`\`\`json
{
    "summary": "今日工作表现良好但学习未达标",
    "insights": [
        "行为模式：工作时段集中但存在午间长时间中断",
        "习惯延续预测：若维持现状，工作产出可能饱和",
        "三项保护原则：1.保护每日深度学习时段",
        "时间调整建议：将19:00-20:30固定为深度学习时段"
    ]
}
\`\`\``;
            try {
                const result4 = parseJSONSafely(test4);
                log('✅ 测试4 (复盘响应) 通过: ' + JSON.stringify(result4, null, 2));
            } catch (e) {
                log('❌ 测试4 (复盘响应) 失败: ' + e.message);
            }

            // 测试用例5: 混合文本中的 JSON
            const test5 = `这是一些前置文本
            
{
    "test": "success",
    "message": "这是嵌入在文本中的JSON"
}

这是一些后置文本`;
            try {
                const result5 = parseJSONSafely(test5);
                log('✅ 测试5 (混合文本JSON) 通过: ' + JSON.stringify(result5));
            } catch (e) {
                log('❌ 测试5 (混合文本JSON) 失败: ' + e.message);
            }

            // 测试用例6: 无效内容
            const test6 = '这是完全无效的内容，没有任何JSON';
            try {
                const result6 = parseJSONSafely(test6);
                log('❌ 测试6 (无效内容) 意外通过: ' + JSON.stringify(result6));
            } catch (e) {
                log('✅ 测试6 (无效内容) 正确失败: ' + e.message);
            }

            log('🏁 所有测试完成');
        }

        // 页面加载时的初始化
        window.onload = function() {
            log('🚀 JSON 解析修复验证工具已加载');
            log('点击按钮开始测试 parseJSONSafely 函数的各种情况');
        };
    </script>
</body>
</html>
