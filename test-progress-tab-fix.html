<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgressTabContent 修复测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const ProgressTabFixTest = () => {
            const [testStatus, setTestStatus] = useState('ready');
            const [errorDetails, setErrorDetails] = useState(null);

            const testMainApp = async () => {
                setTestStatus('testing');
                setErrorDetails(null);
                
                try {
                    // 测试主应用是否可以访问
                    const response = await fetch('/index.html');
                    if (response.ok) {
                        // 检查页面内容是否包含 ProgressTabContent
                        const content = await response.text();
                        
                        if (content.includes('const ProgressTabContent')) {
                            setTestStatus('success');
                        } else {
                            setTestStatus('warning');
                            setErrorDetails('ProgressTabContent 组件未找到');
                        }
                    } else {
                        setTestStatus('error');
                        setErrorDetails(`HTTP ${response.status}: ${response.statusText}`);
                    }
                } catch (error) {
                    setTestStatus('error');
                    setErrorDetails(error.message);
                }
            };

            const openMainApp = () => {
                window.open('/index.html', '_blank');
            };

            return (
                <div className="min-h-screen bg-gray-50 p-8">
                    <div className="max-w-4xl mx-auto">
                        <h1 className="text-3xl font-bold mb-8 text-center">ProgressTabContent 修复测试</h1>
                        
                        <div className="bg-white rounded-lg shadow-sm p-8 mb-8">
                            <h2 className="text-xl font-semibold mb-6">修复内容</h2>
                            
                            <div className="space-y-4">
                                <div className="flex items-center gap-3 p-4 bg-green-50 border border-green-200 rounded-lg">
                                    <div className="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center text-white text-sm font-bold">✓</div>
                                    <div>
                                        <div className="font-medium text-green-800">组件定义位置修复</div>
                                        <div className="text-sm text-green-600">将 ProgressTabContent 移动到 renderReviewPage 之前</div>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-3 p-4 bg-green-50 border border-green-200 rounded-lg">
                                    <div className="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center text-white text-sm font-bold">✓</div>
                                    <div>
                                        <div className="font-medium text-green-800">ReferenceError 修复</div>
                                        <div className="text-sm text-green-600">确保组件在调用前已定义</div>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-3 p-4 bg-green-50 border border-green-200 rounded-lg">
                                    <div className="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center text-white text-sm font-bold">✓</div>
                                    <div>
                                        <div className="font-medium text-green-800">重复代码清理</div>
                                        <div className="text-sm text-green-600">删除了重复的组件定义</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-lg shadow-sm p-8 mb-8">
                            <h2 className="text-xl font-semibold mb-6">测试结果</h2>
                            
                            <div className="text-center">
                                {testStatus === 'ready' && (
                                    <div>
                                        <button 
                                            onClick={testMainApp}
                                            className="px-8 py-4 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-semibold mr-4"
                                        >
                                            测试主应用
                                        </button>
                                        <button 
                                            onClick={openMainApp}
                                            className="px-8 py-4 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-semibold"
                                        >
                                            直接打开主应用
                                        </button>
                                    </div>
                                )}
                                
                                {testStatus === 'testing' && (
                                    <div className="flex flex-col items-center">
                                        <div className="w-8 h-8 border-4 border-blue-200 border-t-blue-500 rounded-full animate-spin mb-4"></div>
                                        <p className="text-gray-600">正在测试主应用...</p>
                                    </div>
                                )}
                                
                                {testStatus === 'success' && (
                                    <div className="text-center">
                                        <div className="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4">✓</div>
                                        <h3 className="text-xl font-semibold text-green-800 mb-2">修复成功！</h3>
                                        <p className="text-green-600 mb-6">ProgressTabContent 组件已正确定义</p>
                                        <button 
                                            onClick={openMainApp}
                                            className="px-8 py-4 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors font-semibold"
                                        >
                                            访问主应用测试复盘页面
                                        </button>
                                    </div>
                                )}
                                
                                {testStatus === 'warning' && (
                                    <div className="text-center">
                                        <div className="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4">⚠</div>
                                        <h3 className="text-xl font-semibold text-yellow-800 mb-2">需要检查</h3>
                                        <p className="text-yellow-600 mb-2">{errorDetails}</p>
                                        <p className="text-yellow-600 mb-6">请检查组件定义是否正确</p>
                                        <div className="flex gap-4 justify-center">
                                            <button 
                                                onClick={() => setTestStatus('ready')}
                                                className="px-6 py-3 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-colors"
                                            >
                                                重试
                                            </button>
                                            <button 
                                                onClick={openMainApp}
                                                className="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                                            >
                                                仍然尝试访问
                                            </button>
                                        </div>
                                    </div>
                                )}
                                
                                {testStatus === 'error' && (
                                    <div className="text-center">
                                        <div className="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center text-white text-2xl font-bold mx-auto mb-4">✗</div>
                                        <h3 className="text-xl font-semibold text-red-800 mb-2">连接失败</h3>
                                        <p className="text-red-600 mb-2">{errorDetails}</p>
                                        <p className="text-red-600 mb-6">请检查服务器状态</p>
                                        <button 
                                            onClick={() => setTestStatus('ready')}
                                            className="px-6 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
                                        >
                                            重试
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-6">
                            <h3 className="font-semibold text-blue-800 mb-3">修复说明</h3>
                            <div className="text-blue-700 space-y-2">
                                <p><strong>问题</strong>: ReferenceError: ProgressTabContent is not defined</p>
                                <p><strong>原因</strong>: 组件在被调用时还没有定义（定义在后面）</p>
                                <p><strong>解决</strong>: 将组件定义移动到 renderReviewPage 函数之前</p>
                                <p><strong>结果</strong>: 复盘页面现在应该可以正常工作</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<ProgressTabFixTest />, document.getElementById('root'));
    </script>
</body>
</html>
